<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Refricenter Pro - Sistema Operacional</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --blue: #01579B; --orange: #FF8F00; --bg: #E0F2F7; }
        * { box-sizing: border-box; font-family: sans-serif; }
        body { margin: 0; background: var(--bg); overflow: hidden; }
        header { background: var(--blue); color: white; padding: 10px; display: flex; justify-content: space-between; border-bottom: 3px solid var(--orange); }
        .main-container { height: 85vh; overflow-y: auto; padding: 15px; padding-bottom: 100px; }
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .view { display: none; } .active { display: block; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; }
        .btn { background: var(--orange); color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; }
        .drawer { position: fixed; top: 0; left: -100%; width: 260px; height: 100%; background: white; z-index: 2000; transition: 0.3s; box-shadow: 2px 0 10px rgba(0,0,0,0.2); }
        .drawer.open { left: 0; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 15px; border-bottom: 1px solid #eee; text-decoration: none; color: var(--blue); font-weight: bold; }
        #res-diag { background: #f9f9f9; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 14px; line-height: 1.5; color: #333; }
    </style>
</head>
<body>

<div class="drawer" id="sideNav">
    <div style="padding: 20px; background: var(--blue); color: white;">MENU REFRICENTER</div>
    <a href="#" class="nav-item" onclick="navigate('v-serv')"><i class="fas fa-tools"></i> Orçamentos</a>
    <a href="#" class="nav-item" onclick="navigate('v-calc')"><i class="fas fa-calculator"></i> Calculadora BTU</a>
    <a href="#" class="nav-item" onclick="navigate('v-diag')"><i class="fas fa-microchip"></i> Guia de Erros</a>
    <a href="#" class="nav-item" onclick="localStorage.clear(); location.reload();"><i class="fas fa-sync"></i> Resetar App</a>
</div>

<header>
    <span>REFRICENTER <b>PRO</b></span>
    <i class="fas fa-bars" onclick="document.getElementById('sideNav').classList.toggle('open')"></i>
</header>

<div class="main-container">
    <div id="v-calc" class="view">
        <div class="card">
            <div style="font-weight:bold; color:var(--blue); margin-bottom:10px;">CALCULADORA DE CARGA TÉRMICA</div>
            <label>Largura do Ambiente (metros)</label>
            <input type="number" id="c-larg" placeholder="Ex: 4">
            <label>Comprimento (metros)</label>
            <input type="number" id="c-comp" placeholder="Ex: 5">
            <label>Número de Pessoas</label>
            <input type="number" id="c-pes" value="2">
            <label>Eletrônicos (TV, PC...)</label>
            <input type="number" id="c-ele" value="1">
            <label>Exposição ao Sol?</label>
            <select id="c-sol">
                <option value="600">Manhã (600 BTU/m²)</option>
                <option value="800">Tarde/Dia Todo (800 BTU/m²)</option>
            </select>
            <button class="btn" onclick="calcularBTU()">CALCULAR AGORA</button>
            <div id="res-calc" style="margin-top:15px; text-align:center; font-weight:bold; color:var(--blue); font-size:20px;"></div>
        </div>
    </div>

    <div id="v-diag" class="view">
        <div class="card">
            <div style="font-weight:bold; color:var(--blue); margin-bottom:10px;">DIAGNÓSTICO TÉCNICO</div>
            <select id="d-marca" onchange="buscarErro()">
                <option value="">Selecione a Marca</option>
                <option value="lg">LG</option>
                <option value="samsung">Samsung</option>
                <option value="gree">Gree</option>
                <option value="midea">Midea/Carrier</option>
            </select>
            <div id="res-diag">Escolha uma marca para ver os códigos...</div>
        </div>
    </div>

    <div id="v-serv" class="view active">
        <div class="card">
            <h3>Seja Bem-vindo</h3>
            <p>Use o menu lateral para acessar a Calculadora e o Guia de Erros.</p>
            <button class="btn" onclick="navigate('v-calc')">IR PARA CALCULADORA</button>
        </div>
    </div>
</div>

<script>
    // BANCO DE DADOS DE ERROS (BASEADO NAS SUAS INFOS)
    const DB_ERROS = {
        lg: "<b>INVERTER:</b><br>CH01/02: Sensor de Temperatura<br>CH05/53: Falha de Comunicação UI/UE<br>CH06: Sensor de Descarga<br>CH10: Motor Ventilador UI<br><br><b>CONVENCIONAL:</b><br>C1/CH01: Sensor Ambiente<br>C2/CH02: Sensor Serpentina",
        samsung: "<b>INVERTER:</b><br>E1 01: Erro de Comunicação Serial<br>E1 21: Erro Sensor Ambiente UI<br>E1 22: Erro Sensor Serpentina<br>E4 58: Erro Ventilador Externo<br><br><b>CONVENCIONAL:</b><br>E1: Sensor Interno<br>E2: Sensor Degelo",
        gree: "<b>INVERTER:</b><br>E6: Falha de Sinal/Comunicação<br>H6: Erro Motor Ventilador Interno<br>F1: Sensor Ambiente Interno<br><br><b>CONVENCIONAL:</b><br>E1: Alta Pressão<br>E2: Proteção Anti-congelamento",
        midea: "<b>INVERTER:</b><br>E1: Erro Comunicação entre Placas<br>PC 00: Proteção Módulo IPM<br>EC: Vazamento Fluido/Gás<br>P4: Erro Compressor/Inversor"
    };

    function navigate(v) {
        document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
        document.getElementById(v).classList.add('active');
        document.getElementById('sideNav').classList.remove('open');
    }

    // LÓGICA DA CALCULADORA BTU
    function calcularBTU() {
        const larg = parseFloat(document.getElementById('c-larg').value);
        const comp = parseFloat(document.getElementById('c-comp').value);
        const pes = parseInt(document.getElementById('c-pes').value);
        const ele = parseInt(document.getElementById('c-ele').value);
        const sol = parseInt(document.getElementById('c-sol').value);

        if(!larg || !comp) return alert("Preencha as medidas do quarto!");

        // FÓRMULA: (Área * Sol) + (Pessoas-1 * Sol) + (Eletrônicos * Sol)
        let area = larg * comp;
        let total = (area * sol) + ((pes - 1) * sol) + (ele * sol);

        document.getElementById('res-calc').innerHTML = `Resultado: ${total.toLocaleString()} BTUs<br><small style="font-size:12px; color:gray;">Recomendado: Aparelho de ${proximaPotencia(total)} BTUs</small>`;
    }

    function proximaPotencia(val) {
        if(val <= 9000) return "9.000";
        if(val <= 12000) return "12.000";
        if(val <= 18000) return "18.000";
        if(val <= 24000) return "24.000";
        return "30.000+";
    }

    // LÓGICA DO GUIA DE ERROS
    function buscarErro() {
        const marca = document.getElementById('d-marca').value;
        const display = document.getElementById('res-diag');
        if(marca && DB_ERROS[marca]) {
            display.innerHTML = DB_ERROS[marca];
        } else {
            display.innerText = "Selecione uma marca válida.";
        }
    }
</script>
</body>
</html>
