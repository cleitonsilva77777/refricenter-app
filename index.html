<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refricenter App</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Refricenter">
    
    <link rel="icon" href="banner.png">
    <link rel="apple-touch-icon" href="banner.png">

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --azul: #002D4C; --verde: #25d366; --bg: #F5F7FA; --laranja: #E67E22; }
        body { font-family: 'Roboto', sans-serif; background: var(--bg); margin: 0; padding-bottom: 80px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: white; border-bottom: 1px solid #ddd; position: sticky; top: 0; z-index: 100; }
        .container-banner { text-align: center; padding: 10px; background: white; }
        .banner-img { width: 90%; max-width: 320px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .tela { display: none; padding: 15px; }
        .tela.active { display: block; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 4px solid var(--azul); }
        h3 { text-align: center; color: var(--azul); margin-top: 0; }
        label { font-size: 0.75rem; font-weight: bold; color: #666; text-transform: uppercase; }
        input, select { width: 100%; padding: 14px; margin: 8px 0 18px 0; border-radius: 12px; border: 1px solid #ddd; box-sizing: border-box; font-size: 1rem; }
        .resumo { background: #1a1a1a; color: white; border-radius: 18px; padding: 25px; text-align: center; }
        .v-final { font-size: 2.8rem; font-weight: bold; color: var(--verde); display: block; }
        .btn-acao { display: block; background: var(--azul); color: white; text-align: center; padding: 16px; border-radius: 12px; text-decoration: none; font-weight: bold; margin-top: 15px; border: none; width: 100%; cursor: pointer; font-size: 1rem; }
        .btn-zap { background: var(--verde); }
        .nav-bar { display: flex; justify-content: space-around; background: white; position: fixed; bottom: 0; width: 100%; height: 70px; border-top: 1px solid #ddd; }
        .nav-item { border: none; background: none; color: #999; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.8rem; cursor: pointer; }
        .nav-item.active { color: var(--azul); font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <div style="font-size: 20px;">☰</div>
    <span style="font-weight: bold; color: var(--azul);">REFRICENTER</span>
    <div style="font-size: 24px; cursor: pointer;" onclick="acessoAdmin()">👤</div>
</div>

<div class="container-banner">
    <img src="banner.png" class="banner-img">
</div>

<div id="inicio" class="tela active">
    <div class="card">
        <h3>Solicitar Orçamento</h3>
        <label>Nome do Cliente:</label>
        <input type="text" id="nome_cliente" placeholder="Digite o nome">
        <label>Endereço:</label>
        <input type="text" id="end_cliente" placeholder="Rua e Bairro">
        <button class="btn-acao" onclick="switchTab('precos')">VER PREÇOS ➔</button>
    </div>
</div>

<div id="precos" class="tela">
    <div class="card">
        <h3>Tabela Refricenter</h3>
        <label>Serviço:</label>
        <select id="serv" onchange="calc()">
            <option value="Completa">🛠️ Instalação (Com Material)</option>
            <option value="Mão de Obra">🛠️ Instalação (Só Mão de Obra)</option>
            <option value="Limpeza">🧼 Limpeza Completa</option>
            <option value="Gás">🧪 Carga de Gás</option>
        </select>
        <label>Capacidade:</label>
        <select id="tipo" onchange="calc()">
            <option value="9-12k">9.000 a 12.000 BTUs</option>
            <option value="18k">18.000 BTUs</option>
            <option value="22k">22.000 BTUs</option>
            <option value="24k">24.000 BTUs</option>
            <option value="30k">30.000 BTUs</option>
            <option value="36k">36.000 BTUs</option>
        </select>
        <label>Pagamento:</label>
        <select id="pagamento" onchange="calc()">
            <option value="cartao">💳 Cartão / Prazo</option>
            <option value="a_vista">💵 PIX ou Dinheiro (5% OFF)</option>
        </select>
        <div class="resumo">
            <span id="preco" class="v-final">R$ 0,00</span>
        </div>
        <button class="btn-acao btn-zap" onclick="finalizar()">✅ FINALIZAR NO WHATSAPP</button>
    </div>
</div>

<div id="admin" class="tela">
    <div class="card" style="border-top-color: var(--laranja);">
        <h3 style="color: var(--laranja);">Painel Administrativo</h3>
        <a href="https://webhook.site/#!/daecd39b-3d58-45db-b689-bf6d8e16d558" target="_blank" class="btn-acao" style="background: var(--laranja);">
            🔍 ABRIR HISTÓRICO
        </a>
        <button class="btn-acao" style="background: #95a5a6; margin-top: 20px;" onclick="switchTab('inicio')">VOLTAR</button>
    </div>
</div>

<div class="nav-bar">
    <div id="nav-inicio" class="nav-item active" onclick="switchTab('inicio')">🏠<br>Início</div>
    <div id="nav-precos" class="nav-item" onclick="switchTab('precos')">💰<br>Preços</div>
</div>

<script>
const tabela = {
    "Completa": {"9-12k": 600, "18k": 850, "22k": 900, "24k": 950, "30k": 1150, "36k": 1250},
    "Mão de Obra": {"9-12k": 200, "18k": 350, "22k": 400, "24k": 450, "30k": 650, "36k": 750},
    "Limpeza": {"9-12k": 200, "18k": 250, "22k": 300, "24k": 350, "30k": 450, "36k": 550},
    "Gás": {"9-12k": 180, "18k": 250, "22k": 300, "24k": 350, "30k": 450, "36k": 550}
};

const WEBHOOK_URL = "https://webhook.site/daecd39b-3d58-45db-b689-bf6d8e16d558";

function acessoAdmin() {
    let senha = prompt("Senha do Admin:");
    if(senha === "777") switchTab('admin');
}

function switchTab(t) {
    document.querySelectorAll('.tela').forEach(e => e.classList.remove('active'));
    document.getElementById(t).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
    if(t === 'inicio') document.getElementById('nav-inicio').classList.add('active');
    if(t === 'precos') document.getElementById('nav-precos').classList.add('active');
}

function calc() {
    const s = document.getElementById('serv').value;
    const tp = document.getElementById('tipo').value;
    const pag = document.getElementById('pagamento').value;
    let base = tabela[s][tp];
    let final = (pag === 'a_vista') ? base * 0.95 : base;
    document.getElementById('preco').innerText = "R$ " + final.toFixed(2).replace('.',',');
}

function finalizar() {
    const nome = document.getElementById('nome_cliente').value || "Cliente";
    const end = document.getElementById('end_cliente').value || "Não informado";
    const s = document.getElementById('serv').value;
    const tp = document.getElementById('tipo').value;
    const valor = document.getElementById('preco').innerText;

    fetch(WEBHOOK_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({cliente: nome, endereco: end, servico: s, potencia: tp, total: valor}) });

    const msg = encodeURIComponent(`*REFRICENTER*\n\n👤 *Cliente:* ${nome}\n🛠️ *Serviço:* ${s} (${tp})\n💰 *Total:* ${valor}`);
    window.open("https://wa.me/5568992447004?text=" + msg);
}
calc();
</script>
</body>
</html>
