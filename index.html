<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refricenter - Orçamentos</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#002D4C">
    <link rel="apple-touch-icon" href="images/icon.png">

    <style>
        :root { 
            --azul-escuro: #001a2d;
            --azul-medio: #002D4C;
            --azul-claro: #004a80;
            --verde: #25d366;
            --cinza-fundo: #f0f2f5;
        }

        body { font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; margin: 0; padding: 0; background-color: var(--cinza-fundo); color: #333; }
        
        /* Cabeçalho Profissional com Degradê e Símbolos */
        header { 
            position: relative;
            background: linear-gradient(135deg, var(--azul-escuro) 0%, var(--azul-medio) 50%, var(--azul-claro) 100%);
            color: white; 
            padding: 50px 20px; 
            text-align: center; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            border-bottom: 4px solid var(--azul-claro);
            overflow: hidden;
        }

        /* Símbolos de Neve em Marca-d'água */
        header::before { content: "❄️"; position: absolute; font-size: 80px; opacity: 0.1; top: 10px; left: -20px; transform: rotate(-20deg); }
        header::after { content: "❄️"; position: absolute; font-size: 60px; opacity: 0.08; bottom: 10px; right: -10px; transform: rotate(15deg); }

        /* Linhas de Conexão (Efeito Tecnológico) */
        .header-lines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(45deg, rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(-45deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            opacity: 0.5;
        }

        .header-content { position: relative; z-index: 2; }
        header h1 { margin: 0; font-size: 32px; letter-spacing: 3px; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,0.6); font-weight: 900; }
        header p { margin: 10px 0 0; opacity: 0.9; font-size: 15px; font-weight: 300; letter-spacing: 1px; }

        .container { padding: 25px 15px; max-width: 500px; margin: auto; }
        
        /* Cards de Serviço */
        .card { 
            background: white; padding: 25px; border-radius: 18px; 
            box-shadow: 0 12px 30px rgba(0,0,0,0.07); margin-bottom: 30px; 
            text-align: left; border: 1px solid rgba(0,0,0,0.03);
        }

        .card-header { display: flex; align-items: center; margin-bottom: 22px; border-bottom: 2px solid #f0f2f5; padding-bottom: 15px; }
        .card-header img { width: 38px; height: 38px; margin-right: 15px; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.15)); }
        .card-header h3 { margin: 0; font-size: 21px; color: var(--azul-medio); font-weight: 800; }

        label { display: block; margin-top: 18px; font-weight: 700; font-size: 13px; color: #777; text-transform: uppercase; }
        select { width: 100%; padding: 15px; margin-top: 10px; border-radius: 12px; border: 1px solid #e1e5eb; font-size: 16px; background: #fff; appearance: none; color: #333; }

        .resultado-box { background: #fbfdff; padding: 22px; border-radius: 14px; margin-top: 25px; border: 1px solid #e1ecf8; text-align: center; }
        .total-linha { font-size: 28px; color: var(--azul-medio); font-weight: 800; }
        .pix-aviso { color: #28a745; font-size: 15px; font-weight: 700; margin-top: 8px; }
        
        .btn-whatsapp { 
            background: linear-gradient(to bottom, #29e671, #21bc5a);
            color: white; padding: 20px; text-decoration: none; border-radius: 14px; 
            font-weight: 700; display: block; margin-top: 20px; text-align: center; 
            font-size: 18px; box-shadow: 0 6px 20px rgba(37, 211, 102, 0.35);
        }
    </style>
</head>
<body>

<header>
    <div class="header-lines"></div>
    <div class="header-content">
        <h1>REFRICENTER</h1>
        <p>Soluções em Refrigeração e Climatização</p>
    </div>
</header>

<div class="container">
    <div class="card">
        <div class="card-header">
            <img src="images/instalacao.png" alt="Instalação">
            <h3>Instalação</h3>
        </div>
        
        <label>Capacidade (BTUs):</label>
        <select id="btu" onchange="calcular()">
            <option value="0" data-obra="0" data-comp="0">Selecione...</option>
            <option value="912" data-obra="200" data-comp="600">9.000 e 12.000 BTUs</option>
            <option value="18" data-obra="350" data-comp="850">18.000 BTUs</option>
            <option value="22" data-obra="400" data-comp="900">22.000 BTUs</option>
            <option value="24" data-obra="450" data-comp="950">24.000 BTUs</option>
            <option value="30" data-obra="650" data-comp="1150">30.000 BTUs</option>
            <option value="36" data-obra="750" data-comp="1250">36.000 BTUs</option>
        </select>

        <label>Tipo de Serviço:</label>
        <select id="material" onchange="calcular()">
            <option value="obra">Apenas Mão de Obra</option>
            <option value="completa">Completa (Com Material)</option>
        </select>

        <label>Forma de Pagamento:</label>
        <select id="pagamento" onchange="calcular()">
            <option value="1">Cartão de Crédito</option>
            <option value="0.95">PIX (5% de Desconto)</option>
        </select>

        <div id="res_box" class="resultado-box" style="display:none;">
            <div class="total-linha" id="total_final">R$ 0,00</div>
            <div id="aviso_pix" class="pix-aviso"></div>
            <a id="link_zap" href="#" onclick="enviarDados()" class="btn-whatsapp">Finalizar no WhatsApp</a>
        </div>
    </div>
</div>

<script>
    const WEBHOOK_URL = "https://webhook.site/daecd39b-3d58-45db-b689-bf6d8e16d558";
    const MEU_ZAP = "5568999999999"; // COLOQUE SEU NÚMERO AQUI

    function calcular() {
        const btuSel = document.getElementById('btu');
        const opt = btuSel.options[btuSel.selectedIndex];
        const tipo = document.getElementById('material').value;
        const desc = parseFloat(document.getElementById('pagamento').value);
        
        let preco = (tipo === 'obra') ? parseFloat(opt.getAttribute('data-obra')) : parseFloat(opt.getAttribute('data-comp'));
        
        if(preco > 0) {
            document.getElementById('res_box').style.display = 'block';
            let total = preco * desc;
            document.getElementById('total_final').innerText = "Total: R$ " + total.toFixed(2);
            document.getElementById('aviso_pix').innerText = desc < 1 ? "✓ Desconto de 5% no PIX aplicado" : "";
            
            const msg = `*Orçamento Refricenter*%0A*Instalação:* ${opt.text}%0A*Tipo:* ${tipo === 'obra' ? 'Mão de Obra' : 'Completa'}%0A*Total:* R$ ${total.toFixed(2)}`;
            document.getElementById('link_zap').href = `https://wa.me/${MEU_ZAP}?text=${msg}`;
        } else {
            document.getElementById('res_box').style.display = 'none';
        }
    }

    function enviarDados() {
        const btu = document.getElementById('btu').options[document.getElementById('btu').selectedIndex].text;
        const valor = document.getElementById('total_final').innerText;
        
        fetch(WEBHOOK_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                servico: "Instalação",
                potencia: btu,
                total: valor,
                data: new Date().toLocaleString()
            })
        });
    }

    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js'); }
</script>
</body>
</html>
