<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Refricenter Pro - Titanium v8.5 Gold</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --blue: #01579B; --orange: #FF8F00; --green: #28a745; --bg: #E0F2F7; --white: #FFFFFF; --danger: #dc3545; --gray: #6c757d; --insta: #E4405F; --fb: #1877F2; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        header { background: var(--blue); color: white; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 4px solid var(--orange); z-index: 100; }
        .logo-box { background: white; padding: 4px 8px; border-radius: 4px; display: flex; align-items: center; }
        .logo-box img { height: 25px; }
        
        /* MENU GAVETA */
        .drawer { position: fixed; top: 0; left: -100%; width: 280px; height: 100%; background: white; z-index: 2000; transition: 0.3s; box-shadow: 10px 0 30px rgba(0,0,0,0.3); }
        .drawer.open { left: 0; }
        .drawer-header { background: var(--blue); color: white; padding: 30px 20px; font-weight: 800; border-bottom: 4px solid var(--orange); }
        .nav-item { display: flex; align-items: center; gap: 15px; padding: 18px 25px; border-bottom: 1px solid #f0f0f0; text-decoration: none; color: var(--blue); font-weight: 600; cursor: pointer; }
        .social-menu { display: flex; justify-content: space-around; padding: 20px; background: #f9f9f9; }
        .social-menu a { font-size: 24px; }

        .container { flex: 1; overflow-y: auto; padding: 15px 15px 80px 15px; } /* Padding bottom para não cobrir o footer */
        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--white); border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .card-title { font-weight: 800; color: var(--blue); border-left: 5px solid var(--orange); padding-left: 10px; margin-bottom: 15px; text-transform: uppercase; font-size: 0.9rem; }
        
        input, select { width: 100%; padding: 14px; margin: 8px 0; border-radius: 10px; border: 1px solid #eee; font-size: 16px; background: #fafafa; outline: none; }
        label { font-size: 0.8rem; font-weight: bold; color: #666; margin-top: 10px; display: block; }

        /* BOTOES E PREÇO */
        .container-desc { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-desc { flex: 1; border: 2px solid #ddd; border-radius: 12px; padding: 10px; text-align: center; cursor: pointer; font-weight: bold; font-size: 0.75rem; background: #f8f9fa; }
        .btn-desc.active { border-color: var(--green); background: #e8f5e9; transform: scale(1.03); }
        .btn-desc span { display: block; font-size: 1.1rem; color: var(--blue); }

        .resultado-box { background: #f0f7ff; border: 2px solid var(--blue); border-radius: 15px; padding: 15px; text-align: center; margin-top: 20px; }
        .v-final { font-size: 2.2rem; font-weight: bold; color: var(--green); display: block; }
        
        .btn-orange { background: var(--orange); color: white; border: none; padding: 16px; border-radius: 10px; font-weight: 800; width: 100%; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .btn-zap { background: #25d366; color: white; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px; border-radius: 10px; font-weight: bold; margin-top: 15px; }
        .btn-clear { background: var(--gray); color: white; border: none; padding: 12px; border-radius: 10px; width: 100%; margin-top: 10px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }

        /* RODAPÉ SOCIAL */
        footer { background: var(--white); border-top: 2px solid #eee; padding: 10px; display: flex; justify-content: space-around; position: fixed; bottom: 0; width: 100%; z-index: 100; }
        .foot-item { text-align: center; text-decoration: none; color: var(--gray); font-size: 0.7rem; font-weight: bold; }
        .foot-item i { display: block; font-size: 1.5rem; margin-bottom: 3px; }
        .foot-item.active { color: var(--blue); }

        /* GAME CANVAS */
        #game-canvas { background: #001f3f; width: 100%; height: 250px; border-radius: 15px; position: relative; overflow: hidden; }
        .game-obj { position: absolute; font-size: 25px; }
        .player { position: absolute; bottom: 10px; font-size: 35px; }
    </style>
</head>
<body>

<div class="drawer" id="sideNav">
    <div class="drawer-header">REFRICENTER TITANIUM</div>
    <div class="nav-item" onclick="nav('v-serv')"><i class="fas fa-file-invoice-dollar"></i> Orçamentos</div>
    <div class="nav-item" onclick="nav('v-calc')"><i class="fas fa-calculator"></i> Calc BTU</div>
    <div class="nav-item" onclick="nav('v-diag')"><i class="fas fa-microchip"></i> Guia de Erros</div>
    <div class="nav-item" onclick="nav('v-game')"><i class="fas fa-gamepad"></i> Refri-Game</div>
    
    <div style="padding: 20px; font-size: 0.8rem; color: #999; font-weight: bold; text-align: center;">SIGA-NOS NAS REDES</div>
    <div class="social-menu">
        <a href="https://instagram.com/refricenter" target="_blank" style="color: var(--insta);"><i class="fab fa-instagram"></i></a>
        <a href="https://facebook.com/refricenter" target="_blank" style="color: var(--fb);"><i class="fab fa-facebook"></i></a>
        <a href="https://goo.gl/maps/seulink" target="_blank" style="color: var(--danger);"><i class="fas fa-map-marker-alt"></i></a>
    </div>
</div>

<header>
    <div class="logo-box">
        <img src="https://cdn-icons-png.flaticon.com/512/950/950244.png">
        <span style="margin-left:8px; font-weight:900; color:var(--blue);">TITANIUM v8.5</span>
    </div>
    <i class="fas fa-bars" style="font-size:24px;" onclick="toggleMenu()"></i>
</header>

<div class="container">
    <div id="v-serv" class="view active">
        <div class="card">
            <div class="card-title">🎁 Cupons de Desconto</div>
            <div class="container-desc">
                <div id="btn5" class="btn-desc" onclick="ativarDesconto(0.95, 'btn5')"><span>5% OFF</span>1 Aparelho</div>
                <div id="btn10" class="btn-desc" onclick="ativarDesconto(0.90, 'btn10')"><span>10% OFF</span>2+ Aparelhos</div>
            </div>
            <label>Serviço:</label>
            <select id="serv" onchange="mudarServico()">
                <option value="inst">🛠️ Instalação Técnica</option>
                <option value="limp">🧼 Limpeza Completa</option>
                <option value="gas">🧪 Reposição de Gás</option>
            </select>
            <div id="box-material">
                <label>Material:</label>
                <select id="mat" onchange="calcularPreco()"><option value="com">Sim (Completa)</option><option value="sem">Não (Só Mão de Obra)</option></select>
            </div>
            <label>Capacidade/Tipo:</label>
            <select id="tipo" onchange="calcularPreco()"></select>
            <label>Quantidade:</label>
            <select id="qtd" onchange="validarDesconto(); calcularPreco();">
                <option value="1">1 Aparelho</option><option value="2">2 Aparelhos</option><option value="3">3 Aparelhos</option><option value="4">4 ou mais</option>
            </select>
            <label>Localização:</label>
            <select id="loc" onchange="calcularPreco()"><option value="c">Na Cidade</option><option value="f">Zona Rural / Distrito</option></select>
            <div class="resultado-box">
                <small id="txt-promo" style="color:var(--blue); font-weight:bold">VALOR ESTIMADO</small>
                <span id="preco" class="v-final">R$ 0,00</span>
            </div>
            <a id="link-zap" href="#" class="btn-zap"><i class="fab fa-whatsapp"></i> PEDIR PELO WHATSAPP</a>
            <button class="btn-clear" onclick="limparOrcamento()"><i class="fas fa-trash-alt"></i> LIMPAR TUDO</button>
        </div>
    </div>

    <div id="v-calc" class="view">
        <div class="card">
            <div class="card-title">Carga Térmica</div>
            <input type="number" id="area" placeholder="Área em m²">
            <select id="sol"><option value="600">Pouco Sol</option><option value="800">Muito Sol</option></select>
            <input type="number" id="pessoas" placeholder="Total de Pessoas">
            <button class="btn-orange" onclick="calcBTU()">CALCULAR</button>
            <div id="res-calc" style="margin-top:15px; font-weight:900; text-align:center; color:var(--blue);"></div>
        </div>
    </div>

    <div id="v-diag" class="view">
        <div class="card">
            <div class="card-title">Guia de Erros</div>
            <select id="marca" onchange="getErro()"><option value="">Marca...</option><option value="lg">LG</option><option value="samsung">Samsung</option><option value="gree">Gree</option><option value="midea">Midea</option></select>
            <div id="erro-box" style="margin-top:15px; background:#f9f9f9; padding:10px; border-radius:10px;"></div>
        </div>
    </div>

    <div id="v-game" class="view">
        <div class="card">
            <div id="game-canvas"><div id="score" style="color:white; padding:10px;">Pontos: 0</div><div id="p" class="player">👨‍🔧</div></div>
            <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; margin-top:15px;">
                <button class="btn-orange" onclick="moveGame(-15)"><i class="fas fa-arrow-left"></i></button>
                <button class="btn-orange" style="background:#00B0FF" onclick="shootGame()"><i class="fas fa-tint"></i></button>
                <button class="btn-orange" onclick="moveGame(15)"><i class="fas fa-arrow-right"></i></button>
            </div>
            <button class="btn-orange" style="background:var(--green);" onclick="startGame()">INICIAR REFRIGAME</button>
        </div>
    </div>
</div>

<footer>
    <a href="#" class="foot-item active" onclick="nav('v-serv')"><i class="fas fa-home"></i>Início</a>
    <a href="https://instagram.com/refricenter" target="_blank" class="foot-item"><i class="fab fa-instagram"></i>Instagram</a>
    <a href="https://wa.me/5568992447004" target="_blank" class="foot-item" style="color: var(--green);"><i class="fab fa-whatsapp"></i>Zap</a>
    <a href="#" class="foot-item" onclick="nav('v-diag')"><i class="fas fa-toolbox"></i>Técnico</a>
</footer>

<script>
    // --- LÓGICA DO SISTEMA ---
    let multiplicador = 1.0, cupomAtivo = '', pos = 45, pts = 0, gActive = false;
    const tabela = {
        inst: { sem: { "9-12k":{c:200, f:300}, "18k":{c:350, f:450}, "22k":{c:400, f:500}, "24k":{c:450, f:550}, "30k":{c:650, f:800}, "36k":{c:750, f:900} }, com: { "9-12k":{c:600, f:700}, "18k":{c:850, f:950}, "22k":{c:900, f:1000}, "24k":{c:950, f:1050}, "30k":{c:1150, f:1300}, "36k":{c:1250, f:1400} } },
        limp: { "9-12k":{c:200, f:280}, "18k":{c:250, f:330}, "22k":{c:300, f:380}, "24k":{c:350, f:430}, "30k":{c:450, f:550}, "36k":{c:550, f:650} },
        gas: { "r22":{c:400, f:500}, "r410":{c:450, f:550}, "r32":{c:500, f:600} }
    };

    function toggleMenu() { document.getElementById('sideNav').classList.toggle('open'); }
    function nav(id) { 
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.foot-item').forEach(f => f.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'v-serv') document.querySelector('footer a:nth-child(1)').classList.add('active');
        if(id === 'v-diag') document.querySelector('footer a:nth-child(4)').classList.add('active');
        if(document.getElementById('sideNav').classList.contains('open')) toggleMenu();
        gActive = false; 
    }

    function ativarDesconto(v, id) {
        multiplicador = v; cupomAtivo = id;
        document.getElementById('btn5').classList.remove('active');
        document.getElementById('btn10').classList.remove('active');
        document.getElementById(id).classList.add('active');
        validarDesconto(); calcularPreco();
    }

    function validarDesconto() {
        const q = parseInt(document.getElementById('qtd').value);
        if(cupomAtivo === 'btn10' && q < 2) {
            multiplicador = 1.0;
            document.getElementById('txt-promo').innerText = "CUPOM INVÁLIDO (MÍN. 2 UNID)";
            document.getElementById('txt-promo').style.color = "red";
        } else {
            document.getElementById('txt-promo').innerText = cupomAtivo ? "DESCONTO APLICADO!" : "VALOR ESTIMADO";
            document.getElementById('txt-promo').style.color = cupomAtivo ? "var(--green)" : "var(--blue)";
        }
    }

    function mudarServico() {
        const s = document.getElementById('serv').value, t = document.getElementById('tipo');
        document.getElementById('box-material').style.display = (s === 'inst') ? 'block' : 'none';
        t.innerHTML = (s !== 'gas') ? `<option value="9-12k">9-12.000 BTUs</option><option value="18k">18.000 BTUs</option><option value="22k">22.000 BTUs</option><option value="24k">24.000 BTUs</option><option value="30k">30.000 BTUs</option><option value="36k">36.000 BTUs</option>` : `<option value="r22">Gás Comum R22</option><option value="r410">Gás Ecológico R410</option><option value="r32">Gás Inverter R32</option>`;
        calcularPreco();
    }

    function calcularPreco() {
        const s = document.getElementById('serv').value, q = parseInt(document.getElementById('qtd').value), tp = document.getElementById('tipo').value, l = document.getElementById('loc').value, m = document.getElementById('mat').value;
        if(!tp) return;
        let base = (s === 'inst') ? tabela.inst[m][tp][l] : tabela[s][tp][l];
        let total = (base * q) * multiplicador;
        document.getElementById('preco').innerText = "R$ " + total.toFixed(2).replace('.',',');
        const labelS = document.getElementById('serv').options[document.getElementById('serv').selectedIndex].text;
        const msg = encodeURIComponent(`*REFRICENTER TITANIUM*\nServiço: ${labelS}\nQtd: ${q}\nTotal: R$ ${total.toFixed(2)}`);
        document.getElementById('link-zap').href = `https://wa.me/5568992447004?text=${msg}`;
    }

    function limparOrcamento() {
        multiplicador = 1.0; cupomAtivo = '';
        document.getElementById('serv').selectedIndex = 0;
        document.getElementById('qtd').selectedIndex = 0;
        document.getElementById('btn5').classList.remove('active');
        document.getElementById('btn10').classList.remove('active');
        mudarServico();
        document.getElementById('preco').innerText = "R$ 0,00";
    }

    function calcBTU() {
        const a = parseFloat(document.getElementById('area').value), s = parseInt(document.getElementById('sol').value), p = parseInt(document.getElementById('pessoas').value || 1);
        if(!a) return;
        const total = (a * s) + ((p-1) * 600);
        document.getElementById('res-calc').innerHTML = `RECOMENDADO: ${total <= 12000 ? '12k' : total <= 18000 ? '18k' : '24k+'} BTUs`;
    }

    function getErro() {
        const E = { lg:"<b>CH05:</b> Comunicação", samsung:"<b>E101:</b> Erro Sinal", gree:"<b>E6:</b> Erro Com.", midea:"<b>EL:</b> Sinal UI/UE" };
        document.getElementById('erro-box').innerHTML = E[document.getElementById('marca').value] || "Selecione...";
    }

    // GAME SIMPLIFICADO
    function moveGame(v) { pos = Math.max(5, Math.min(85, pos + v)); document.getElementById('p').style.left = pos + '%'; }
    function startGame() { 
        if(gActive) return; gActive = true; pts = 0; 
        const L = setInterval(() => { if(!gActive) clearInterval(L); else spawn(); }, 1200); 
    }
    function spawn() {
        const o = document.createElement('div'), isF = Math.random() > 0.4;
        o.className = 'game-obj'; o.innerHTML = isF ? '🔥' : '❄️';
        o.style.left = Math.random() * 85 + '%'; o.style.top = '0px';
        document.getElementById('game-canvas').appendChild(o);
        let t = 0; const f = setInterval(() => {
            t += 5; o.style.top = t + 'px';
            const pr = document.getElementById('p').getBoundingClientRect(), or = o.getBoundingClientRect();
            if(or.bottom > pr.top && or.left < pr.right && or.right > pr.left) { 
                if(isF){ alert("Game Over!"); gActive = false; } else { pts += 10; document.getElementById('score').innerText = "Pontos: " + pts; }
                o.remove(); clearInterval(f); 
            }
            if(t > 250){ o.remove(); clearInterval(f); }
        }, 30);
    }
    function shootGame() {
        if(!gActive) return; const w = document.createElement('div'); w.innerHTML = '💧'; w.className = 'game-obj'; w.style.left = pos + '%'; w.style.bottom = '50px'; document.getElementById('game-canvas').appendChild(w);
        let b = 50; const fly = setInterval(() => {
            b += 10; w.style.bottom = b + 'px';
            document.querySelectorAll('.game-obj').forEach(obj => { if(obj.innerHTML === '🔥'){ const fr = obj.getBoundingClientRect(), wr = w.getBoundingClientRect(); if(wr.top < fr.bottom && wr.left < fr.right && wr.right > fr.left){ obj.remove(); w.remove(); pts += 20; document.getElementById('score').innerText = "Pontos: " + pts; } } });
            if(b > 250){ w.remove(); clearInterval(fly); }
        }, 20);
    }
    mudarServico();
</script>
</body>
</html>
