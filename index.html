<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Refricenter Pro - Elite HVAC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #0056b3;
            --light-blue: #E0F2F7;
            --accent-orange: #FF8C00;
            --text-dark: #002244;
            --white: #ffffff;
            --shadow: 0 4px 12px rgba(0,0,0,0.1);
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: var(--light-blue); color: var(--text-dark);
            overflow: hidden; /* Controlado via JS para o jogo */
        }

        .app-container {
            max-width: 500px; margin: 0 auto; height: 100vh;
            display: flex; flex-direction: column; position: relative;
            background: var(--light-blue);
        }

        /* --- UI: HEADER --- */
        header {
            background: var(--primary-blue);
            padding: 15px; border-bottom: 4px solid var(--accent-orange);
            display: flex; align-items: center; justify-content: space-between;
            color: white; flex-shrink: 0; z-index: 100;
        }
        .header-logo { display: flex; align-items: center; gap: 10px; }
        .header-logo img { height: 40px; }
        .header-logo span { font-weight: 800; font-size: 14px; line-height: 1.1; }

        .menu-icon { font-size: 24px; cursor: pointer; color: var(--accent-orange); }

        /* --- UI: CONTENT AREAS --- */
        .main-content { flex: 1; overflow-y: auto; padding: 20px; }
        .view { display: none; animation: fadeIn 0.3s ease-out; }
        .active-view { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* --- UI: CARDS (ESTILO IMAGEM) --- */
        .card {
            background: var(--white); border-radius: 15px;
            padding: 15px; margin-bottom: 20px; box-shadow: var(--shadow);
            border-bottom: 3px solid #ddd;
        }
        .card-title { 
            font-weight: 800; color: var(--primary-blue); 
            margin-bottom: 15px; border-left: 4px solid var(--accent-orange);
            padding-left: 10px; text-transform: uppercase; font-size: 14px;
        }

        /* --- UI: INPUTS --- */
        input, select, button {
            width: 100%; padding: 12px; margin-top: 5px;
            border-radius: 10px; border: 1px solid #ccc; font-size: 15px;
        }
        .btn-orange { 
            background: var(--accent-orange); color: white; 
            border: none; font-weight: bold; cursor: pointer;
            text-transform: uppercase; transition: 0.2s;
        }
        .btn-orange:active { transform: scale(0.98); }

        /* --- SERVIÇOS --- */
        .svc-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px; border-bottom: 1px solid #eee;
        }
        .svc-item img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; }
        .svc-info { flex: 1; }
        .svc-info h4 { margin: 0; font-size: 14px; }
        .svc-info p { margin: 2px 0; color: var(--primary-blue); font-weight: bold; }

        /* --- CHECKOUT FIXED FOOTER --- */
        .checkout-bar {
            background: var(--white); padding: 15px;
            border-top: 3px solid var(--primary-blue);
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
        }

        /* --- REFRI-GAME (ENGINE) --- */
        #game-canvas-wrap {
            width: 100%; height: 400px; background: #000;
            border-radius: 15px; position: relative; overflow: hidden;
            touch-action: none;
        }
        #game-player { position: absolute; bottom: 10px; font-size: 40px; z-index: 10; will-change: left; }
        .game-obj { position: absolute; font-size: 30px; }
        .game-controls { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;
        }
        .joy-btn { 
            height: 60px; background: var(--primary-blue); color: white;
            display: flex; align-items: center; justify-content: center; font-size: 24px;
            border-radius: 12px; border: none;
        }

        /* --- DRAWER MENU --- */
        .drawer {
            position: fixed; top: 0; right: -300px; width: 280px; height: 100%;
            background: white; z-index: 1000; transition: 0.3s;
            box-shadow: -5px 0 15px rgba(0,0,0,0.2);
            display: flex; flex-direction: column;
        }
        .drawer.open { right: 0; }
        .drawer-header { padding: 20px; background: var(--primary-blue); color: white; }
        .nav-link { 
            padding: 15px 20px; border-bottom: 1px solid #eee;
            display: flex; align-items: center; gap: 15px; color: var(--text-dark);
            text-decoration: none; font-weight: 600;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="header-logo">
            <img src="logo.png" alt="Logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/950/950244.png'">
            <span>REFRICENTER<br><small>SERVIÇOS E VENDAS</small></span>
        </div>
        <div class="menu-icon" onclick="toggleMenu(true)"><i class="fas fa-bars"></i></div>
    </header>

    <div class="main-content" id="scroll-area">
        
        <section id="view-cadastro" class="view active-view">
            <div class="card">
                <div class="card-title">Cadastro do Cliente</div>
                <input type="text" id="cad-nome" placeholder="Nome Completo">
                <input type="tel" id="cad-tel" placeholder="WhatsApp (DDD)">
                <input type="text" id="cad-end" placeholder="Endereço Completo">
                <label style="font-size: 12px; margin-top: 10px; display: block;">Localidade (Taxa):</label>
                <select id="cad-taxa">
                    <option value="0">Plácido de Castro (Urbano) - R$ 0</option>
                    <option value="30">Plácido Rural - R$ 30</option>
                    <option value="50">Vila Campinas - R$ 50</option>
                    <option value="120">Acrelândia / Outros - R$ 120</option>
                </select>
                <button class="btn-orange" style="margin-top: 15px;" onclick="iniciarApp()">Salvar e Abrir App</button>
            </div>
        </section>

        <section id="view-servicos" class="view">
            <div class="card">
                <div class="card-title">Serviços Disponíveis</div>
                <div id="lista-servicos">
                    </div>
            </div>
        </section>

        <section id="view-calc" class="view">
            <div class="card">
                <div class="card-title">Cálculo de Carga Térmica</div>
                <div id="calc-steps">
                    <div class="calc-step" id="step1">
                        <label>Comprimento (m):</label>
                        <input type="number" id="v-comp" onchange="nextStep(2)">
                    </div>
                    <div class="calc-step" id="step2" style="display:none">
                        <label>Largura (m):</label>
                        <input type="number" id="v-larg" onchange="nextStep(3)">
                    </div>
                    <div class="calc-step" id="step3" style="display:none">
                        <label>Altura (Pé direito):</label>
                        <input type="number" id="v-alt" onchange="nextStep(4)">
                    </div>
                    <div class="calc-step" id="step4" style="display:none">
                        <label>Pessoas e Eletrônicos:</label>
                        <input type="number" id="v-pess" placeholder="Nº Pessoas">
                        <input type="number" id="v-ele" placeholder="Nº Eletrônicos" style="margin-top:5px">
                        <select id="v-sol" style="margin-top:5px">
                            <option value="600">Sombra (600 BTU)</option>
                            <option value="800">Sol Pleno (800 BTU)</option>
                        </select>
                        <button class="btn-orange" onclick="calcularBTU()" style="margin-top:10px">Finalizar Cálculo</button>
                    </div>
                </div>
                <div id="calc-result" style="margin-top:15px; font-weight:bold; color:var(--primary-blue); text-align:center;"></div>
            </div>
        </section>

        <section id="view-diagnostico" class="view">
            <div class="card">
                <div class="card-title">Guia de Erros Profissional</div>
                <select id="diag-tech" onchange="filtraErros()">
                    <option value="inverter">Tecnologia INVERTER</option>
                    <option value="convencional">Tecnologia CONVENCIONAL</option>
                </select>
                <select id="diag-marca" style="margin-top:10px" onchange="filtraErros()">
                    <option value="lg">LG</option>
                    <option value="samsung">SAMSUNG</option>
                    <option value="midea">MIDEA / CARRIER</option>
                    <option value="gree">GREE</option>
                </select>
                <div id="error-results" style="margin-top:15px"></div>
            </div>
        </section>

        <section id="view-game" class="view">
            <div id="game-canvas-wrap">
                <div id="game-score" style="position:absolute; top:10px; left:10px; color:white; z-index:20;">Pontos: 0</div>
                <div id="game-player">👨‍🔧</div>
            </div>
            <button class="btn-orange" id="btn-shoot" style="height:70px; margin-top:10px">LANÇAR CHAVE 🛠️</button>
            <div class="game-controls">
                <button class="joy-btn" id="joy-l"><i class="fas fa-arrow-left"></i></button>
                <button class="joy-btn" id="joy-r"><i class="fas fa-arrow-right"></i></button>
            </div>
        </section>

    </div>

    <div class="checkout-bar" id="checkout-box" style="display:none">
        <div style="display:flex; justify-content:space-between; font-weight:800; margin-bottom:10px">
            <span>Total:</span>
            <span id="total-geral">R$ 0,00</span>
        </div>
        <div style="display:flex; gap:5px">
            <input type="text" id="cupom-val" placeholder="CUPOM" style="width:100px; margin:0">
            <button class="btn-orange" style="margin:0; flex:1" onclick="enviarWp()">Finalizar Pedido</button>
        </div>
    </div>
</div>

<div class="drawer" id="side-menu">
    <div class="drawer-header">
        <strong>REFRICENTER PRO</strong>
    </div>
    <a href="#" class="nav-link" onclick="navigate('view-servicos')"><i class="fas fa-tools"></i> Serviços</a>
    <a href="#" class="nav-link" onclick="navigate('view-calc')"><i class="fas fa-calculator"></i> Calculadora BTU</a>
    <a href="#" class="nav-link" onclick="navigate('view-diagnostico')"><i class="fas fa-search"></i> Guia de Erros</a>
    <a href="#" class="nav-link" onclick="navigate('view-game')"><i class="fas fa-gamepad"></i> Refri-Game</a>
    <a href="#" class="nav-link" style="color:red" onclick="window.location.reload()"><i class="fas fa-sign-out-alt"></i> Sair</a>
</div>

<script>
    // --- DATABASE ---
    const servicosDB = [
        { id: 1, nome: "Higienização Completa", preco: 150, img: "limpeza.png" },
        { id: 2, nome: "Instalação Split", preco: 350, img: "instalacao.png" },
        { id: 3, nome: "Carga de Gás (R410)", preco: 220, img: "gas.png" },
        { id: 4, nome: "Reparo em Placa", preco: 280, img: "placa.png" }
    ];

    const errosDB = {
        lg: { inverter: [ {c: "CH05", d: "Erro de Comunicação UI/UE"}, {c: "CH61", d: "Superaquecimento Condensadora"} ] },
        samsung: { inverter: [ {c: "E101", d: "Erro de Comunicação Serial"}, {c: "E464", d: "Sobrecorrente no Compressor"} ] }
    };

    let carrinho = [];
    let userData = {};
    let gameState = { score: 0, active: false, x: 50 };
    const inputKeys = { left: false, right: false };

    // --- NAVEGAÇÃO ---
    function navigate(viewId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active-view'));
        document.getElementById(viewId).classList.add('active-view');
        toggleMenu(false);
        
        // Bloqueio de scroll para o jogo
        document.body.style.overflow = (viewId === 'view-game') ? 'hidden' : 'auto';
        if(viewId === 'view-game') startRefriGame();
        else gameState.active = false;

        document.getElementById('checkout-box').style.display = (viewId === 'view-servicos') ? 'block' : 'none';
    }

    function toggleMenu(show) {
        document.getElementById('side-menu').classList.toggle('open', show);
    }

    // --- APP LOGIC ---
    function iniciarApp() {
        userData.nome = document.getElementById('cad-nome').value;
        userData.taxa = parseFloat(document.getElementById('cad-taxa').value);
        if(!userData.nome) return alert("Por favor, informe seu nome.");
        navigate('view-servicos');
        renderServicos();
    }

    function renderServicos() {
        const container = document.getElementById('lista-servicos');
        container.innerHTML = servicosDB.map(s => `
            <div class="svc-item">
                <img src="${s.img}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/950/950244.png'">
                <div class="svc-info">
                    <h4>${s.nome}</h4>
                    <p>R$ ${s.preco.toFixed(2)}</p>
                </div>
                <input type="checkbox" onchange="toggleCart(${s.id}, this.checked)" style="width:25px; height:25px">
            </div>
        `).join('');
    }

    function toggleCart(id, add) {
        const svc = servicosDB.find(x => x.id === id);
        if(add) carrinho.push(svc);
        else carrinho = carrinho.filter(x => x.id !== id);
        updateTotal();
    }

    function updateTotal() {
        let total = carrinho.reduce((acc, curr) => acc + curr.preco, 0) + userData.taxa;
        if(document.getElementById('cupom-val').value.toUpperCase() === "REFRI10") total *= 0.9;
        document.getElementById('total-geral').innerText = `R$ ${total.toFixed(2)}`;
    }

    function enviarWp() {
        const itens = carrinho.map(c => `- ${c.nome}`).join('%0A');
        const text = `*NOVO PEDIDO REFRICENTER*%0A*Cliente:* ${userData.nome}%0A*Itens:*%0A${itens}%0A*Total:* ${document.getElementById('total-geral').innerText}`;
        window.open(`https://wa.me/5568992447004?text=${text}`);
    }

    // --- CALCULADORA ---
    function nextStep(n) { document.getElementById('step'+n).style.display = 'block'; }
    function calcularBTU() {
        const area = document.getElementById('v-comp').value * document.getElementById('v-larg').value;
        const btuBase = area * document.getElementById('v-sol').value;
        const btuExtra = (document.getElementById('v-pess').value * 600) + (document.getElementById('v-ele').value * 600);
        document.getElementById('calc-result').innerText = `Recomendado: ${(btuBase + btuExtra)} BTUs`;
    }

    // --- DIAGNÓSTICO ---
    function filtraErros() {
        const marca = document.getElementById('diag-marca').value;
        const tech = document.getElementById('diag-tech').value;
        const res = document.getElementById('error-results');
        const dados = errosDB[marca]?.[tech] || [];
        res.innerHTML = dados.length ? dados.map(e => `<div class="diag-item"><strong>${e.c}</strong>: ${e.d}</div>`).join('') : "Sem dados para esta seleção.";
    }

    // --- REFRI-GAME ENGINE (MULTITOUCH) ---
    function startRefriGame() {
        if(gameState.active) return;
        gameState.active = true;
        gameState.score = 0;
        
        // Loop de Render
        function gameLoop() {
            if(!gameState.active) return;
            if(inputKeys.left) gameState.x = Math.max(0, gameState.x - 3);
            if(inputKeys.right) gameState.x = Math.min(90, gameState.x + 3);
            document.getElementById('game-player').style.left = gameState.x + "%";
            requestAnimationFrame(gameLoop);
        }
        
        // Spawner de Gelo/Sujeira
        const spawner = setInterval(() => {
            if(!gameState.active) return clearInterval(spawner);
            spawnItem();
        }, 1200);

        gameLoop();
    }

    // Controles Multitouch
    document.getElementById('joy-l').addEventListener('touchstart', (e) => { e.preventDefault(); inputKeys.left = true; });
    document.getElementById('joy-l').addEventListener('touchend', () => inputKeys.left = false);
    document.getElementById('joy-r').addEventListener('touchstart', (e) => { e.preventDefault(); inputKeys.right = true; });
    document.getElementById('joy-r').addEventListener('touchend', () => inputKeys.right = false);
    document.getElementById('btn-shoot').addEventListener('touchstart', (e) => { e.preventDefault(); shootKey(); });

    function spawnItem() {
        const obj = document.createElement('div');
        obj.className = 'game-obj';
        obj.innerHTML = Math.random() > 0.3 ? '❄️' : '🔥';
        obj.style.left = Math.random() * 90 + '%';
        obj.style.top = '-40px';
        document.getElementById('game-canvas-wrap').appendChild(obj);

        let fall = setInterval(() => {
            let top = parseInt(obj.style.top);
            obj.style.top = (top + 4) + 'px';
            if(top > 400) { obj.remove(); clearInterval(fall); }
            
            // Colisão simples com Player
            let pRect = document.getElementById('game-player').getBoundingClientRect();
            let oRect = obj.getBoundingClientRect();
            if(oRect.bottom > pRect.top && oRect.left < pRect.right && oRect.right > pRect.left) {
                gameState.score += 10;
                document.getElementById('game-score').innerText = "Pontos: " + gameState.score;
                obj.remove(); clearInterval(fall);
            }
        }, 20);
    }

    function shootKey() {
        const tool = document.createElement('div');
        tool.className = 'game-obj';
        tool.innerHTML = '🛠️';
        tool.style.left = gameState.x + 5 + '%';
        tool.style.bottom = '60px';
        document.getElementById('game-canvas-wrap').appendChild(tool);

        let up = setInterval(() => {
            let bottom = parseInt(tool.style.bottom);
            tool.style.bottom = (bottom + 10) + 'px';
            if(bottom > 400) { tool.remove(); clearInterval(up); }
        }, 20);
    }

</script>
</body>
</html>
