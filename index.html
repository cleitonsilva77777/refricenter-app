<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Refricenter 2.0 - Titanium Gold</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --blue: #01579B; --orange: #FF8F00; --green: #2e7d32; --bg: #f4f7f9; --white: #ffffff; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { margin: 0; background: var(--bg); color: #333; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Header Moderno */
        header { background: var(--blue); color: white; padding: 18px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--orange); }
        .brand { font-weight: 900; letter-spacing: 1.5px; font-size: 1.2rem; text-transform: uppercase; }

        .main-content { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 120px; }
        
        /* Card Principal */
        .card-principal { background: var(--white); border-radius: 20px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); position: relative; }
        
        /* Títulos e Labels */
        .card-principal h3 { margin-top: 0; color: var(--blue); border-left: 4px solid var(--orange); padding-left: 10px; }
        label { display: block; margin-bottom: 8px; font-size: 0.85rem; font-weight: 700; color: #555; }

        select, input { 
            width: 100%; padding: 12px; border-radius: 12px; border: 2px solid #eee; 
            margin-bottom: 15px; font-size: 1rem; background: #fafafa; outline: none; transition: 0.3s;
        }
        select:focus { border-color: var(--blue); background: #fff; }

        /* Área Escondida (Aparece sob demanda) */
        #area-detalhes { display: none; padding-top: 15px; border-top: 1px solid #eee; animation: slideDown 0.4s ease-out; }

        /* Card de Preço */
        .price-box { 
            background: #e8f5e9; border-radius: 15px; padding: 20px; text-align: center; 
            margin: 15px 0; border: 2px solid var(--green); 
        }
        .price-box small { color: var(--green); font-weight: bold; text-transform: uppercase; font-size: 0.7rem; }
        .price-box h2 { margin: 5px 0; color: var(--green); font-size: 2.2rem; }

        /* Botões */
        .btn-action { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s; }
        .btn-zap { background: var(--green); color: white; margin-top: 10px; }
        .btn-clear { background: #fee2e2; color: #b91c1c; margin-top: 10px; font-size: 0.8rem; }
        
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* Footer */
        footer { position: fixed; bottom: 0; width: 100%; background: white; border-top: 1px solid #ddd; padding: 10px 0; }
        .nav-bar { display: flex; justify-content: space-around; }
        .nav-item { text-align: center; text-decoration: none; color: #999; flex: 1; font-size: 0.7rem; }
        .nav-item.active { color: var(--blue); }
        .nav-item i { display: block; font-size: 1.3rem; margin-bottom: 3px; }
    </style>
</head>
<body>

<header>
    <div class="brand">Refricenter</div>
    <i class="fas fa-user-circle" onclick="nav('v-profile')" style="font-size: 1.5rem; cursor:pointer"></i>
</header>

<div class="main-content">
    <div class="card-principal">
        <h3><i class="fas fa-calculator"></i> Orçamento Inteligente</h3>
        
        <label>LOCAL:</label>
        <select id="end-selecionado">
            <option value="casa">Minha Casa</option>
        </select>

        <label>O QUE VOCÊ PRECISA?</label>
        <select id="servico-tipo" onchange="mostrarOuEsconder()">
            <option value="">Selecione um serviço...</option>
            <option value="instalacao">Instalação</option>
            <option value="limpeza">Limpeza Química</option>
            <option value="gas">Carga de Gás</option>
        </select>

        <div id="area-detalhes">
            <label>QUAL A POTÊNCIA DO AR?</label>
            <select id="btu-valor" onchange="calcularPrecoFinal()">
                <option value="9k">9.000 BTUs</option>
                <option value="12k">12.000 BTUs</option>
                <option value="18k">18.000 BTUs</option>
                <option value="24k">24.000 BTUs</option>
            </select>

            <div class="price-box">
                <small>Valor Estimado</small>
                <h2 id="valor-final">R$ 0,00</h2>
            </div>

            <button class="btn-action btn-zap" onclick="enviarPedido()">
                <i class="fab fa-whatsapp"></i> ENVIAR PEDIDO
            </button>

            <button class="btn-action btn-clear" onclick="limparTudo()">
                <i class="fas fa-times-circle"></i> CANCELAR E LIMPAR
            </button>
        </div>
    </div>
</div>

<footer>
    <div class="nav-bar">
        <a href="#" class="nav-item active"><i class="fas fa-home"></i><span>Início</span></a>
        <a href="#" class="nav-item"><i class="fas fa-history"></i><span>Pedidos</span></a>
        <a href="#" class="nav-item"><i class="fas fa-snowflake"></i><span>BTU</span></a>
        <a href="#" class="nav-item"><i class="fas fa-cog"></i><span>Perfil</span></a>
    </div>
</footer>

<script>
    // Tabela de Preços Realistas
    const TABELA = {
        instalacao: { "9k": 400, "12k": 450, "18k": 600, "24k": 800 },
        limpeza: { "9k": 150, "12k": 180, "18k": 250, "24k": 300 },
        gas: { "9k": 250, "12k": 300, "18k": 450, "24k": 550 }
    };

    function mostrarOuEsconder() {
        const servico = document.getElementById('servico-tipo').value;
        const area = document.getElementById('area-detalhes');
        
        if(servico !== "") {
            area.style.display = 'block';
            calcularPrecoFinal();
        } else {
            area.style.display = 'none';
        }
    }

    function calcularPrecoFinal() {
        const serv = document.getElementById('servico-tipo').value;
        const btu = document.getElementById('btu-valor').value;
        const valor = TABELA[serv][btu];
        
        document.getElementById('valor-final').innerText = `R$ ${valor},00`;
    }

    function limparTudo() {
        document.getElementById('servico-tipo').value = "";
        document.getElementById('area-detalhes').style.display = 'none';
    }

    function enviarPedido() {
        const s = document.getElementById('servico-tipo').value;
        const b = document.getElementById('btu-valor').value;
        const v = document.getElementById('valor-final').innerText;
        const msg = `*REFRICENTER*\nNovo pedido de ${s} para ar de ${b}.\n*Total:* ${v}`;
        window.open(`https://wa.me/5568992447004?text=${encodeURIComponent(msg)}`);
    }
</script>
</body>
</html>
