<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refricenter App</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --azul: #002D4C; --verde: #25d366; --bg: #F5F7FA; --laranja: #E67E22; }
        body { font-family: 'Roboto', sans-serif; background: var(--bg); margin: 0; padding-bottom: 80px; overflow-x: hidden; }
        
        /* CABEÇALHO */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: white; border-bottom: 1px solid #ddd; position: sticky; top: 0; z-index: 100; }
        .btn-icon { font-size: 24px; cursor: pointer; background: none; border: none; color: var(--azul); padding: 5px; }

        /* MENU LATERAL (HAMBÚRGUER) */
        .sidebar { position: fixed; left: -250px; top: 0; width: 250px; height: 100%; background: var(--azul); color: white; transition: 0.3s; z-index: 200; padding-top: 60px; box-shadow: 2px 0 10px rgba(0,0,0,0.3); }
        .sidebar.active { left: 0; }
        .sidebar a { display: block; padding: 15px 25px; color: white; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.9rem; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 150; }
        .overlay.active { display: block; }

        /* BANNER */
        .container-banner { text-align: center; padding: 10px; background: white; margin-bottom: 10px; }
        .banner-img { width: 90%; max-width: 320px; height: auto; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        
        /* TELAS E CARDS */
        .tela { display: none; padding: 15px; animation: fadeIn 0.3s; }
        .tela.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; border-top: 4px solid var(--azul); }
        h3 { margin-top: 0; color: var(--azul); font-size: 1.2rem; text-align: center; margin-bottom: 20px; }
        
        label { font-size: 0.75rem; font-weight: bold; color: #666; text-transform: uppercase; margin-left: 5px; }
        input, select { width: 100%; padding: 14px; margin: 8px 0 18px 0; border-radius: 12px; border: 1px solid #ddd; box-sizing: border-box; font-size: 1rem; background: #f9f9f9; }
        
        /* BOTÕES */
        .btn-acao { width: 100%; background: var(--azul); color: white; border: none; padding: 16px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .btn-acao:active { transform: scale(0.98); }
        .btn-zap { display: block; background: var(--verde); color: white; text-align: center; padding: 16px; border-radius: 12px; text-decoration: none; font-weight: bold; margin-top: 15px; width: 100%; border: none; font-size: 1rem; }
        .btn-admin-link { display: block; background: var(--laranja); color: white; text-align: center; padding: 16px; border-radius: 12px; text-decoration: none; font-weight: bold; margin-top: 20px; }

        /* RESUMO DE PREÇO */
        .resumo { background: #1a1a1a; color: white; border-radius: 18px; padding: 25px; text-align: center; margin-top: 10px; }
        .v-final { font-size: 2.8rem; font-weight: bold; color: var(--verde); display: block; margin-top: 5px; }
        
        /* BARRA DE NAVEGAÇÃO */
        .nav-bar { display: flex; justify-content: space-around; background: white; position: fixed; bottom: 0; width: 100%; height: 75px; border-top: 1px solid #ddd; z-index: 100; padding-top: 5px; }
        .nav-item { border: none; background: none; color: #999; font-size: 0.75rem; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
        .nav-item span { font-size: 20px; margin-bottom: 4px; }
        .nav-item.active { color: var(--azul); font-weight: bold; }
    </style>
</head>
<body>

<div id="overlay" class="overlay" onclick="toggleMenu()"></div>
<div id="sidebar" class="sidebar">
    <div style="text-align: center; padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1);">
        <strong>REFRICENTER</strong><br>
        <small style="opacity: 0.7;">Manutenção e Instalação</small>
    </div>
    <a href="#" onclick="toggleMenu(); switchTab('inicio')">🏠 Início / Pedido</a>
    <a href="#" onclick="toggleMenu(); switchTab('precos')">💰 Tabela de Preços</a>
    <a href="#" onclick="toggleMenu()">ℹ️ Sobre a Empresa</a>
    <a href="#" onclick="toggleMenu()">📍 Localização</a>
</div>

<div class="header">
    <button class="btn-icon" onclick="toggleMenu()">☰</button>
    <span style="font-weight: bold; color: var(--azul); letter-spacing: 1px;">REFRICENTER</span>
    <button class="btn-icon" onclick="acessoAdmin()">👤</button>
</div>

<div class="container-banner">
    <img src="banner.png" class="banner-img" alt="Banner Refricenter">
</div>

<div id="inicio" class="tela active">
    <div class="card">
        <h3>Solicitar Orçamento</h3>
        <label>Nome do Cliente:</label>
        <input type="text" id="nome_cliente" placeholder="Quem está solicitando?">
        <label>Endereço / Ponto de Ref.:</label>
        <input type="text" id="end_cliente" placeholder="Rua, Bairro ou Próximo a...">
        <button class="btn-acao" onclick="irParaPrecos()">ESCOLHER SERVIÇO ➔</button>
    </div>
</div>

<div id="precos" class="tela">
    <div class="card">
        <h3>Detalhes do Serviço</h3>
        <label>Tipo de Serviço:</label>
        <select id="serv" onchange="calc()">
            <option value="Limpeza Completa">🧼 Limpeza Completa</option>
            <option value="Instalação Técnica">🛠️ Instalação Técnica</option>
            <option value="Reposição de Gás">🧪 Reposição de Gás</option>
            <option value="Manutenção Corretiva">⚙️ Manutenção Corretiva</option>
        </select>
        <label>Capacidade do Aparelho:</label>
        <select id="tipo" onchange="calc()">
            <option value="9-12k">9.000 a 12.000 BTUs</option>
            <option value="18k">18.000 BTUs</option>
            <option value="22k">22.000 BTUs</option>
            <option value="30k+">Acima de 30.000 BTUs</option>
        </select>
        <label>Forma de Pagamento:</label>
        <select id="pagamento" onchange="calc()">
            <option value="cartao">💳 Cartão / Parcelado</option>
            <option value="a_vista">💵 Dinheiro ou PIX (5% OFF)</option>
        </select>
        <div class="resumo">
            <small style="opacity: 0.8; text-transform: uppercase;">Valor Estimado</small>
            <span id="preco" class="v-final">R$ 0,00</span>
        </div>
        <button class="btn-zap" onclick="finalizar()">✅ FINALIZAR NO WHATSAPP</button>
    </div>
</div>

<div id="admin" class="tela">
    <div class="card" style="border-top-color: var(--laranja);">
        <h3 style="color: var(--laranja);">Painel Administrativo</h3>
        <p style="text-align: center; color: #666; font-size: 0.9rem;">Controle de Orçamentos e Histórico</p>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        
        <a href="https://webhook.site/#!/daecd39b-3d58-45db-b689-bf6d8e16d558" target="_blank" class="btn-admin-link">
            🔍 VER HISTÓRICO COMPLETO
        </a>
        
        <button class="btn-acao" style="background: #95a5a6; margin-top: 20px;" onclick="switchTab('inicio')">SAIR DO PAINEL</button>
    </div>
</div>

<div class="nav-bar">
    <button id="nav-inicio" class="nav-item active" onclick="switchTab('inicio')"><span>🏠</span>Início</button>
    <button id="nav-precos" class="nav-item" onclick="switchTab('precos')"><span>💰</span>Preços</button>
</div>

<script>
const tabela = {
    "Instalação Técnica": {"9-12k": 200, "18k": 350, "22k": 400, "30k+": 550},
    "Limpeza Completa": {"9-12k": 200, "18k": 250, "22k": 300, "30k+": 400},
    "Reposição de Gás": {"9-12k": 150, "18k": 200, "22k": 250, "30k+": 350},
    "Manutenção Corretiva": {"9-12k": 100, "18k": 150, "22k": 180, "30k+": 250}
};

const WEBHOOK_URL = "https://webhook.site/daecd39b-3d58-45db-b689-bf6d8e16d558";

function toggleMenu() {
    document.getElementById('sidebar').classList.toggle('active');
    document.getElementById('overlay').classList.toggle('active');
}

function acessoAdmin() {
    if(prompt("Digite sua senha:") === "777") switchTab('admin');
}

function switchTab(t) {
    document.querySelectorAll('.tela').forEach(e => e.classList.remove('active'));
    document.getElementById(t).classList.add('active');
    
    document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
    const navItem = document.getElementById('nav-'+t);
    if(navItem) navItem.classList.add('active');
}

function irParaPrecos() {
    if(document.getElementById('nome_cliente').value.trim() !== "") switchTab('precos');
    else alert("Por favor, informe o seu nome para continuar.");
}

function calc() {
    const s = document.getElementById('serv').value;
    const tp = document.getElementById('tipo').value;
    const pag = document.getElementById('pagamento').value;
    let base = tabela[s][tp];
    let final = (pag === 'a_vista') ? base * 0.95 : base;
    document.getElementById('preco').innerText = "R$ " + final.toFixed(2).replace('.',',');
}

function finalizar() {
    const nome = document.getElementById('nome_cliente').value;
    const end = document.getElementById('end_cliente').value;
    const s = document.getElementById('serv').value;
    const valor = document.getElementById('preco').innerText;

    const dados = { 
        data: new Date().toLocaleString('pt-BR'), 
        cliente: nome, 
        endereco: end || "Não informado", 
        servico: s, 
        total: valor 
    };

    // Registro Silencioso no Histórico
    fetch(WEBHOOK_URL, { method: 'POST', body: JSON.stringify(dados) }).catch(() => {});

    // Envio para o WhatsApp
    const msg = encodeURIComponent(`*REFRICENTER - NOVO PEDIDO*\n\n👤 *Cliente:* ${nome}\n📍 *Endereço:* ${end}\n🛠️ *Serviço:* ${s}\n💰 *Valor:* ${valor}\n\n_Gerado pelo App Refricenter_`);
    window.open("https://wa.me/5568992447004?text=" + msg);
}

// Inicia o cálculo padrão
calc();
</script>
</body>
</html>
