<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Refricenter Pro - Titanium v3.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --blue-main: #01579B; --orange: #FF8F00; --bg: #E0F2F7;
            --white: #FFFFFF; --shadow: 0 4px 12px rgba(0,0,0,0.15);
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); height: 100vh; overflow: hidden; }

        header { 
            background: var(--blue-main); color: white; padding: 12px 15px; 
            display: flex; align-items: center; justify-content: space-between; 
            border-bottom: 4px solid var(--orange);
        }

        .main-container { height: calc(100vh - 65px); overflow-y: auto; padding: 15px; }
        .view { display: none; animation: fadeIn 0.3s ease; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: var(--white); border-radius: 15px; padding: 20px; margin-bottom: 15px; box-shadow: var(--shadow); }
        .card-title { font-weight: 800; color: var(--blue-main); border-left: 5px solid var(--orange); padding-left: 10px; margin-bottom: 15px; font-size: 14px; text-transform: uppercase; }
        
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #CFD8DC; font-size: 16px; outline: none; }
        .btn { background: var(--orange); color: white; border: none; padding: 15px; border-radius: 10px; font-weight: 800; width: 100%; cursor: pointer; text-transform: uppercase; }

        /* MENU LATERAL */
        .drawer { position: fixed; top: 0; left: -100%; width: 280px; height: 100%; background: white; z-index: 2000; transition: 0.3s; box-shadow: 10px 0 30px rgba(0,0,0,0.2); }
        .drawer.open { left: 0; }
        .nav-item { display: flex; align-items: center; gap: 15px; padding: 18px; border-bottom: 1px solid #f0f0f0; text-decoration: none; color: var(--blue-main); font-weight: 700; }

        /* GAME */
        #game-stage { background: #000; width: 100%; height: 350px; position: relative; overflow: hidden; border-radius: 15px; }
        .player { position: absolute; bottom: 10px; font-size: 35px; left: 50%; transform: translateX(-50%); transition: 0.1s; z-index: 10; }
        .falling { position: absolute; font-size: 25px; z-index: 5; }
    </style>
</head>
<body>

<div class="drawer" id="sideNav">
    <div style="background:var(--blue-main); padding:20px; color:white; font-weight:800;">REFRICENTER MENU</div>
    <a href="#" class="nav-item" onclick="navigate('v-serv')"><i class="fas fa-file-invoice-dollar"></i> Orçamentos</a>
    <a href="#" class="nav-item" onclick="navigate('v-calc')"><i class="fas fa-calculator"></i> Calc BTU</a>
    <a href="#" class="nav-item" onclick="navigate('v-diag')"><i class="fas fa-microchip"></i> Guia de Erros</a>
    <a href="#" class="nav-item" onclick="navigate('v-game')"><i class="fas fa-gamepad"></i> Refri-Game</a>
    <a href="#" class="nav-item" onclick="checkAdmin()"><i class="fas fa-user-shield"></i> Painel Admin</a>
</div>

<header>
    <div style="display:flex; align-items:center; gap:10px;">
        <img src="banner.png" style="height:35px; border-radius:5px;" onerror="this.src='https://cdn-icons-png.flaticon.com/512/950/950244.png'">
        <b>REFRICENTER</b>
    </div>
    <i class="fas fa-bars" style="font-size:24px; cursor:pointer;" onclick="toggleMenu()"></i>
</header>

<div class="main-container">
    <div id="v-calc" class="view active">
        <div class="card">
            <div class="card-title">Cálculo de Carga Térmica</div>
            <input type="number" id="c-m2" placeholder="Área em m² (Ex: 12)">
            <select id="c-sol">
                <option value="600">Pouco Sol (600 BTU/m²)</option>
                <option value="800">Muito Sol (800 BTU/m²)</option>
            </select>
            <input type="number" id="c-pes" placeholder="Pessoas no local">
            <button class="btn" onclick="executarCalc()">Calcular BTUs</button>
            <div id="res-calc" style="margin-top:15px; text-align:center; font-weight:bold; color:var(--blue-main)"></div>
        </div>
    </div>

    <div id="v-serv" class="view">
        <div class="card">
            <div class="card-title">Tipo de Serviço</div>
            <button class="btn" style="background:#f8f9fa; color:#333; margin-bottom:10px; text-align:left;" onclick="solicitar('Higienização', 150)">🧼 Higienização - R$ 150</button>
            <button class="btn" style="background:#f8f9fa; color:#333; margin-bottom:10px; text-align:left;" onclick="solicitar('Instalação', 250)">🛠️ Instalação - R$ 250</button>
            <button class="btn" style="background:#f8f9fa; color:#333; margin-bottom:10px; text-align:left;" onclick="solicitar('Carga de Gás', 400)">❄️ Carga de Gás - R$ 400</button>
            <button class="btn" style="background:#ccc;" onclick="navigate('v-calc')">VOLTAR</button>
        </div>
    </div>

    <div id="v-diag" class="view">
        <div class="card">
            <div class="card-title">Guia de Erros Técnico</div>
            <select id="diag-marca" onchange="mostrarErros()">
                <option value="">Selecione a Marca</option>
                <option value="lg">LG</option>
                <option value="samsung">Samsung</option>
                <option value="gree">Gree</option>
                <option value="midea">Midea / Carrier</option>
            </select>
            <div id="err-list" style="margin-top:15px; font-size:14px; line-height:1.6;"></div>
        </div>
    </div>

    <div id="v-game" class="view">
        <div class="card">
            <div id="game-stage">
                <div id="score" style="color:white; padding:10px; font-weight:bold;">Pontos: 0</div>
                <div id="player" class="player">👨‍🔧</div>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; margin-top:15px;">
                <button class="btn" onclick="move(-15)"><i class="fas fa-arrow-left"></i></button>
                <button class="btn" style="background:#00B0FF" onclick="shoot()"><i class="fas fa-tint"></i></button>
                <button class="btn" onclick="move(15)"><i class="fas fa-arrow-right"></i></button>
            </div>
            <button class="btn" id="start-btn" style="background:#4CAF50; margin-top:10px;" onclick="startGame()">INICIAR JOGO</button>
        </div>
    </div>
</div>

<script>
    let gameActive = false; let score = 0; let px = 50;

    function toggleMenu() { document.getElementById('sideNav').classList.toggle('open'); }

    function navigate(v) {
        document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
        document.getElementById(v).classList.add('active');
        toggleMenu();
        gameActive = false;
    }

    // --- LÓGICA DE CÁLCULO ---
    function executarCalc() {
        const m2 = parseFloat(document.getElementById('c-m2').value);
        const sol = parseInt(document.getElementById('c-sol').value);
        const pes = parseInt(document.getElementById('c-pes').value || 1);
        if(!m2) return alert("Insira a metragem!");
        
        let btu = (m2 * sol) + ((pes - 1) * 600);
        let reco = btu <= 9000 ? "9.000" : btu <= 12000 ? "12.000" : btu <= 18000 ? "18.000" : "24.000+";
        document.getElementById('res-calc').innerHTML = `Resultado: ${btu.toLocaleString()} BTUs<br><small>Recomendado: Ar de ${reco} BTUs</small>`;
    }

    // --- GUIA DE ERROS ---
    const ERROS = {
        lg: "<b>CH05:</b> Falha de Comunicação<br><b>CH02:</b> Sensor de Tubo UI<br><b>CH10:</b> Motor da UI travado",
        samsung: "<b>E101:</b> Erro de Comunicação<br><b>E121:</b> Sensor de Temp. Interna<br><b>E458:</b> Erro de Motor Ventilador",
        gree: "<b>E6:</b> Falha de sinal<br><b>H6:</b> Motor Ventilador UI<br><b>F1:</b> Sensor de Ambiente UI",
        midea: "<b>E1:</b> Erro de EEPROM<br><b>EL:</b> Comunicação Interligação<br><b>EC:</b> Vazamento de Gás"
    };

    function mostrarErros() {
        const marca = document.getElementById('diag-marca').value;
        document.getElementById('err-list').innerHTML = ERROS[marca] || "Selecione uma marca para ver os códigos.";
    }

    // --- GAME ---
    function move(v) { px = Math.min(Math.max(5, px + v), 95); document.getElementById('player').style.left = px + '%'; }

    function startGame() {
        if(gameActive) return;
        gameActive = true; score = 0;
        document.getElementById('score').innerText = "Pontos: 0";
        document.getElementById('start-btn').style.display = 'none';
        
        const loop = setInterval(() => {
            if(!gameActive) { clearInterval(loop); document.getElementById('start-btn').style.display = 'block'; return; }
            spawnItem();
        }, 1200);
    }

    function spawnItem() {
        const item = document.createElement('div');
        const isFire = Math.random() > 0.5;
        item.className = 'falling';
        item.innerHTML = isFire ? '🔥' : '❄️';
        item.style.left = Math.random() * 90 + '%';
        item.style.top = '0px';
        document.getElementById('game-stage').appendChild(item);

        let top = 0;
        const fall = setInterval(() => {
            top += 5; item.style.top = top + 'px';
            const pRect = document.getElementById('player').getBoundingClientRect();
            const iRect = item.getBoundingClientRect();

            if(iRect.bottom >= pRect.top && iRect.left < pRect.right && iRect.right > pRect.left) {
                if(isFire) { alert("Game Over! O fogo te pegou."); gameActive = false; }
                else { score += 10; document.getElementById('score').innerText = "Pontos: " + score; }
                item.remove(); clearInterval(fall);
            }
            if(top > 350) { item.remove(); clearInterval(fall); }
        }, 30);
    }

    function shoot() {
        const d = document.createElement('div');
        d.innerHTML = '💧'; d.className = 'falling';
        d.style.left = px + '%'; d.style.bottom = '45px';
        document.getElementById('game-stage').appendChild(d);
        let b = 45;
        const fly = setInterval(() => {
            b += 10; d.style.bottom = b + 'px';
            document.querySelectorAll('.falling').forEach(f => {
                if(f.innerHTML === '🔥') {
                    const fr = f.getBoundingClientRect(); const dr = d.getBoundingClientRect();
                    if(dr.top < fr.bottom && dr.left < fr.right && dr.right > fr.left) {
                        f.remove(); d.remove(); score += 20;
                        document.getElementById('score').innerText = "Pontos: " + score;
                    }
                }
            });
            if(b > 350) { d.remove(); clearInterval(fly); }
        }, 20);
    }
</script>
</body>
</html>
