<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REFRICENTER PRO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --bg: #0b1120; --card: #1e293b; --white: #f8fafc; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--white); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* HEADER COM LOGO PNG */
        header { 
            background: #000; padding: 10px 15px; display: flex; justify-content: space-between; 
            align-items: center; border-bottom: 2px solid var(--gold); z-index: 100; 
        }
        .logo-img { height: 40px; width: auto; } /* Ajusta o tamanho da sua logo */
        .h-btn { color: var(--gold); font-size: 1.5rem; cursor: pointer; background: none; border: none; }

        /* MENU LATERAL */
        #sidebar { 
            position: fixed; left: -280px; top: 0; width: 260px; height: 100%; 
            background: #000; z-index: 1000; transition: 0.3s; border-right: 2px solid var(--gold); padding: 20px; 
        }
        #sidebar.active { left: 0; }
        .menu-item { display: flex; align-items: center; gap: 15px; padding: 18px 0; color: var(--gold); border-bottom: 1px solid #222; font-weight: bold; }

        /* CONTEÚDO COM BANNER */
        .main-content { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 100px; }
        .view { display: none; } 
        .view.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .banner-servico { 
            width: 100%; border-radius: 12px; margin-bottom: 15px; 
            border: 1px solid var(--gold); display: block;
        }

        .card { background: var(--card); border-radius: 15px; padding: 20px; border: 1px solid rgba(212, 175, 55, 0.2); text-align: center; }

        /* NAV INFERIOR */
        nav { position: fixed; bottom: 0; width: 100%; background: #000; display: flex; padding: 10px 0 25px; border-top: 2px solid var(--gold); z-index: 100; }
        .nav-item { text-align: center; color: #64748b; font-size: 0.75rem; flex: 1; cursor: pointer; }
        .nav-item.active { color: var(--gold); }
        .nav-item i { display: block; font-size: 1.4rem; margin-bottom: 4px; }
    </style>
</head>
<body>

<div id="sidebar">
    <img src="https://raw.githubusercontent.com/cleitonsilva77777/refricenter-app/main/banner.png" class="logo-img" style="margin-bottom: 20px;">
    <div class="menu-item"><i class="fas fa-calculator"></i> CALCULADORA PRO</div>
    <div class="menu-item"><i class="fab fa-instagram"></i> INSTAGRAM</div>
    <div class="menu-item" onclick="toggleMenu()" style="margin-top: 40px; color: red;"><i class="fas fa-times"></i> FECHAR</div>
</div>

<header>
    <button class="h-btn" onclick="toggleMenu()"><i class="fas fa-bars"></i></button>
    <img src="https://raw.githubusercontent.com/cleitonsilva77777/refricenter-app/main/banner.png" alt="REFRICENTER" class="logo-img">
    <button class="h-btn"><i class="fas fa-user-shield"></i></button>
</header>

<div class="main-content">
    
    <div id="v-perfil" class="view active">
        <img src="https://raw.githubusercontent.com/cleitonsilva77777/refricenter-app/main/banner.png">
        <div class="card">
            <h3><i class="fas fa-user"></i> BEM-VINDO</h3>
            <p style="color: gray; margin-top: 10px;">A melhor qualidade para seu bem estar.</p>
        </div>
    </div>

    <div id="v-orc" class="view">
        <div class="card">
            <img src="https://raw.githubusercontent.com/cleitonsilva77777/refricenter-app/main/banner.png" style="width: 60px; margin-bottom: 10px;">
            <h3>SOLICITAR ORÇAMENTO</h3>
        </div>
    </div>

    <div id="v-game" class="view">
        <div class="card">
            <h3>CENTRAL DE JOGOS</h3>
        </div>
    </div>

</div>

<nav>
    <div class="nav-item active" id="n-perfil" onclick="switchView('v-perfil')"><i class="fas fa-user"></i>Perfil</div>
    <div class="nav-item" id="n-orc" onclick="switchView('v-orc')"><i class="fas fa-tools"></i>Preços</div>
    <div class="nav-item" id="n-game" onclick="switchView('v-game')"><i class="fas fa-gamepad"></i>Games</div>
</nav>

<script>
    function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); }
    function switchView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('n-' + id.split('-')[1]).classList.add('active');
        document.getElementById('sidebar').classList.remove('active');
    }
</script>

</body>
</html>
