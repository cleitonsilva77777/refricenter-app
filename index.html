<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Refricenter | Orçamento</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #333;
    }

    header img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    .container {
      max-width: 420px;
      margin: auto;
      background: #fff;
      padding: 15px;
      border-radius: 12px;
      margin-top: -20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.1);
    }

    label {
      font-weight: bold;
      margin-top: 10px;
      display: block;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    button {
      background: #007bff;
      color: #fff;
      border: none;
      font-weight: bold;
      margin-top: 15px;
      cursor: pointer;
    }

    .item {
      background: #eef2f7;
      padding: 10px;
      border-radius: 8px;
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
    }

    .total {
      margin-top: 15px;
      padding: 15px;
      border: 2px dashed #28a745;
      border-radius: 10px;
      text-align: center;
      color: #28a745;
      font-size: 22px;
    }

    .menu-btn {
      font-size: 24px;
      cursor: pointer;
      margin-bottom: 10px;
    }

    /* MENU */
    #menu {
      position: fixed;
      top: 0;
      right: -260px;
      width: 240px;
      height: 100%;
      background: #fff;
      box-shadow: -3px 0 10px rgba(0,0,0,.2);
      padding: 20px;
      transition: .3s;
      z-index: 1000;
    }

    #menu a {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      font-weight: bold;
      margin: 12px 0;
      color: #333;
    }

    #menu i.fa-instagram { color: #E1306C; }
    #menu i.fa-facebook { color: #1877F2; }

    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.4);
      z-index: 999;
    }
  </style>
</head>

<body>

<header>
  <img src="banner.png" alt="Refricenter">
</header>

<div id="overlay" onclick="toggleMenu()"></div>

<div id="menu">
  <h3>Refricenter</h3>
  <p>Instalação, manutenção e higienização de ar-condicionado.</p>

  <a href="https://instagram.com" target="_blank">
    <i class="fab fa-instagram"></i> Instagram
  </a>

  <a href="https://facebook.com" target="_blank">
    <i class="fab fa-facebook"></i> Facebook
  </a>

  <textarea id="feedback" placeholder="Feedback..." style="width:100%;height:60px;"></textarea>
  <button onclick="enviarFeedback()">Enviar Feedback</button>
</div>

<div class="container">
  <div class="menu-btn" onclick="toggleMenu()">⋮</div>

  <label>Nome do cliente</label>
  <input id="nome" placeholder="Ex: João Silva">

  <label>Endereço</label>
  <input id="endereco" placeholder="Rua / Bairro">

  <label>Serviço</label>
  <select id="servico">
    <option value="limpeza">Limpeza Completa</option>
    <option value="instalacao">Instalação</option>
    <option value="gas">Carga de Gás</option>
    <option value="desinstalacao">Desinstalação</option>
  </select>

  <label>BTUs</label>
  <select id="btu">
    <option value="200">9.000 a 12.000</option>
    <option value="350">18.000</option>
    <option value="400">22.000</option>
    <option value="450">24.000</option>
    <option value="650">30.000</option>
    <option value="750">36.000</option>
  </select>

  <button onclick="adicionar()">Adicionar serviço</button>

  <div id="lista"></div>

  <div class="total" id="total">R$ 0,00</div>

  <button style="background:#28a745" onclick="enviarWhats()">Enviar para WhatsApp</button>
</div>

<script>
  let itens = [];

  function toggleMenu() {
    const m = document.getElementById("menu");
    const o = document.getElementById("overlay");
    const aberto = m.style.right === "0px";
    m.style.right = aberto ? "-260px" : "0px";
    o.style.display = aberto ? "none" : "block";
  }

  function adicionar() {
    const s = servico.options[servico.selectedIndex].text;
    const v = Number(btu.value);
    itens.push({ s, v });
    render();
  }

  function render() {
    lista.innerHTML = "";
    let total = 0;

    itens.forEach(i => {
      total += i.v;
      lista.innerHTML += `<div class="item"><span>${i.s}</span><b>R$ ${i.v}</b></div>`;
    });

    let desconto = 0;
    if (total >= 400) desconto = 0.12;
    else if (total >= 200) desconto = 0.10;

    total -= total * desconto;
    totalEl = total.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
    document.getElementById("total").innerText = totalEl;
  }

  function enviarWhats() {
    const msg =
`Olá! Gostaria de agendar um serviço.

👤 Cliente: ${nome.value}
📍 Endereço: ${endereco.value}

🛠 Serviços:
${itens.map(i => "- " + i.s).join("\n")}

💰 Total: ${total.innerText}

Fico no aguardo do agendamento.`;

    window.open("https://wa.me/5568992447004?text=" + encodeURIComponent(msg));
  }

  function enviarFeedback() {
    window.open("https://wa.me/5568992447004?text=" + encodeURIComponent("Feedback: " + feedback.value));
  }
</script>

</body>
</html>
