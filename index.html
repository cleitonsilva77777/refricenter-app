<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refricenter - Tabela Oficial</title>
    <style>
        :root { --azul-escuro: #001a2d; --azul-medio: #002D4C; --azul-claro: #004a80; --verde: #25d366; --cinza: #f0f2f5; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: var(--cinza); }
        header { 
            background: linear-gradient(135deg, var(--azul-escuro), var(--azul-claro));
            color: white; padding: 30px 20px; text-align: center; border-bottom: 4px solid var(--azul-claro);
        }
        .container { padding: 15px; max-width: 500px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 15px; }
        h3 { margin-top: 0; color: var(--azul-medio); font-size: 16px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 12px; color: #666; }
        select, input { width: 100%; padding: 10px; margin-top: 5px; border-radius: 8px; border: 1px solid #ddd; font-size: 14px; box-sizing: border-box; }
        .res-box { background: #f0f7ff; padding: 15px; border-radius: 10px; margin-top: 10px; text-align: center; border: 1px solid #d0e3ff; }
        .total-txt { font-size: 22px; color: var(--azul-medio); font-weight: 800; }
        .btn-zap { background: #25d366; color: white; padding: 15px; text-decoration: none; border-radius: 10px; font-weight: bold; display: block; margin-top: 10px; text-align: center; }
        .btn-edit { background: none; border: none; color: var(--azul-claro); text-decoration: underline; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

<header>
    <h1>REFRICENTER</h1>
    <p>Tabela de Preços Oficial</p>
</header>

<div class="container">
    <div class="card">
        <h3>Dados do Cliente</h3>
        <div id="form_cli">
            <input type="text" id="nome_cli" placeholder="Nome do Cliente">
            <input type="text" id="end_cli" placeholder="Endereço">
            <button class="btn-zap" style="padding:8px; font-size:14px;" onclick="salvarCli()">Gravar Cliente</button>
        </div>
        <div id="dados_cli" style="display:none;">
            <p><strong>Cliente:</strong> <span id="ex_nome"></span></p>
            <p><strong>Endereço:</strong> <span id="ex_end"></span></p>
            <button class="btn-edit" onclick="editarCli()">Editar Dados</button>
        </div>
    </div>

    <div class="card">
        <h3>Serviços de Unidade (Split)</h3>
        <label>Tecnologia:</label>
        <select id="tipo_tec" onchange="calcular()">
            <option value="conv">Convencional</option>
            <option value="inv">Inverter</option>
        </select>

        <label>Serviço:</label>
        <select id="tipo_serv" onchange="calcular()">
            <option value="inst_mao">Instalação (Mão de Obra)</option>
            <option value="inst_mat">Instalação (Com Material)</option>
            <option value="desinst">Desinstalação</option>
            <option value="limpeza">Limpeza e Higienização</option>
        </select>

        <label>Capacidade:</label>
        <select id="cap_btu" onchange="calcular()">
            <option value="9k">9.000 BTUs</option>
            <option value="12k">12.000 BTUs</option>
            <option value="18k">18.000 BTUs</option>
            <option value="22k">22.000 BTUs</option>
            <option value="24k">24.000 BTUs</option>
        </select>

        <div class="res-box">
            <div class="total-txt" id="txt_total">R$ 0,00</div>
            <a id="btn_zap_serv" href="#" class="btn-zap">Finalizar no WhatsApp</a>
        </div>
    </div>

    <div class="card">
        <h3>Carga de Gás Refrigerante</h3>
        <label>Tipo de Gás:</label>
        <select id="tipo_gas" onchange="calcGas()">
            <option value="r22">Gás R22</option>
            <option value="r410">Gás R410a</option>
            <option value="r32">Gás R32</option>
        </select>

        <label>Capacidade:</label>
        <select id="gas_btu" onchange="calcGas()">
            <option value="9k">9.000 BTUs</option>
            <option value="12k">12.000 BTUs</option>
            <option value="18k">18.000 BTUs</option>
            <option value="22k">22.000 BTUs</option>
            <option value="24k">24.000 BTUs</option>
            <option value="30k">30.000 BTUs</option>
            <option value="36k">36.000 BTUs</option>
        </select>

        <div class="res-box">
            <div class="total-txt" id="txt_total_gas">R$ 0,00</div>
            <a id="btn_zap_gas" href="#" class="btn-zap">Solicitar Carga de Gás</a>
        </div>
    </div>
</div>

<script>
    // TABELAS DE PREÇOS REAIS
    const tabela = {
        conv: {
            inst_mao: { "9k": 200, "12k": 200, "18k": 300, "22k": 350, "24k": 400 },
            inst_mat: { "9k": 550, "12k": 600, "18k": 800, "22k": 850, "24k": 900 },
            desinst:  { "9k": 100, "12k": 100, "18k": 150, "22k": 200, "24k": 200 },
            limpeza:  { "9k": 150, "12k": 150, "18k": 200, "22k": 250, "24k": 300 }
        },
        inv: {
            inst_mao: { "9k": 250, "12k": 250, "18k": 350, "22k": 400, "24k": 450 },
            inst_mat: { "9k": 600, "12k": 650, "18k": 850, "22k": 900, "24k": 950 },
            desinst:  { "9k": 150, "12k": 150, "18k": 200, "22k": 250, "24k": 250 },
            limpeza:  { "9k": 200, "12k": 200, "18k": 250, "22k": 300, "24k": 350 }
        }
    };

    const tabelaGas = {
        r22:  { "9k": 450, "12k": 450, "18k": 600, "22k": 700, "24k": 750, "30k": 900, "36k": 1100 },
        r410: { "9k": 500, "12k": 500, "18k": 600, "22k": 800, "24k": 850, "30k": 1000, "36k": 1200 },
        r32:  { "9k": 550, "12k": 600, "18k": 750, "22k": 900, "24k": 1000, "30k": 1200, "36k": 1350 }
    };

    function salvarCli() {
        const n = document.getElementById('nome_cli').value;
        const e = document.getElementById('end_cli').value;
        if(n && e) {
            localStorage.setItem('refri_n', n); localStorage.setItem('refri_e', e);
            document.getElementById('form_cli').style.display = 'none';
            document.getElementById('dados_cli').style.display = 'block';
            document.getElementById('ex_nome').innerText = n;
            document.getElementById('ex_end').innerText = e;
        }
    }
    function editarCli() {
        document.getElementById('form_cli').style.display = 'block';
        document.getElementById('dados_cli').style.display = 'none';
    }

    function calcular() {
        const tec = document.getElementById('tipo_tec').value;
        const serv = document.getElementById('tipo_serv').value;
        const btu = document.getElementById('cap_btu').value;
        const preco = tabela[tec][serv][btu];
        document.getElementById('txt_total').innerText = "R$ " + preco;
        
        const msg = `*REFRICENTER*%0ACliente: ${localStorage.getItem('refri_n')}%0AServiço: ${serv} (${tec})%0ABTUs: ${btu}%0AEndereço: ${localStorage.getItem('refri_e')}%0A*TOTAL: R$ ${preco}*`;
        document.getElementById('btn_zap_serv').href = `https://wa.me/5568999999999?text=${msg}`;
    }

    function calcGas() {
        const gas = document.getElementById('tipo_gas').value;
        const btu = document.getElementById('gas_btu').value;
        const preco = tabelaGas[gas][btu];
        document.getElementById('txt_total_gas').innerText = "R$ " + preco;

        const msg = `*REFRICENTER*%0AServiço: Carga de ${gas}%0ABTUs: ${btu}%0ACliente: ${localStorage.getItem('refri_n')}%0A*TOTAL: R$ ${preco}*`;
        document.getElementById('btn_zap_gas').href = `https://wa.me/5568999999999?text=${msg}`;
    }

    window.onload = () => { if(localStorage.getItem('refri_n')) salvarCli(); calcular(); calcGas(); };
</script>
</body>
</html>
