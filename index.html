<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Refricenter Pro - Sistema Integrado</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --blue: #01579B; --orange: #FF8F00; --bg: #E0F2F7; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { margin: 0; background: var(--bg); overflow: hidden; height: 100vh; }
        
        /* HEADER DINÂMICO */
        header { 
            background: var(--blue); color: white; padding: 10px; 
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 3px solid var(--orange); transition: 0.3s;
        }
        .hide-ui { transform: translateY(-100%); } /* Esconde o header no jogo */

        .main-container { height: calc(100vh - 60px); overflow-y: auto; padding: 15px; }
        .view { display: none; } .active { display: block; }
        
        /* CARDS E INPUTS */
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; }
        .btn { background: var(--orange); color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; }

        /* REFRI-GAME (CANVAS FULLSCREEN) */
        #game-container { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: #000; display: none; z-index: 3000; 
        }
        #gameCanvas { width: 100%; height: 100%; }
        .game-ui { 
            position: absolute; top: 20px; width: 100%; text-align: center; 
            color: white; font-family: Arial; pointer-events: none; 
        }
        #btn-sair-jogo { 
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: none; padding: 15px 30px; background: var(--orange); color: white;
            border-radius: 30px; text-decoration: none; font-weight: bold; z-index: 3001;
        }

        /* DRAWER */
        .drawer { position: fixed; top: 0; left: -100%; width: 280px; height: 100%; background: white; z-index: 4000; transition: 0.3s; }
        .drawer.open { left: 0; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 15px; border-bottom: 1px solid #eee; text-decoration: none; color: var(--blue); font-weight: bold; }
    </style>
</head>
<body>

<div class="drawer" id="sideNav">
    <div style="padding: 20px; background: var(--blue); color: white;">MENU REFRICENTER</div>
    <a href="#" class="nav-item" onclick="navigate('v-serv')"><i class="fas fa-tools"></i> Orçamentos</a>
    <a href="#" class="nav-item" onclick="navigate('v-calc')"><i class="fas fa-calculator"></i> Calculadora BTU</a>
    <a href="#" class="nav-item" onclick="navigate('v-diag')"><i class="fas fa-microchip"></i> Guia de Erros</a>
    <a href="#" class="nav-item" onclick="startGame()"><i class="fas fa-gamepad"></i> Refri-Game (Cupom)</a>
</div>

<header id="app-header">
    <span>REFRICENTER <b>PRO</b></span>
    <i class="fas fa-bars" onclick="toggleNav(true)"></i>
</header>

<div class="main-container">
    <div id="v-calc" class="view">
        <div class="card">
            <div class="card-title" style="color:var(--blue); font-weight:bold;">CALCULADORA TÉCNICA</div>
            <input type="number" id="largura" placeholder="Largura (m)">
            <input type="number" id="comprimento" placeholder="Comprimento (m)">
            <select id="sol">
                <option value="600">Sol da Manhã</option>
                <option value="800">Sol da Tarde</option>
            </select>
            <button class="btn" onclick="calcBTU()">CALCULAR AGORA</button>
            <div id="res-calc" style="margin-top:15px; font-weight:bold; color:var(--blue); text-align:center;"></div>
        </div>
    </div>

    <div id="v-diag" class="view">
        <div class="card">
            <div style="font-weight:bold; color:var(--blue); margin-bottom:10px;">GUIA DE ERROS</div>
            <select id="marca-erro" onchange="verErro()">
                <option value="">Selecione a Marca</option>
                <option value="lg">LG</option>
                <option value="samsung">Samsung</option>
                <option value="gree">Gree</option>
                <option value="midea">Midea</option>
            </select>
            <div id="texto-erro" style="margin-top:15px; font-size:14px; color:#333;"></div>
        </div>
    </div>

    <div id="v-serv" class="view active">
        <div class="card">
            <h3>Bem-vindo, Cleiton</h3>
            <p>Selecione uma ferramenta no menu lateral para começar.</p>
        </div>
    </div>
</div>

<div id="game-container">
    <div class="game-ui">
        <div id="score">Pontos: 0</div>
        <small>Pegue as gotas de água! Evite o gelo!</small>
    </div>
    <canvas id="gameCanvas"></canvas>
    <button id="btn-sair-jogo" onclick="stopGame()">VOLTAR PARA O APP</button>
</div>

<script>
    // --- NAVEGAÇÃO ---
    function toggleNav(s) { document.getElementById('sideNav').classList.toggle('open', s); }
    function navigate(v) {
        document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
        document.getElementById(v).classList.add('active');
        toggleNav(false);
    }

    // --- CALCULADORA BTU (CORRIGIDA) ---
    function calcBTU() {
        const l = parseFloat(document.getElementById('largura').value);
        const c = parseFloat(document.getElementById('comprimento').value);
        const s = parseInt(document.getElementById('sol').value);
        if(!l || !c) return alert("Insira as medidas");
        let total = (l * c) * s;
        document.getElementById('res-calc').innerHTML = `Resultado: ${total.toLocaleString()} BTUs<br>Recomendado: ${proxima(total)} BTUs`;
    }
    function proxima(v) { return v<=9000?"9.000":v<=12000?"12.000":v<=18000?"18.000":"24.000+"; }

    // --- GUIA DE ERROS (CORRIGIDO) ---
    const ERROS = {
        lg: "CH05: Falha Comunicação<br>CH02: Sensor de Tubo<br>CH01: Sensor Ambiente",
        samsung: "E101: Erro Comunicação<br>E121: Sensor Interno<br>E201: Erro de Placa",
        gree: "E6: Falha Sinal<br>H6: Motor Ventilador<br>F1: Sensor Ambiente",
        midea: "E1: Erro de Eprom<br>EC: Vazamento de Gás<br>EL: Comunicação"
    };
    function verErro() {
        const m = document.getElementById('marca-erro').value;
        document.getElementById('texto-erro').innerHTML = ERROS[m] || "Selecione uma marca.";
    }

    // --- REFRI-GAME (EXPANSÃO E CORREÇÃO) ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let gameActive = false;
    let score = 0;

    function startGame() {
        gameActive = true;
        score = 0;
        toggleNav(false);
        document.getElementById('game-container').style.display = 'block';
        document.getElementById('app-header').classList.add('hide-ui');
        document.getElementById('btn-sair-jogo').style.display = 'none';
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        requestAnimationFrame(gameLoop);
    }

    function stopGame() {
        gameActive = false;
        document.getElementById('game-container').style.display = 'none';
        document.getElementById('app-header').classList.remove('hide-ui');
        navigate('v-serv');
    }

    // Lógica simplificada do jogo para teste
    function gameLoop() {
        if(!gameActive) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = "white";
        ctx.font = "20px Arial";
        ctx.fillText("JOGO RODANDO...", canvas.width/2 - 80, canvas.height/2);
        
        score++;
        document.getElementById('score').innerText = "Pontos: " + score;

        if(score > 200) { // Simula fim de jogo
            ctx.fillStyle = "lime";
            ctx.fillText("VOCÊ GANHOU UM CUPOM!", canvas.width/2 - 110, canvas.height/2 + 40);
            document.getElementById('btn-sair-jogo').style.display = 'block';
        } else {
            requestAnimationFrame(gameLoop);
        }
    }
</script>
</body>
</html>
