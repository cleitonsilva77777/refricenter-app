<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refricenter Pro - Inteligente</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root { --primary: #007bff; --success: #25d366; --bg: #f4f7f6; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { margin: 0; background: var(--bg); padding-bottom: 80px; }
        .container { max-width: 500px; margin: auto; background: #fff; min-height: 100vh; padding: 20px; position: relative; }
        
        header { text-align: center; margin-bottom: 20px; }
        header img { width: 100%; max-width: 220px; }
        .menu-dots { position: absolute; top: 20px; right: 20px; font-size: 24px; cursor: pointer; color: #555; }

        h2 { font-size: 18px; color: var(--primary); border-left: 4px solid var(--primary); padding-left: 10px; margin: 20px 0; }
        .step-box { background: #f9f9f9; padding: 15px; border-radius: 12px; border: 1px solid #eee; margin-bottom: 20px; }
        
        label { font-size: 12px; font-weight: bold; color: #666; display: block; margin-top: 10px; }
        input, select { width: 100%; padding: 14px; margin-top: 5px; border-radius: 10px; border: 1px solid #ddd; font-size: 16px; }
        
        .btn { width: 100%; padding: 16px; border-radius: 12px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; }
        .btn-blue { background: var(--primary); color: white; }
        .btn-green { background: var(--success); color: white; display: none; }
        
        /* Esconder seções inicialmente */
        #step-servicos, #step-finalizar, #btn-add-servico { display: none; }

        .item-row { display: flex; align-items: center; gap: 10px; background: white; padding: 10px; border-radius: 10px; border: 1px solid #ddd; margin-top: 10px; }
        .item-row img { width: 40px; height: 40px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: #fff; padding: 25px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="menu-dots" onclick="toggleModal('infoModal')"><i class="fas fa-ellipsis-v"></i></div>
    <header><img src="banner.png" alt="Refricenter"></header>

    <div id="step-cadastro" class="step-box">
        <h2><i class="fas fa-user-plus"></i> Identificação</h2>
        <input id="nome" type="text" placeholder="Nome completo">
        <input id="telefone" type="tel" placeholder="WhatsApp (DDD)">
        <input id="endereco" type="text" placeholder="Endereço de entrega/serviço">
        <button class="btn btn-blue" onclick="salvarCliente()">Salvar e Continuar</button>
    </div>

    <div id="step-servicos" class="step-box">
        <h2><i class="fas fa-tools"></i> Escolha o Serviço</h2>
        <select id="tipo-servico" onchange="liberarBtus()">
            <option value="">Selecione o serviço...</option>
            <option value="Limpeza|limpeza.png">Limpeza Completa</option>
            <option value="Instalação|instalacao.png">Instalação</option>
            <option value="Carga de Gás|gas.png">Carga de Gás</option>
        </select>
        
        <select id="btu-servico" style="margin-top:10px;" disabled onchange="document.getElementById('btn-add-servico').style.display='flex'">
            <option value="">Aguardando potência...</option>
            <option value="9.000|200">9.000 BTUs</option>
            <option value="12.000|200">12.000 BTUs</option>
            <option value="18.000|300">18.000 BTUs</option>
        </select>

        <button id="btn-add-servico" class="btn btn-blue" onclick="addServico()">Adicionar à Lista</button>
        
        <div id="lista-carrinho"></div>
        <button id="btn-avancar" class="btn btn-blue" style="margin-top:20px; display:none;" onclick="irParaFinal()">Avançar para WhatsApp</button>
    </div>

    <button id="btn-whats" class="btn btn-green" onclick="enviarTudo()">
        <i class="fab fa-whatsapp"></i> Enviar Orçamento Agora
    </button>
</div>

<div id="infoModal" class="modal" onclick="toggleModal('infoModal')">
    <div class="modal-content">
        <h3>💡 Importante!</h3>
        <p>A manutenção previne doenças respiratórias e reduz sua conta de luz em até 30%.</p>
        <button class="btn btn-blue" onclick="toggleModal('infoModal')">Fechar</button>
    </div>
</div>

<script>
    let carrinho = [];
    let clienteSalvo = JSON.parse(localStorage.getItem('refricenter_perfil'));

    // Verifica se já tem cadastro ao abrir
    window.onload = () => {
        if(clienteSalvo) {
            document.getElementById('nome').value = clienteSalvo.nome;
            document.getElementById('telefone').value = clienteSalvo.telefone;
            document.getElementById('endereco').value = clienteSalvo.endereco;
            // Opcional: já pular para serviços se quiser, mas aqui deixei carregar os dados
        }
    };

    function salvarCliente() {
        const perfil = {
            nome: document.getElementById('nome').value,
            telefone: document.getElementById('telefone').value,
            endereco: document.getElementById('endereco').value
        };

        if(!perfil.nome || !perfil.telefone) return alert("Preencha nome e telefone!");

        localStorage.setItem('refricenter_perfil', JSON.stringify(perfil));
        clienteSalvo = perfil;

        alert("Cadastro realizado! Você receberá nossas promoções exclusivas.");
        document.getElementById('step-cadastro').style.opacity = "0.5";
        document.getElementById('step-servicos').style.display = "block";
    }

    function liberarBtus() {
        const btu = document.getElementById('btu-servico');
        btu.disabled = !document.getElementById('tipo-servico').value;
    }

    function addServico() {
        const s = document.getElementById('tipo-servico').value.split('|');
        const b = document.getElementById('btu-servico').value.split('|');
        
        carrinho.push({ nome: s[0], btu: b[0], preco: b[1], img: s[1] });
        
        renderCarrinho();
        document.getElementById('tipo-servico').value = "";
        document.getElementById('btu-servico').disabled = true;
        document.getElementById('btn-add-servico').style.display = "none";
        document.getElementById('btn-avancar').style.display = "flex";
    }

    function renderCarrinho() {
        const div = document.getElementById('lista-carrinho');
        div.innerHTML = "";
        carrinho.forEach((i, idx) => {
            div.innerHTML += `<div class="item-row"><img src="images/${i.img}"> <span>${i.nome} - ${i.btu}</span></div>`;
        });
    }

    function irParaFinal() {
        document.getElementById('btn-whats').style.display = "flex";
        document.getElementById('btn-avancar').style.display = "none";
        alert("Quase lá! Clique no botão verde para enviar.");
    }

    function enviarTudo() {
        let msg = `*ORÇAMENTO REFRICENTER*%0A%0A*Cliente:* ${clienteSalvo.nome}%0A*End:* ${clienteSalvo.endereco}%0A%0A*Serviços:*%0A`;
        carrinho.forEach(i => msg += `• ${i.nome} (${i.btu} BTUs)%0A`);
        
        window.open(`https://wa.me/5599999999999?text=${msg}`, "_blank");
    }

    function toggleModal(id) {
        const m = document.getElementById(id);
        m.style.display = m.style.display === "flex" ? "none" : "flex";
    }
</script>
</body>
</html>
