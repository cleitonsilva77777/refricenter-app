<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REFRICENTER BASE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --bg: #0b1120; --card: #1e293b; --white: #f8fafc; }
        
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { background: var(--bg); color: var(--white); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* HEADER FIXO */
        header { 
            background: #000; padding: 15px; display: flex; justify-content: space-between; 
            align-items: center; border-bottom: 2px solid var(--gold); z-index: 100; 
        }
        .logo { font-size: 1.2rem; font-weight: 900; color: var(--gold); letter-spacing: 2px; }
        .h-btn { color: var(--gold); font-size: 1.5rem; cursor: pointer; background: none; border: none; padding: 5px; }

        /* MENU LATERAL (SIDEBAR) */
        #sidebar { 
            position: fixed; left: -280px; top: 0; width: 260px; height: 100%; 
            background: #000; z-index: 1000; transition: 0.3s; border-right: 2px solid var(--gold); 
            padding: 20px; box-shadow: 10px 0 30px rgba(0,0,0,0.8); 
        }
        #sidebar.active { left: 0; }
        .menu-item { 
            display: flex; align-items: center; gap: 15px; padding: 18px 0; 
            color: var(--gold); cursor: pointer; border-bottom: 1px solid #222; font-weight: bold; 
        }

        /* ÁREA DE CONTEÚDO (AS GAVETAS) */
        .main-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 100px; }
        .view { display: none; } 
        .view.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* CARDS VISUAIS */
        .card { 
            background: var(--card); border-radius: 15px; padding: 20px; 
            border: 1px solid rgba(212, 175, 55, 0.2); margin-bottom: 20px; 
            text-align: center;
        }

        /* NAVEGAÇÃO INFERIOR */
        nav { 
            position: fixed; bottom: 0; width: 100%; background: #000; 
            display: flex; justify-content: space-around; padding: 10px 0 25px; 
            border-top: 2px solid var(--gold); z-index: 100; 
        }
        .nav-item { text-align: center; color: #64748b; font-size: 0.75rem; cursor: pointer; flex: 1; }
        .nav-item.active { color: var(--gold); }
        .nav-item i { display: block; font-size: 1.4rem; margin-bottom: 4px; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="logo" style="margin-bottom: 30px;">REFRICENTER</div>
    <div class="menu-item"><i class="fas fa-calculator"></i> CALCULADORA PRO</div>
    <div class="menu-item"><i class="fab fa-instagram"></i> INSTAGRAM</div>
    <div class="menu-item"><i class="fab fa-facebook"></i> FACEBOOK</div>
    <div class="menu-item" onclick="toggleMenu()" style="margin-top: 40px; color: red;"><i class="fas fa-times"></i> FECHAR</div>
</div>

<header>
    <button class="h-btn" onclick="toggleMenu()"><i class="fas fa-bars"></i></button>
    <div class="logo">REFRICENTER</div>
    <button class="h-btn"><i class="fas fa-user-shield"></i></button>
</header>

<div class="main-content">
    
    <div id="v-perfil" class="view active">
        <div class="card">
            <h3><i class="fas fa-user"></i> TELA DE PERFIL</h3>
            <p style="margin-top: 10px; color: gray;">O cadastro ficará aqui.</p>
        </div>
    </div>

    <div id="v-orc" class="view">
        <div class="card">
            <h3><i class="fas fa-file-invoice-dollar"></i> TELA DE PREÇOS</h3>
            <p style="margin-top: 10px; color: gray;">O funil de orçamento ficará aqui.</p>
        </div>
    </div>

    <div id="v-game" class="view">
        <div class="card">
            <h3><i class="fas fa-gamepad"></i> TELA DE GAMES</h3>
            <p style="margin-top: 10px; color: gray;">Os jogos ficarão aqui.</p>
        </div>
    </div>

</div>

<nav>
    <div class="nav-item active" id="n-perfil" onclick="switchView('v-perfil')">
        <i class="fas fa-user"></i>Perfil
    </div>
    <div class="nav-item" id="n-orc" onclick="switchView('v-orc')">
        <i class="fas fa-tools"></i>Preços
    </div>
    <div class="nav-item" id="n-game" onclick="switchView('v-game')">
        <i class="fas fa-gamepad"></i>Games
    </div>
</nav>

<script>
    // FUNÇÃO PARA ABRIR/FECHAR MENU
    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('active');
    }

    // FUNÇÃO PARA MUDAR DE TELA (Navegação)
    function switchView(id) {
        // Esconde todas as telas
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        // Mostra a tela clicada
        document.getElementById(id).classList.add('active');
        
        // Muda a cor do ícone no menu de baixo
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        const navId = 'n-' + id.split('-')[1];
        document.getElementById(navId).classList.add('active');

        // Fecha o menu lateral caso esteja aberto
        document.getElementById('sidebar').classList.remove('active');
    }
</script>

</body>
</html>
