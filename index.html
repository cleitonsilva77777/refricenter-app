<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refricenter App</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --azul: #002D4C; --verde: #25d366; --bg: #F5F7FA; }
        body { font-family: 'Roboto', sans-serif; background: var(--bg); margin: 0; padding-bottom: 80px; }
        .header { display: flex; justify-content: space-between; padding: 15px; background: white; border-bottom: 1px solid #ddd; position: sticky; top: 0; z-index: 50; }
        .container-banner { text-align: center; padding: 10px; background: white; }
        .banner-img { width: 85%; max-width: 300px; height: auto; border-radius: 15px; display: inline-block; }
        .tela { display: none; padding: 20px; }
        .tela.active { display: block; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 20px; border-left: 5px solid var(--azul); }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; font-size: 1rem; }
        .btn-acao { width: 100%; background: var(--azul); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .resumo { background: #222; color: white; border-radius: 15px; padding: 20px; text-align: center; margin-top: 20px; }
        .v-final { font-size: 2.5rem; font-weight: bold; color: var(--verde); display: block; }
        #preco-antigo { text-decoration: line-through; color: #ff4d4d; font-size: 1rem; font-weight: bold; }
        .btn-zap { display: block; background: var(--verde); color: white; text-align: center; padding: 15px; border-radius: 12px; text-decoration: none; font-weight: bold; margin-top: 15px; border: none; width: 100%; font-size: 1rem; }
        .nav-bar { display: flex; justify-content: space-around; background: white; position: fixed; bottom: 0; width: 100%; height: 70px; border-top: 1px solid #ddd; }
        .nav-item { border: none; background: none; color: #777; font-size: 0.8rem; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        .nav-item.active { color: var(--azul); font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <span style="font-size: 20px;">☰</span>
    <span style="font-weight: bold; color: var(--azul);">REFRICENTER</span>
    <span style="font-size: 20px;">👤</span>
</div>

<div class="container-banner">
    <img src="banner.png" class="banner-img">
</div>

<div id="inicio" class="tela active">
    <div class="card">
        <h3 style="text-align: center; margin: 0; color: var(--azul);">Bem-vindo</h3>
        <label style="font-size: 0.7rem; font-weight: bold;">SEU NOME:</label>
        <input type="text" id="nome_cliente" placeholder="Ex: João Silva">
        <label style="font-size: 0.7rem; font-weight: bold;">ENDEREÇO:</label>
        <input type="text" id="end_cliente" placeholder="Rua e Bairro">
        <button class="btn-acao" onclick="switchTab('precos')">INICIAR ORÇAMENTO</button>
    </div>
</div>

<div id="precos" class="tela">
    <div class="card">
        <h3 style="text-align: center; margin: 0; color: var(--azul);">Tabela de Preços</h3>
        <label style="font-size: 0.7rem; font-weight: bold;">SERVIÇO:</label>
        <select id="serv" onchange="renderServico()">
            <option value="Limpeza Completa">🧼 Limpeza Completa</option>
            <option value="Instalação Técnica">🛠️ Instalação Técnica</option>
            <option value="Reposição de Gás">🧪 Reposição de Gás</option>
        </select>
        <label style="font-size: 0.7rem; font-weight: bold;">CAPACIDADE:</label>
        <select id="tipo" onchange="calc()">
            <option value="9-12k">9-12.000 BTUs</option>
            <option value="18k">18.000 BTUs</option>
            <option value="22k">22.000 BTUs</option>
        </select>
        <label style="font-size: 0.7rem; font-weight: bold;">PAGAMENTO:</label>
        <select id="pagamento" onchange="calc()">
            <option value="cartao">💳 Cartão / Prazo</option>
            <option value="a_vista">💵 Dinheiro ou PIX (5% OFF)</option>
        </select>

        <div class="resumo">
            <div id="preco-antigo" style="display:none;"></div>
            <span id="preco" class="v-final">R$ 0,00</span>
        </div>
        <button class="btn-zap" onclick="finalizar()">ENVIAR PARA WHATSAPP</button>
    </div>
</div>

<div class="nav-bar">
    <button id="nav-inicio" class="nav-item active" onclick="switchTab('inicio')">🏠<br>Início</button>
    <button id="nav-precos" class="nav-item" onclick="switchTab('precos')">💰<br>Preços</button>
</div>

<script>
const tabela = {
    "Instalação Técnica": {"9-12k": 200, "18k": 350, "22k": 400},
    "Limpeza Completa": {"9-12k": 200, "18k": 250, "22k": 300},
    "Reposição de Gás": {"9-12k": 150, "18k": 200, "22k": 250}
};

function switchTab(t) {
    document.querySelectorAll('.tela').forEach(e => e.classList.remove('active'));
    document.getElementById(t).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
    document.getElementById('nav-'+t).classList.add('active');
}

function renderServico() { calc(); }

function calc() {
    const s = document.getElementById('serv').value;
    const tp = document.getElementById('tipo').value;
    const pag = document.getElementById('pagamento').value;
    let base = tabela[s][tp];
    let final = (pag === 'a_vista') ? base * 0.95 : base;

    document.getElementById('preco-antigo').style.display = pag === 'a_vista' ? 'block' : 'none';
    document.getElementById('preco-antigo').innerText = "De: R$ " + base.toFixed(2).replace('.',',');
    document.getElementById('preco').innerText = "R$ " + final.toFixed(2).replace('.',',');
}

function finalizar() {
    const nome = document.getElementById('nome_cliente').value;
    const end = document.getElementById('end_cliente').value;
    const s = document.getElementById('serv').value;
    const valor = document.getElementById('preco').innerText;

    if(!nome) { alert("Por favor, digite seu nome."); return; }

    const dados = { 
        data: new Date().toLocaleString('pt-BR'), 
        cliente: nome, 
        endereco: end, 
        servico: s, 
        total: valor 
    };
    
    // SEU LINK JÁ ADICIONADO ABAIXO:
    const linkHistorico = "https://webhook.site/daecd39b-3d58-45db-b689-bf6d8e16d558";

    fetch(linkHistorico, { method: 'POST', mode: 'no-cors', body: JSON.stringify(dados) });

    const msg = encodeURIComponent(`*REFRICENTER - PEDIDO*\n👤 Cliente: ${nome}\n📍 Endereço: ${end}\n🛠️ Serviço: ${s}\n💰 Valor: ${valor}`);
    window.open("https://wa.me/5568992447004?text=" + msg);
}
calc();
</script>
</body>
</html>
