<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refricenter App - Plácido de Castro</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --azul-escuro: #002D4C; 
            --azul-claro: #007BFF;
            --verde: #25d366; 
            --bg: #F5F7FA;
            --texto: #333;
        }
        
        body { font-family: 'Roboto', sans-serif; background: var(--bg); margin: 0; padding: 0; padding-bottom: 80px; color: var(--texto); }
        .app-container { max-width: 480px; margin: auto; min-height: 100vh; background: white; position: relative; }

        /* HEADER */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: white; border-bottom: 1px solid #ddd; position: sticky; top: 0; z-index: 50; }
        .icon-btn { font-size: 20px; color: var(--azul-escuro); background: none; border: none; cursor: pointer; }

        /* BANNER */
        .banner-container { width: 100%; text-align: center; }
        .banner-img { width: 100%; height: auto; display: block; }

        /* TELAS */
        .tela { display: none; padding: 20px; box-sizing: border-box; animation: fadeIn 0.3s; }
        .tela.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* CARDS */
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 20px; border-left: 5px solid var(--azul-escuro); }
        .titulo-card { font-size: 1.1rem; font-weight: bold; color: var(--azul-escuro); margin-bottom: 5px; text-align: center; }
        .subtitulo-card { font-size: 0.85rem; color: #777; margin-bottom: 20px; text-align: center; font-style: italic; }

        /* INPUTS */
        label { display: block; font-size: 0.75rem; font-weight: bold; color: #555; text-transform: uppercase; margin-bottom: 5px; margin-top: 10px; }
        input, select { 
            width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #e0e0e0; 
            margin-bottom: 10px; font-size: 1rem; background: #fff; box-sizing: border-box;
        }
        select:focus { border-color: var(--azul-claro); outline: none; }

        .btn-acao { 
            width: 100%; background: var(--azul-escuro); color: white; border: none; padding: 16px; 
            border-radius: 12px; font-weight: bold; font-size: 1rem; cursor: pointer; text-transform: uppercase; margin-top: 10px;
        }

        /* RESUMO E PREÇO RISCADO */
        .resumo { background: #222; color: white; border-radius: 20px; padding: 25px; margin-top: 25px; text-align: center; }
        #preco-antigo { text-decoration: line-through; color: #ff4d4d; font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; }
        .v-final { font-size: 2.8rem; font-weight: bold; color: var(--verde); display: block; }
        .selo { display: inline-block; padding: 6px 15px; border-radius: 50px; font-size: 0.75rem; margin-top: 12px; font-weight: bold; text-transform: uppercase; }

        /* WHATSAPP */
        .btn-zap { 
            display: block; background: var(--verde); color: white; text-align: center; padding: 18px; 
            border-radius: 15px; text-decoration: none; font-weight: bold; margin-top: 15px; font-size: 1.1rem;
        }

        /* BARRA DE NAVEGAÇÃO (BOTTOM BAR) */
        .nav-bar { display: flex; justify-content: space-around; align-items: center; background: white; position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; border-top: 1px solid #e0e0e0; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; background: none; border: none; cursor: pointer; color: #777; font-size: 0.75rem; flex: 1; }
        .nav-item.active { color: var(--azul-escuro); font-weight: bold; }
        .nav-icon { font-size: 24px; margin-bottom: 4px; }

        /* ADMIN HIDDEN */
        .admin-trigger { position: absolute; top: 0; right: 0; width: 40px; height: 40px; background: transparent; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">
    
    <div class="header">
        <button class="icon-btn">&#9776;</button>
        <span style="font-weight: bold; color: var(--azul-escuro); letter-spacing: 1px;">REFRICENTER</span>
        <button class="icon-btn">&#128101;</button>
    </div>

    <div class="banner-container">
        <img src="https://i.postimg.cc/4yGchLcy/0377427f-6438-4659-9b4c-18a4392dd696.jpg" class="banner-img" alt="Refricenter Banner">
    </div>

    <div id="inicio" class="tela active">
        <div class="card">
            <div class="titulo-card">Bem-vindo à Refricenter</div>
            <div class="subtitulo-card">"A melhor qualidade para seu bem estar"</div>
            
            <label>Seu Nome Completo:</label>
            <input type="text" id="nome_cliente" placeholder="Ex: João Silva">
            
            <label>Seu Endereço:</label>
            <input type="text" id="end_cliente" placeholder="Rua, Número, Bairro">
            
            <label>Turno de Preferência:</label>
            <select id="turno">
                <option value="Manhã (08h-12h)">Manhã (08h - 12h)</option>
                <option value="Tarde (14h-18h)">Tarde (14h - 18h)</option>
                <option value="A combinar">A combinar com técnico</option>
            </select>
            
            <button class="btn-acao" onclick="salvarEIrParaPrecos()">SALVAR E CONTINUAR</button>
        </div>
    </div>

    <div id="precos" class="tela">
        <div class="card">
            <div class="titulo-card">Tabela de Preços</div>
            <div class="subtitulo-card">Selecione os detalhes do serviço abaixo.</div>

            <label>Quantidade de Aparelhos:</label>
            <select id="qtd" onchange="calc()">
                <option value="1">1 Aparelho</option>
                <option value="2">2 Aparelhos (GANHE 10% OFF)</option>
                <option value="3">3 Aparelhos (GANHE 10% OFF)</option>
            </select>

            <label>Serviço:</label>
            <select id="serv" onchange="renderServico()">
                <option value="Instalação Técnica">🛠️ Instalação Técnica</option>
                <option value="Limpeza Completa">🧼 Limpeza Completa</option>
                <option value="Reposição de Gás">🧪 Reposição de Gás</option>
            </select>

            <div id="extra-inst">
                <label>Material da Instalação:</label>
                <select id="mat" onchange="calc()">
                    <option value="com">Completa (Com Material)</option>
                    <option value="sem">Mão de Obra (Sem Material)</option>
                </select>
            </div>

            <div style="display: flex; gap: 10px;">
                <div style="flex: 2;">
                    <label>Capacidade / Gás:</label>
                    <select id="tipo" onchange="calc()"></select>
                </div>
                <div style="flex: 1;">
                    <label>Localização:</label>
                    <select id="loc" onchange="calc()">
                        <option value="c">Plácido</option>
                        <option value="f">Rural</option>
                    </select>
                </div>
            </div>

            <label>Forma de Pagamento:</label>
            <select id="pagamento" onchange="calc()" style="border: 2px solid var(--verde); font-weight: bold;">
                <option value="cartao">💳 Cartão de Crédito / Débito</option>
                <option value="a_vista">💵 Dinheiro ou PIX (EXTRA 5% OFF)</option>
            </select>

            <div class="resumo">
                <div id="preco-antigo" style="display: none;">R$ 0,00</div>
                <small style="color: #aaa; text-transform: uppercase;">Valor Final Estimado</small>
                <span id="preco" class="v-final">R$ 0,00</span>
                <div id="selo-pagamento" class="selo" style="background: var(--azul-escuro);">PAGAMENTO: CARTÃO</div>
            </div>

            <a id="link-zap" href="#" class="btn-zap" target="_blank">ENVIAR PEDIDO VIA WHATSAPP</a>
        </div>
    </div>

    <div id="games" class="tela">
        <div class="card">
            <div class="titulo-card">🎮 Área de Games</div>
            <p style="text-align: center; color: #777;">Em breve novidades para nossos clientes!</p>
        </div>
    </div>

    <div class="nav-bar">
        <button id="nav-inicio" class="nav-item active" onclick="switchTab('inicio')">
            <span class="nav-icon">🏠</span>
            Início
        </button>
        <button id="nav-precos" class="nav-item" onclick="switchTab('precos')">
            <span class="nav-icon">💰</span>
            Preços
        </button>
        <button id="nav-games" class="nav-item" onclick="switchTab('games')">
            <span class="nav-icon">🎮</span>
            Games
        </button>
    </div>

    <button class="admin-trigger" onclick="checkAdmin()"></button>
</div>

<script>
const zapNum = "5568992447004";

const tabela = {
    "Instalação Técnica": {
        sem: { "9-12k":{c:200, f:300}, "18k":{c:350, f:450}, "22k":{c:400, f:500}, "24k":{c:450, f:550}, "30k":{c:650, f:800}, "36k":{c:750, f:900} },
        com: { "9-12k":{c:600, f:700}, "18k":{c:850, f:950}, "22k":{c:900, f:1000}, "24k":{c:950, f:1050}, "30k":{c:1150, f:1300}, "36k":{c:1250, f:1400} }
    },
    "Limpeza Completa": { "9-12k":{c:200, f:280}, "18k":{c:250, f:330}, "22k":{c:300, f:380}, "24k":{c:350, f:430}, "30k":{c:450, f:550}, "36k":{c:550, f:650} },
    "Reposição de Gás": { "r22":{c:400, f:500}, "r410":{c:450, f:550}, "r32":{c:500, f:600} }
};

function switchTab(tabId) {
    document.querySelectorAll('.tela').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    document.getElementById('nav-' + tabId).classList.add('active');
}

function salvarEIrParaPrecos() {
    const nome = document.getElementById('nome_cliente').value;
    const end = document.getElementById('end_cliente').value;
    if(nome && end) {
        localStorage.setItem('refricenter_nome', nome);
        localStorage.setItem('refricenter_end', end);
        localStorage.setItem('refricenter_turno', document.getElementById('turno').value);
        switchTab('precos');
    } else { alert("Por favor, preencha seu nome e endereço."); }
}

function renderServico() {
    const s = document.getElementById('serv').value;
    const t = document.getElementById('tipo');
    document.getElementById('extra-inst').style.display = (s.includes('Instal')) ? 'block' : 'none';

    if(!s.includes('Gás')) {
        t.innerHTML = '<option value="9-12k">9.000 a 12.000 BTUs</option><option value="18k">18.000 BTUs</option><option value="22k">22.000 BTUs</option><option value="24k">24.000 BTUs</option><option value="30k">30.000 BTUs</option><option value="36k">36.000 BTUs</option>';
    } else {
        t.innerHTML = '<option value="r22">Gás Comum R22</option><option value="r410">Gás Ecológico R410</option><option value="r32">Gás R32 (Inverter)</option>';
    }
    calc();
}

function calc() {
    const s = document.getElementById('serv').value, 
          q = parseInt(document.getElementById('qtd').value),
          tp = document.getElementById('tipo').value, 
          l = document.getElementById('loc').value, 
          mat = document.getElementById('mat').value,
          pag = document.getElementById('pagamento').value;

    let base = (s.includes('Instal')) ? tabela[s][mat][tp][l] : tabela[s][tp][l];
    let valorCheio = base * q;
    
    // Desconto de 10% para 2 ou mais aparelhos
    if (q >= 2) { valorCheio = valorCheio * 0.90; }

    let valorFinal = valorCheio;
    const precoAntigoDiv = document.getElementById('preco-antigo');
    const selo = document.getElementById('selo-pagamento');

    // Desconto Extra 5% Dinheiro/PIX
    if (pag === 'a_vista') {
        valorFinal = valorCheio * 0.95;
        precoAntigoDiv.innerText = "De: R$ " + valorCheio.toFixed(2).replace('.',',');
        precoAntigoDiv.style.display = "block";
        selo.innerText = "🔥 BÔNUS À VISTA ATIVADO";
        selo.style.background = "#25d366";
    } else {
        precoAntigoDiv.style.display = "none";
        selo.innerText = "💳 PAGAMENTO: CARTÃO";
        selo.style.background = "#002D4C";
    }

    document.getElementById('preco').innerText = "R$ " + valorFinal.toFixed(2).replace('.',',');

    // Link WhatsApp
    const nome = localStorage.getItem('refricenter_nome') || "Cliente";
    const end = localStorage.getItem('refricenter_end') || "Não informado";
    const turno = localStorage.getItem('refricenter_turno') || "A combinar";
    const pag_label = pag === 'a_vista' ? 'DINHEIRO/PIX' : 'CARTÃO';

    const msg = encodeURIComponent(
        `*REFRICENTER - PEDIDO DE SERVIÇO*\n\n` +
        `👤 *NOME:* ${nome}\n` +
        `📍 *ENDEREÇO:* ${end}\n` +
        `⏰ *TURNO:* ${turno}\n\n` +
        `🛠️ *SERVIÇO:* ${s}\n` +
        `❄️ *CAPACIDADE:* ${tp}\n` +
        `🔢 *QUANTIDADE:* ${q}\n\n` +
        `✅ *FORMA DE PAGAMENTO:* ${pag_label}\n` +
        `💰 *VALOR TOTAL:* R$ ${valorFinal.toFixed(2).replace('.',',')}`
    );
    document.getElementById('link-zap').href = `https://wa.me/${zapNum}?text=${msg}`;
}

function checkAdmin() {
    if(prompt("Acesso Técnico - Senha:") === "777") {
        alert("Acesso autorizado. Histórico de orçamentos salvo no cache do navegador.");
    }
}

// Carregar dados salvos e iniciar
window.onload = function() {
    document.getElementById('nome_cliente').value = localStorage.getItem('refricenter_nome') || "";
    document.getElementById('end_cliente').value = localStorage.getItem('refricenter_end') || "";
    renderServico();
}
</script>
</body>
</html>
