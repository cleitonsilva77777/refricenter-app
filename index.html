<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refricenter App</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --azul: #002D4C; --verde: #25d366; --bg: #F5F7FA; }
        body { font-family: 'Roboto', sans-serif; background: var(--bg); margin: 0; padding-bottom: 80px; overflow-x: hidden; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: white; border-bottom: 1px solid #ddd; position: sticky; top: 0; z-index: 100; }
        .btn-icon { font-size: 24px; cursor: pointer; background: none; border: none; color: var(--azul); }

        .sidebar { position: fixed; left: -250px; top: 0; width: 250px; height: 100%; background: var(--azul); color: white; transition: 0.3s; z-index: 200; padding-top: 60px; box-shadow: 2px 0 10px rgba(0,0,0,0.3); }
        .sidebar.active { left: 0; }
        .sidebar a { display: block; padding: 15px 25px; color: white; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 150; }
        .overlay.active { display: block; }

        .container-banner { text-align: center; padding: 10px; background: white; }
        .banner-img { width: 85%; max-width: 300px; height: auto; border-radius: 15px; display: inline-block; }
        
        .tela { display: none; padding: 20px; animation: fadeIn 0.3s; }
        .tela.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 20px; border-left: 5px solid var(--azul); }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; font-size: 1rem; }
        
        .btn-acao { width: 100%; background: var(--azul); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .btn-admin-link { display: block; background: #E67E22; color: white; text-align: center; padding: 15px; border-radius: 12px; text-decoration: none; font-weight: bold; margin-top: 20px; }
        .btn-zap { display: block; background: var(--verde); color: white; text-align: center; padding: 15px; border-radius: 12px; text-decoration: none; font-weight: bold; margin-top: 15px; width: 100%; border: none; font-size: 1rem; }

        .resumo { background: #222; color: white; border-radius: 15px; padding: 20px; text-align: center; margin-top: 20px; }
        .v-final { font-size: 2.5rem; font-weight: bold; color: var(--verde); display: block; }
        
        .nav-bar { display: flex; justify-content: space-around; background: white; position: fixed; bottom: 0; width: 100%; height: 70px; border-top: 1px solid #ddd; z-index: 100; }
        .nav-item { border: none; background: none; color: #777; font-size: 0.8rem; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        .nav-item.active { color: var(--azul); font-weight: bold; }
    </style>
</head>
<body>

<div id="overlay" class="overlay" onclick="toggleMenu()"></div>
<div id="sidebar" class="sidebar">
    <div style="text-align: center; padding-bottom: 20px;"><strong>REFRICENTER</strong></div>
    <a href="#" onclick="toggleMenu(); switchTab('inicio')">🏠 Início</a>
    <a href="#" onclick="toggleMenu(); switchTab('precos')">💰 Orçamentos</a>
    <a href="#" onclick="toggleMenu()">ℹ️ Sobre a Empresa</a>
</div>

<div class="header">
    <button class="btn-icon" onclick="toggleMenu()">☰</button>
    <span style="font-weight: bold; color: var(--azul);">REFRICENTER</span>
    <button class="btn-icon" onclick="acessoAdmin()">👤</button>
</div>

<div class="container-banner">
    <img src="banner.png" class="banner-img">
</div>

<div id="inicio" class="tela active">
    <div class="card">
        <h3 style="text-align: center; color: var(--azul);">Identificação</h3>
        <input type="text" id="nome_cliente" placeholder="Nome do Cliente">
        <input type="text" id="end_cliente" placeholder="Endereço / Bairro">
        <button class="btn-acao" onclick="irParaPrecos()">PROSSEGUIR</button>
    </div>
</div>

<div id="precos" class="tela">
    <div class="card">
        <h3 style="text-align: center; color: var(--azul);">Tabela de Preços</h3>
        <select id="serv" onchange="calc()">
            <option value="Limpeza Completa">🧼 Limpeza Completa</option>
            <option value="Instalação Técnica">🛠️ Instalação Técnica</option>
            <option value="Reposição de Gás">🧪 Reposição de Gás</option>
        </select>
        <select id="tipo" onchange="calc()">
            <option value="9-12k">9-12.000 BTUs</option>
            <option value="18k">18.000 BTUs</option>
            <option value="22k">22.000 BTUs</option>
        </select>
        <select id="pagamento" onchange="calc()">
            <option value="cartao">💳 Cartão / Prazo</option>
            <option value="a_vista">💵 Dinheiro ou PIX (5% OFF)</option>
        </select>
        <div class="resumo">
            <span id="preco" class="v-final">R$ 0,00</span>
        </div>
        <button class="btn-zap" onclick="finalizar()">ENVIAR NO WHATSAPP</button>
    </div>
</div>

<div id="admin" class="tela">
    <div class="card">
        <h3 style="text-align: center; color: #ff4d4d;">Painel do Administrador</h3>
        <hr>
        <a href="https://webhook.site/#!/daecd39b-3d58-45db-b689-bf6d8e16d558" target="_blank" class="btn-admin-link">
            🔍 VER TODOS OS ORÇAMENTOS
        </a>
        <p style="font-size: 0.8rem; color: #666; text-align: center; margin-top: 10px;">
            Clique acima para ver o histórico de pedidos.
        </p>
        <button class="btn-acao" style="background: #666; margin-top: 20px;" onclick="switchTab('inicio')">VOLTAR</button>
    </div>
</div>

<div class="nav-bar">
    <button id="nav-inicio" class="nav-item active" onclick="switchTab('inicio')">🏠<br>Início</button>
    <button id="nav-precos" class="nav-item" onclick="switchTab('precos')">💰<br>Preços</button>
</div>

<script>
const tabela = {
    "Instalação Técnica": {"9-12k": 200, "18k": 350, "22k": 400},
    "Limpeza Completa": {"9-12k": 200, "18k": 250, "22k": 300},
    "Reposição de Gás": {"9-12k": 150, "18k": 200, "22k": 250}
};

const MEU_LINK = "https://webhook.site/daecd39b-3d58-45db-b689-bf6d8e16d558";

function toggleMenu() {
    document.getElementById('sidebar').classList.toggle('active');
    document.getElementById('overlay').classList.toggle('active');
}

function acessoAdmin() {
    if(prompt("Senha de Admin:") === "777") switchTab('admin');
}

function switchTab(t) {
    document.querySelectorAll('.tela').forEach(e => e.classList.remove('active'));
    document.getElementById(t).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
    if(document.getElementById('nav-'+t)) document.getElementById('nav-'+t).classList.add('active');
}

function irParaPrecos() {
    if(document.getElementById('nome_cliente').value) switchTab('precos');
    else alert("Por favor, preencha seu nome.");
}

function calc() {
    const s = document.getElementById('serv').value;
    const tp = document.getElementById('tipo').value;
    const pag = document.getElementById('pagamento').value;
    let base = tabela[s][tp];
    let final = (pag === 'a_vista') ? base * 0.95 : base;
    document.getElementById('preco').innerText = "R$ " + final.toFixed(2).replace('.',',');
}

function finalizar() {
    const nome = document.getElementById('nome_cliente').value;
    const end = document.getElementById('end_cliente').value;
    const s = document.getElementById('serv').value;
    const valor = document.getElementById('preco').innerText;

    const dados = { 
        data: new Date().toLocaleString('pt-BR'), 
        cliente: nome, 
        endereco: end, 
        servico: s, 
        total: valor 
    };

    // Envio simplificado para garantir que chegue no histórico
    fetch(MEU_LINK, { 
        method: 'POST', 
        body: JSON.stringify(dados) 
    }).catch(err => console.log("Erro ao registrar"));

    const msg = encodeURIComponent(`*REFRICENTER*\n👤 Cliente: ${nome}\n📍 Endereço: ${end}\n🛠️ Serviço: ${s}\n💰 Valor: ${valor}`);
    window.open("https://wa.me/5568992447004?text=" + msg);
}
calc();
</script>
</body>
</html>
