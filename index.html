<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refricenter App</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --azul: #002D4C; 
            --verde: #25d366; 
            --bg: #F5F7FA; 
        }
        
        body { font-family: 'Roboto', sans-serif; background: var(--bg); margin: 0; padding-bottom: 80px; }
        
        /* CABEÇALHO */
        .header { display: flex; justify-content: space-between; padding: 15px; background: white; border-bottom: 1px solid #ddd; position: sticky; top: 0; z-index: 50; }
        
        /* AJUSTE DO BANNER PNG - Deixando menor e centralizado */
        .container-banner {
            text-align: center;
            padding: 10px;
            background: white;
        }
        .banner-img { 
            width: 85%; /* Ajuste aqui para deixar mais menor ou maior (ex: 70%, 80%) */
            max-width: 300px; /* Limita o tamanho máximo para não perder resolução */
            height: auto; 
            border-radius: 15px; /* Bordas arredondadas para ficar elegante */
            display: inline-block;
        }

        .tela { display: none; padding: 20px; }
        .tela.active { display: block; }
        
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 20px; border-left: 5px solid var(--azul); }
        
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; font-size: 1rem; }
        
        .btn-acao { width: 100%; background: var(--azul); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        
        .resumo { background: #222; color: white; border-radius: 15px; padding: 20px; text-align: center; margin-top: 20px; }
        .v-final { font-size: 2.5rem; font-weight: bold; color: var(--verde); display: block; }
        #preco-antigo { text-decoration: line-through; color: #ff4d4d; font-size: 1rem; font-weight: bold; }
        
        .btn-zap { display: block; background: var(--verde); color: white; text-align: center; padding: 15px; border-radius: 12px; text-decoration: none; font-weight: bold; margin-top: 15px; }
        
        .nav-bar { display: flex; justify-content: space-around; background: white; position: fixed; bottom: 0; width: 100%; height: 70px; border-top: 1px solid #ddd; }
        .nav-item { border: none; background: none; color: #777; font-size: 0.8rem; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        .nav-item.active { color: var(--azul); font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <span style="font-size: 20px;">☰</span>
    <span style="font-weight: bold; color: var(--azul); letter-spacing: 1px;">REFRICENTER</span>
    <span style="font-size: 20px;">👤</span>
</div>

<div class="container-banner">
    <img src="banner.png" class="banner-img" alt="Refricenter">
</div>

<div id="inicio" class="tela active">
    <div class="card">
        <h3 style="text-align: center; margin: 0; color: var(--azul);">Bem-vindo</h3>
        <p style="text-align: center; font-size: 0.85rem; color: #666; font-style: italic;">"A melhor qualidade para seu bem estar"</p>
        <label style="font-size: 0.7rem; font-weight: bold;">SEU NOME:</label>
        <input type="text" id="nome_cliente" placeholder="Ex: João Silva">
        <label style="font-size: 0.7rem; font-weight: bold;">ENDEREÇO:</label>
        <input type="text" id="end_cliente" placeholder="Rua e Bairro">
        <button class="btn-acao" onclick="irParaPrecos()">PROSSEGUIR</button>
    </div>
</div>

<div id="precos" class="tela">
    <div class="card">
        <h3 style="text-align: center; margin: 0; color: var(--azul);">Orçamento Rápido</h3>
        
        <label style="font-size: 0.7rem; font-weight: bold;">QUANTIDADE:</label>
        <select id="qtd" onchange="calc()">
            <option value="1">1 Aparelho</option>
            <option value="2">2 Aparelhos (10% OFF)</option>
            <option value="3">3 ou mais (10% OFF)</option>
        </select>

        <label style="font-size: 0.7rem; font-weight: bold;">SERVIÇO:</label>
        <select id="serv" onchange="renderServico()">
            <option value="Limpeza Completa">🧼 Limpeza Completa</option>
            <option value="Instalação Técnica">🛠️ Instalação Técnica</option>
            <option value="Reposição de Gás">🧪 Reposição de Gás</option>
        </select>

        <div id="extra-inst" style="display:none;">
            <label style="font-size: 0.7rem; font-weight: bold;">MATERIAL:</label>
            <select id="mat" onchange="calc()">
                <option value="com">Com Material</option>
                <option value="sem">Mão de Obra</option>
            </select>
        </div>

        <label style="font-size: 0.7rem; font-weight: bold;">CAPACIDADE / TIPO:</label>
        <select id="tipo" onchange="calc()"></select>

        <label style="font-size: 0.7rem; font-weight: bold;">PAGAMENTO:</label>
        <select id="pagamento" onchange="calc()" style="border: 2px solid var(--verde);">
            <option value="cartao">💳 Cartão / Prazo</option>
            <option value="a_vista">💵 Dinheiro ou PIX (5% OFF)</option>
        </select>

        <div class="resumo">
            <div id="preco-antigo" style="display:none;"></div>
            <span id="preco" class="v-final">R$ 0,00</span>
            <small id="aviso-pag" style="color: var(--verde); font-weight: bold; text-transform: uppercase; font-size: 0.7rem;"></small>
        </div>
        <a id="link-zap" href="#" class="btn-zap" target="_blank">ENVIAR PARA O WHATSAPP</a>
    </div>
</div>

<div id="games" class="tela">
    <div class="card"><h3 style="text-align: center;">🎮 Games</h3><p style="text-align: center;">Área em manutenção.</p></div>
</div>

<div class="nav-bar">
    <button id="nav-inicio" class="nav-item active" onclick="switchTab('inicio')"><span>🏠</span>Início</button>
    <button id="nav-precos" class="nav-item" onclick="switchTab('precos')"><span>💰</span>Preços</button>
    <button id="nav-games" class="nav-item" onclick="switchTab('games')"><span>🎮</span>Games</button>
</div>

<script>
const tabela = {
    "Instalação Técnica": { sem:{"9-12k":200, "18k":350, "22k":400, "24k":450, "30k":650, "36k":750}, com:{"9-12k":600, "18k":850, "22k":900, "24k":950, "30k":1150, "36k":1250} },
    "Limpeza Completa": {"9-12k":200, "18k":250, "22k":300, "24k":350, "30k":450, "36k":550},
    "Reposição de Gás": {"r22":400, "r410":450, "r32":500}
};

function switchTab(t) {
    document.querySelectorAll('.tela').forEach(e => e.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
    document.getElementById(t).classList.add('active');
    document.getElementById('nav-'+t).classList.add('active');
}

function irParaPrecos() {
    if(document.getElementById('nome_cliente').value) switchTab('precos');
    else alert("Por favor, digite seu nome.");
}

function renderServico() {
    const s = document.getElementById('serv').value;
    const t = document.getElementById('tipo');
    document.getElementById('extra-inst').style.display = s.includes('Instal') ? 'block' : 'none';
    if(s.includes('Gás')) t.innerHTML = '<option value="r22">Gás R22</option><option value="r410">Gás R410</option><option value="r32">Gás R32</option>';
    else t.innerHTML = '<option value="9-12k">9-12.000 BTUs</option><option value="18k">18.000 BTUs</option><option value="22k">22.000 BTUs</option><option value="24k">24.000 BTUs</option><option value="30k">30.000 BTUs</option><option value="36k">36.000 BTUs</option>';
    calc();
}

function calc() {
    const s=document.getElementById('serv').value, q=parseInt(document.getElementById('qtd').value), tp=document.getElementById('tipo').value, mat=document.getElementById('mat').value, pag=document.getElementById('pagamento').value;
    let base = s.includes('Instal') ? tabela[s][mat][tp] : tabela[s][tp];
    let total = base * q;
    if(q >= 2) total *= 0.90;
    let final = (pag === 'a_vista') ? total * 0.95 : total;

    document.getElementById('preco-antigo').style.display = pag==='a_vista' ? 'block' : 'none';
    document.getElementById('preco-antigo').innerText = "De: R$ " + total.toFixed(2).replace('.',',');
    document.getElementById('preco').innerText = "R$ " + final.toFixed(2).replace('.',',');
    document.getElementById('aviso-pag').innerText = pag==='a_vista' ? "💰 Desconto de Dinheiro/PIX aplicado" : "";

    const msg = encodeURIComponent(`*REFRICENTER - PEDIDO*\n👤 Cliente: ${document.getElementById('nome_cliente').value}\n🛠️ Serviço: ${s} (${tp})\n💳 Pagamento: ${pag === 'a_vista' ? 'Dinheiro/PIX' : 'Cartão'}\n💰 Valor: R$ ${final.toFixed(2).replace('.',',')}`);
    document.getElementById('link-zap').href = "https://wa.me/5568992447004?text=" + msg;
}
renderServico();
</script>
</body>
</html>
