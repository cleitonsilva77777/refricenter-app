<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refricenter - Orçamentos</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#002D4C">
    <link rel="apple-touch-icon" href="images/icon.png">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            text-align: center;
        }
        header {
            background-color: #002D4C;
            color: white;
            padding: 20px;
        }
        .container {
            padding: 20px;
        }
        .banner {
            width: 100%;
            max-width: 500px;
            border-radius: 10px;
        }
        .servico-card {
            background: white;
            margin: 15px 0;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            text-align: left;
        }
        .servico-card img {
            width: 60px;
            height: 60px;
            margin-right: 15px;
            border-radius: 5px;
        }
        .precos {
            font-weight: bold;
            color: #002D4C;
        }
        .btn-whatsapp {
            background-color: #25d366;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<header>
    <h1>Refricenter</h1>
    <p>Climatização e Refrigeração</p>
</header>

<div class="container">
    <img src="banner.png" alt="Refricenter Banner" class="banner">

    <h2>Nossos Serviços</h2>

    <div class="servico-card">
        <img src="images/limpeza.png" alt="Limpeza">
        <div>
            <strong>Limpeza e Higienização</strong><br>
            <span class="precos">A partir de R$ 150,00</span>
        </div>
    </div>

    <div class="servico-card">
        <img src="images/instalacao.png" alt="Instalação">
        <div>
            <strong>Instalação Completa</strong><br>
            <span class="precos">Consulte orçamento</span>
        </div>
    </div>

    <div class="servico-card">
        <img src="images/gas.png" alt="Carga de Gás">
        <div>
            <strong>Carga de Gás</strong><br>
            <span class="precos">R$ 180,00</span>
        </div>
    </div>

    <div class="servico-card">
        <img src="images/reparo.png" alt="Reparo">
        <div>
            <strong>Manutenção Corretiva</strong><br>
            <span class="precos">Sob consulta</span>
        </div>
    </div>

    <p>* Pagamentos via PIX têm 5% de desconto!</p>

    <a href="https://wa.me/SEUNUMEROAQUI" class="btn-whatsapp">Solicitar Orçamento Agora</a>
</div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('App pronto para uso!', reg))
        .catch(err => console.log('Erro no app:', err));
    });
  }
</script>

</body>
</html>
