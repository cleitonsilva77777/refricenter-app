<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Refricenter - Orçamento</title>

<style>
:root {
  --azul:#0056b3;
  --verde:#28a745;
  --cinza:#f2f2f2;
}

body {
  margin:0;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--cinza);
}

/* CABEÇALHO */
header {
  background: var(--azul);
  color:white;
  padding:15px;
  text-align:center;
  position: relative;
}

.menu {
  position:absolute;
  right:15px;
  top:15px;
  font-size:22px;
  cursor:pointer;
}

/* MENU LATERAL */
#menuLateral {
  position:fixed;
  top:0;
  left:-260px;
  width:240px;
  height:100%;
  background:white;
  box-shadow:2px 0 10px rgba(0,0,0,.2);
  padding:20px;
  transition:.3s;
  z-index:1000;
}

#menuLateral a {
  display:block;
  margin:15px 0;
  text-decoration:none;
  color:#333;
  font-weight:bold;
}

.overlay {
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.4);
  z-index:900;
}

/* BANNER */
.banner {
  width:100%;
  height:200px;
  object-fit:cover;
}

/* CONTEÚDO */
.container {
  padding:15px;
}

/* CAMPOS */
label {
  font-weight:bold;
  margin-top:10px;
  display:block;
}

select {
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #ccc;
  margin-top:5px;
}

/* RESULTADO */
.resultado {
  margin-top:20px;
  padding:15px;
  border-radius:10px;
  background:#e9f7ef;
  text-align:center;
}

.valor {
  font-size:28px;
  font-weight:bold;
  color:var(--verde);
}

/* BOTÃO */
.botao {
  display:block;
  width:100%;
  padding:15px;
  background:var(--verde);
  color:white;
  text-align:center;
  border-radius:10px;
  text-decoration:none;
  font-weight:bold;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<div id="menuLateral">
  <h3>Refricenter</h3>
  <p>Especialistas em instalação, manutenção e limpeza de ar-condicionado.</p>

  <a href="https://instagram.com" target="_blank">📸 Instagram</a>
  <a href="https://facebook.com" target="_blank">📘 Facebook</a>

  <a href="#" onclick="enviarFeedback()">💬 Feedback</a>
</div>

<header>
  <span class="menu" onclick="toggleMenu()">⋮</span>
  <h2>Refricenter</h2>
  <small>Orçamento rápido e profissional</small>
</header>

<img src="https://i.postimg.cc/4yGchLcy/0377427f-6438-4659-9b4c-18a4392dd696.jpg" class="banner">

<div class="container">

  <label>Serviço</label>
  <select id="servico" onchange="calcular()">
    <option value="inst">Instalação</option>
    <option value="limp">Limpeza Completa</option>
    <option value="gas">Carga de Gás</option>
  </select>

  <label>Capacidade</label>
  <select id="btu" onchange="calcular()">
    <option value="9">9.000 / 12.000</option>
    <option value="18">18.000</option>
    <option value="22">22.000</option>
    <option value="24">24.000</option>
    <option value="30">30.000</option>
    <option value="36">36.000</option>
  </select>

  <label>Quantidade</label>
  <select id="qtd" onchange="calcular()">
    <option value="1">1 Aparelho</option>
    <option value="2">2 ou mais</option>
  </select>

  <label>Cidade</label>
  <select id="cidade" onchange="calcular()">
    <option value="placido">Plácido de Castro</option>
    <option value="outra">Acrelândia / Campinas</option>
    <option value="rural">Zona Rural</option>
  </select>

  <div class="resultado">
    <div id="aviso"></div>
    <div class="valor" id="total">R$ 0,00</div>
  </div>

  <a class="botao" id="zap" href="#">Solicitar pelo WhatsApp</a>

</div>

<script>
function toggleMenu(){
  const menu = document.getElementById("menuLateral");
  const overlay = document.getElementById("overlay");
  if(menu.style.left === "0px"){
    menu.style.left = "-260px";
    overlay.style.display = "none";
  } else {
    menu.style.left = "0px";
    overlay.style.display = "block";
  }
}

function calcular(){
  const serv = document.getElementById("servico").value;
  const btu = document.getElementById("btu").value;
  const qtd = Number(document.getElementById("qtd").value);
  const cidade = document.getElementById("cidade").value;

  let preco = 0;

  if(serv === "inst"){
    const tabela = {9:200,18:350,22:400,24:450,30:650,36:750};
    preco = tabela[btu];
  }
  if(serv === "limp") preco = 200;
  if(serv === "gas") preco = 450;

  let total = preco * qtd;

  if(cidade !== "placido") total += 50;

  let desconto = qtd >= 2 ? 0.10 : 0.05;
  total *= (1 - desconto);

  document.getElementById("aviso").innerText =
    qtd >= 2 ? "✅ Desconto de 10% aplicado" : "💡 5% de desconto aplicado";

  document.getElementById("total").innerText =
    total.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});

  const msg = encodeURIComponent(
    `Olá! Quero um orçamento.\nServiço: ${serv}\nBTU: ${btu}\nQtd: ${qtd}\nTotal: ${total}`
  );

  document.getElementById("zap").href =
    `https://wa.me/5568992447004?text=${msg}`;
}

function enviarFeedback(){
  window.open(
    "https://wa.me/5568992447004?text=Olá! Quero deixar um feedback.",
    "_blank"
  );
}

calcular();
</script>

</body>
</html>
