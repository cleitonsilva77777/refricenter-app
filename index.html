<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Refricenter Pro - Sistema Titanium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --blue-main: #01579B; --orange: #FF8F00; --bg: #E0F2F7;
            --white: #FFFFFF; --shadow: 0 4px 12px rgba(0,0,0,0.15);
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); height: 100vh; overflow: hidden; }

        /* HEADER */
        header { 
            background: var(--blue-main); color: white; padding: 10px 15px; 
            display: flex; align-items: center; justify-content: space-between; 
            border-bottom: 4px solid var(--orange); z-index: 1001;
        }
        .brand img { height: 35px; border-radius: 5px; vertical-align: middle; }

        /* SPA NAVIGATION */
        .main-container { height: calc(100vh - 60px); overflow-y: auto; padding: 15px; padding-bottom: 150px; }
        .view { display: none; animation: fadeIn 0.3s ease; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* UI COMPONENTS */
        .card { background: var(--white); border-radius: 15px; padding: 15px; margin-bottom: 15px; box-shadow: var(--shadow); }
        .card-title { font-weight: 800; color: var(--blue-main); border-left: 5px solid var(--orange); padding-left: 10px; margin-bottom: 10px; font-size: 13px; text-transform: uppercase; }
        
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #CFD8DC; font-size: 15px; }
        .btn { background: var(--orange); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 800; width: 100%; cursor: pointer; }

        /* STEPPER IMAGES */
        .step-option { display: flex; align-items: center; gap: 12px; padding: 10px; background: #f8f9fa; border: 1px solid #eee; border-radius: 12px; margin-bottom: 8px; }
        .step-option img { width: 45px; height: 45px; object-fit: contain; }

        /* GAME */
        #game-stage { background: #000; width: 100%; height: 350px; position: relative; overflow: hidden; border-radius: 15px; }
        .player { position: absolute; bottom: 10px; font-size: 35px; transition: 0.1s; }
        .falling { position: absolute; font-size: 25px; }

        /* ADMIN TABLE */
        .admin-table { width: 100%; border-collapse: collapse; font-size: 11px; }
        .admin-table th { background: var(--blue-main); color: white; padding: 5px; }
        .admin-table td { border: 1px solid #eee; padding: 5px; text-align: center; }

        /* DRAWER */
        .drawer { position: fixed; top: 0; left: -100%; width: 260px; height: 100%; background: white; z-index: 2000; transition: 0.3s; box-shadow: 5px 0 15px rgba(0,0,0,0.2); }
        .drawer.open { left: 0; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 15px; border-bottom: 1px solid #f0f0f0; text-decoration: none; color: var(--blue-main); font-weight: 600; }
    </style>
</head>
<body>

<div class="drawer" id="sideNav">
    <div style="background:var(--blue-main); padding:20px; color:white; font-weight:800;">REFRICENTER MENU</div>
    <a href="#" class="nav-item" onclick="navigate('v-serv')"><i class="fas fa-file-invoice-dollar"></i> Orçamentos</a>
    <a href="#" class="nav-item" onclick="navigate('v-calc')"><i class="fas fa-calculator"></i> Calc BTU</a>
    <a href="#" class="nav-item" onclick="navigate('v-diag')"><i class="fas fa-microchip"></i> Guia de Erros</a>
    <a href="#" class="nav-item" onclick="navigate('v-game')"><i class="fas fa-gamepad"></i> Refri-Game</a>
    <a href="#" class="nav-item" onclick="navigate('v-admin')"><i class="fas fa-user-shield"></i> Painel Admin</a>
</div>

<header>
    <div class="brand"><img src="banner.png"> <b>REFRICENTER</b></div>
    <i class="fas fa-bars" style="font-size:24px; color:var(--orange)" onclick="document.getElementById('sideNav').classList.toggle('open')"></i>
</header>

<div class="main-container">
    <div id="v-reg" class="view active">
        <div class="card">
            <div class="card-title">Identificação</div>
            <input type="text" id="reg-nome" placeholder="Nome do Cliente">
            <input type="tel" id="reg-tel" placeholder="WhatsApp">
            <select id="reg-loc">
                <option value="0">Plácido de Castro</option>
                <option value="100">Acrelândia / Interior (+R$100)</option>
            </select>
            <button class="btn" onclick="salvarUsuario()">ACESSAR SISTEMA</button>
        </div>
    </div>

    <div id="v-calc" class="view">
        <div class="card">
            <div class="card-title">Cálculo de Carga Térmica</div>
            <input type="number" id="c-m2" placeholder="Área em m² (Ex: 12)">
            <select id="c-sol">
                <option value="600">Pouco Sol (600 BTU/m²)</option>
                <option value="800">Muito Sol (800 BTU/m²)</option>
            </select>
            <input type="number" id="c-pes" placeholder="Pessoas no local">
            <button class="btn" onclick="executarCalc()">CALCULAR</button>
            <div id="res-calc" style="margin-top:15px; text-align:center; font-weight:bold; color:var(--blue-main)"></div>
        </div>
    </div>

    <div id="v-serv" class="view">
        <div id="step-1">
            <div class="card-title">Selecione o Equipamento</div>
            <div class="step-option" onclick="goStep2('conv')"><img src="https://cdn-icons-png.flaticon.com/512/950/950244.png"> <b>Split Convencional</b></div>
            <div class="step-option" onclick="goStep2('inv')"><img src="https://cdn-icons-png.flaticon.com/512/2933/2933801.png"> <b>Split Inverter</b></div>
        </div>
        <div id="step-2" style="display:none">
            <div class="card-title">Tipo de Serviço</div>
            <div id="serv-list"></div>
            <button class="btn" style="background:#ccc" onclick="document.getElementById('step-1').style.display='block';document.getElementById('step-2').style.display='none'">VOLTAR</button>
        </div>
    </div>

    <div id="v-admin" class="view">
        <div class="card">
            <div class="card-title">Histórico Geral de Pedidos</div>
            <div style="overflow-x:auto">
                <table class="admin-table">
                    <thead><tr><th>Data</th><th>Cliente</th><th>Total</th></tr></thead>
                    <tbody id="admin-list"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="v-game" class="view">
        <div class="card">
            <div id="game-stage">
                <div id="score" style="color:white; padding:10px;">Pontos: 0</div>
                <div id="player" class="player">👨‍🔧</div>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; margin-top:10px;">
                <button class="btn" onmousedown="moveLeft()"><i class="fas fa-arrow-left"></i></button>
                <button class="btn" style="background:#00B0FF" onclick="shootWater()"><i class="fas fa-tint"></i></button>
                <button class="btn" onmousedown="moveRight()"><i class="fas fa-arrow-right"></i></button>
            </div>
            <button class="btn" style="background:red; margin-top:10px;" onclick="startGame()">INICIAR JOGO</button>
        </div>
    </div>
</div>

<script>
    let user = null; let pedidos = JSON.parse(localStorage.getItem('refri_pedidos') || '[]');
    
    function navigate(v) {
        document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
        document.getElementById(v).classList.add('active');
        document.getElementById('sideNav').classList.remove('open');
        if(v === 'v-admin') renderAdmin();
    }

    function salvarUsuario() {
        const n = document.getElementById('reg-nome').value;
        if(!n) return alert("Informe seu nome");
        user = { nome: n, taxa: parseFloat(document.getElementById('reg-loc').value) };
        navigate('v-serv');
    }

    // --- CALCULADORA ---
    function executarCalc() {
        const m2 = parseFloat(document.getElementById('c-m2').value);
        const sol = parseInt(document.getElementById('c-sol').value);
        const pes = parseInt(document.getElementById('c-pes').value || 0);
        if(!m2) return alert("Insira a metragem");
        let btu = (m2 * sol) + (pes * 600);
        let sug = btu <= 9000 ? "9.000" : btu <= 12000 ? "12.000" : btu <= 18000 ? "18.000" : "24.000+";
        document.getElementById('res-calc').innerHTML = `Necessário: ${btu} BTUs<br>Recomendado: ${sug} BTUs`;
    }

    // --- SERVIÇOS ---
    function goStep2(t) {
        document.getElementById('step-1').style.display = 'none';
        document.getElementById('step-2').style.display = 'block';
        const list = document.getElementById('serv-list');
        list.innerHTML = `
            <div class="step-option" onclick="finalizar('Limpeza', 150)">🚿 Higienização - R$ 150</div>
            <div class="step-option" onclick="finalizar('Instalação', 250)">🛠️ Instalação - R$ 250</div>
            <div class="step-option" onclick="finalizar('Carga Gás', 400)">❄️ Carga de Gás - R$ 400</div>
        `;
    }

    function finalizar(serv, preco) {
        const total = preco + (user?.taxa || 0);
        const p = { data: new Date().toLocaleDateString(), cliente: user.nome, total: total, serv: serv };
        pedidos.push(p);
        localStorage.setItem('refri_pedidos', JSON.stringify(pedidos));
        alert("Pedido registrado e enviado ao Administrador!");
        window.open(`https://wa.me/5568992447004?text=Olá, sou ${user.nome}. Solicito ${serv}. Total com deslocamento: R$ ${total}`);
    }

    function renderAdmin() {
        const list = document.getElementById('admin-list');
        list.innerHTML = pedidos.map(p => `<tr><td>${p.data}</td><td>${p.cliente}</td><td>R$ ${p.total}</td></tr>`).join('');
    }

    // --- REFRI-GAME CORRIGIDO ---
    let gameActive = false; let score = 0; let px = 50;
    function startGame() {
        if(gameActive) return;
        gameActive = true; score = 0;
        document.getElementById('score').innerText = "Pontos: 0";
        const loop = setInterval(() => {
            if(!gameActive) return clearInterval(loop);
            spawnItem();
        }, 1200);
    }

    function spawnItem() {
        const item = document.createElement('div');
        const isFire = Math.random() > 0.4;
        item.className = 'falling';
        item.innerHTML = isFire ? '🔥' : '❄️';
        item.style.left = Math.random() * 90 + '%';
        item.style.top = '0px';
        document.getElementById('game-stage').appendChild(item);

        let pos = 0;
        const fall = setInterval(() => {
            pos += 4; item.style.top = pos + 'px';
            if(pos > 320) {
                const rect = item.getBoundingClientRect();
                const pRect = document.getElementById('player').getBoundingClientRect();
                if(rect.left < pRect.right && rect.right > pRect.left) {
                    if(isFire) { alert("O Ar superaqueceu! Fim de jogo."); gameActive = false; }
                    else { score += 10; document.getElementById('score').innerText = "Pontos: " + score; }
                }
                item.remove(); clearInterval(fall);
            }
        }, 30);
    }

    function shootWater() {
        const drop = document.createElement('div');
        drop.innerHTML = '💧'; drop.className = 'falling';
        drop.style.left = px + '%'; drop.style.bottom = '40px';
        document.getElementById('game-stage').appendChild(drop);
        let b = 40;
        const up = setInterval(() => {
            b += 10; drop.style.bottom = b + 'px';
            document.querySelectorAll('.falling').forEach(f => {
                if(f.innerHTML === '🔥') {
                    const r = f.getBoundingClientRect(); const d = drop.getBoundingClientRect();
                    if(d.top < r.bottom && d.left < r.right && d.right > r.left) {
                        f.remove(); drop.remove(); score += 20; 
                        document.getElementById('score').innerText = "Pontos: " + score;
                    }
                }
            });
            if(b > 350) { drop.remove(); clearInterval(up); }
        }, 20);
    }

    function moveLeft() { px = Math.max(0, px - 10); document.getElementById('player').style.left = px + '%'; }
    function moveRight() { px = Math.min(90, px + 10); document.getElementById('player').style.left = px + '%'; }
</script>
</body>
</html>
