<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refricenter - Orçamentos</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#002D4C">
    <link rel="apple-touch-icon" href="images/icon.png">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; color: #333; }
        header { background-color: #002D4C; color: white; padding: 20px; text-align: center; }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        .banner { width: 100%; border-radius: 10px; margin-bottom: 15px; }
        .calculadora { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: left; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        select, input { width: 100%; padding: 12px; margin-top: 8px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
        .resultado { background: #e7f3ff; padding: 15px; border-radius: 8px; margin-top: 20px; border-left: 5px solid #002D4C; }
        .total-valor { font-size: 1.5em; color: #002D4C; font-weight: bold; margin-top: 10px; }
        .desconto-msg { color: #28a745; font-weight: bold; font-size: 0.9em; }
        .btn-whatsapp { background-color: #25d366; color: white; padding: 15px; text-decoration: none; border-radius: 5px; font-weight: bold; display: block; margin-top: 20px; text-align: center; font-size: 18px; }
    </style>
</head>
<body>

<header>
    <h1>Refricenter</h1>
    <p>Tabela de Instalação Oficial</p>
</header>

<div class="container">
    <img src="banner.png" alt="Refricenter Banner" class="banner">

    <div class="calculadora">
        <label>Potência do Aparelho (BTUs):</label>
        <select id="potencia" onchange="calcular()">
            <option value="0" data-obra="0" data-completa="0">Selecione a Potência...</option>
            <option value="912" data-obra="200" data-completa="600">9.000 e 12.000 BTUs</option>
            <option value="18" data-obra="350" data-completa="850">18.000 BTUs</option>
            <option value="22" data-obra="400" data-completa="900">22.000 BTUs</option>
            <option value="24" data-obra="450" data-completa="950">24.000 BTUs</option>
            <option value="30" data-obra="650" data-completa="1150">30.000 BTUs</option>
            <option value="36" data-obra="750" data-completa="1250">36.000 BTUs</option>
        </select>

        <label>Tipo de Serviço:</label>
        <select id="tipo" onchange="calcular()">
            <option value="obra">Só Mão de Obra (Sem material)</option>
            <option value="completa">Completa (Com material)</option>
        </select>

        <label>Quantidade:</label>
        <input type="number" id="qtd" value="1" min="1" oninput="calcular()">

        <label>Pagamento:</label>
        <select id="pagamento" onchange="calcular()">
            <option value="normal">Cartão / Normal</option>
            <option value="pix">PIX (5% de Desconto)</option>
        </select>

        <div class="resultado">
            <div id="detalhes">Aguardando seleção...</div>
            <div class="total-valor" id="total-final">Total: R$ 0,00</div>
            <div id="msg-pix" class="desconto-msg"></div>
        </div>

        <a id="link-zap" href="#" target="_blank" class="btn-whatsapp">Solicitar via WhatsApp</a>
    </div>
</div>

<script>
    function calcular() {
        const select = document.getElementById('potencia');
        const opcao = select.options[select.selectedIndex];
        const tipo = document.getElementById('tipo').value;
        const qtd = parseInt(document.getElementById('qtd').value) || 1;
        const pagamento = document.getElementById('pagamento').value;

        // Puxa os preços direto da tabela oficial que você passou
        let precoBase = (tipo === 'obra') ? parseFloat(opcao.getAttribute('data-obra')) : parseFloat(opcao.getAttribute('data-completa'));

        if (precoBase === 0) return;

        let subtotal = precoBase * qtd;
        let total = subtotal;
        let desconto = 0;

        if (pagamento === 'pix') {
            desconto = subtotal * 0.05;
            total = subtotal - desconto;
            document.getElementById('msg-pix').innerText = "✓ Desconto de 5% aplicado!";
        } else {
            document.getElementById('msg-pix').innerText = "";
        }

        document.getElementById('detalhes').innerHTML = `<strong>Serviço:</strong> Instalação ${opcao.text}<br><strong>Modalidade:</strong> ${tipo === 'obra' ? 'Só Mão de Obra' : 'Completa'}`;
        document.getElementById('total-final').innerText = `Total: R$ ${total.toFixed(2)}`;

        const msg = `Olá Refricenter! %0AOrçamento: Instalação ${opcao.text}%0ATipo: ${tipo}%0AQtd: ${qtd}%0APagamento: ${pagamento.toUpperCase()}%0A*Total: R$ ${total.toFixed(2)}*`;
        document.getElementById('link-zap').href = `https://wa.me/5568999999999?text=${msg}`;
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js'); });
    }
</script>
</body>
</html>
