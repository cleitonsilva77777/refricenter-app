<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Refricenter 2.0 Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --blue: #01579B; --orange: #FF8F00; --green: #2e7d32; --light: #f4f7f9; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--light); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        header { background: var(--blue); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--orange); z-index: 1000; }
        
        /* Menu Lateral */
        .drawer { position: fixed; top: 0; left: -100%; width: 80%; height: 100%; background: white; z-index: 2000; transition: 0.3s; box-shadow: 5px 0 15px rgba(0,0,0,0.2); }
        .drawer.open { left: 0; }
        .drawer-item { padding: 20px; border-bottom: 1px solid #eee; color: var(--blue); font-weight: bold; display: flex; align-items: center; gap: 10px; cursor: pointer; }

        .container { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 80px; }
        .view { display: none; }
        .view.active { display: block; }

        .card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
        select, input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
        
        .btn { width: 100%; padding: 15px; border-radius: 8px; border: none; font-weight: bold; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 5px; }
        .bg-blue { background: var(--blue); }
        .bg-green { background: var(--green); }
        .bg-orange { background: var(--orange); }

        /* GAME REESTRUTURADO */
        #game-container { position: relative; width: 100%; height: 350px; background: #000c18; border-radius: 12px; overflow: hidden; touch-action: none; }
        #player { position: absolute; bottom: 10px; font-size: 40px; transform: translateX(-50%); transition: 0.1s; z-index: 10; }
        .falling { position: absolute; font-size: 25px; z-index: 5; }
        .game-ui { display: flex; justify-content: space-between; padding: 10px; color: white; font-weight: bold; background: rgba(0,0,0,0.5); }

        footer { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 12px; border-top: 2px solid #ddd; }
        .nav-item { text-align: center; text-decoration: none; color: #666; font-size: 0.7rem; flex: 1; }
        .nav-item i { display: block; font-size: 1.3rem; margin-bottom: 3px; }
        .nav-item.active { color: var(--blue); }
    </style>
</head>
<body>

<header>
    <i class="fas fa-bars" onclick="toggleMenu()" style="cursor:pointer"></i>
    <div style="font-weight:900">REFRICENTER 2.0</div>
    <i class="fas fa-user-circle" onclick="nav('v-profile')"></i>
</header>

<nav class="drawer" id="drawer">
    <div style="background:var(--blue); color:white; padding:30px 20px; font-weight:bold;">MENU REFRICENTER</div>
    <div class="drawer-item" onclick="nav('v-orc')"><i class="fas fa-file-invoice-dollar"></i> Orçamentos</div>
    <div class="drawer-item" onclick="nav('v-game')"><i class="fas fa-gamepad"></i> Refri-Game</div>
    <div class="drawer-item" onclick="nav('v-profile')"><i class="fas fa-map-marker-alt"></i> Meus Endereços</div>
    <div class="drawer-item" onclick="toggleMenu()" style="color:red"><i class="fas fa-times"></i> Fechar</div>
</nav>

<div class="container">
    
    <div id="v-orc" class="view active">
        <div class="card">
            <img src="images/banner.png" style="width:100%; border-radius:8px; margin-bottom:10px;" onerror="this.style.display='none'">
            <label>Endereço do Serviço:</label>
            <select id="sel-end"></select>

            <label>O que deseja fazer?</label>
            <select id="servico" onchange="checkServico()">
                <option value="">Selecione...</option>
                <option value="instalacao">Instalação Técnica</option>
                <option value="limpeza">Limpeza / Higienização</option>
                <option value="gas">Carga de Gás</option>
                <option value="desinstalacao">Desinstalação</option>
            </select>

            <div id="opcoes-detalhes" style="display:none">
                <label id="lbl-tec">Tecnologia:</label>
                <select id="tecnologia" onchange="calcular()"></select>
                
                <label>Potência:</label>
                <select id="btus" onchange="calcular()">
                    <option value="9k">9.000 BTUs</option>
                    <option value="12k">12.000 BTUs</option>
                    <option value="18k">18.000 BTUs</option>
                    <option value="22k">22.000 BTUs</option>
                    <option value="24k">24.000 BTUs</option>
                </select>

                <div id="box-mat" style="display:none">
                    <label>Material:</label>
                    <select id="material" onchange="calcular()">
                        <option value="nao">Mão de Obra</option>
                        <option value="sim">Com Material</option>
                    </select>
                </div>
            </div>

            <div id="area-preco" class="card" style="display:none; background:#e8f5e9; text-align:center;">
                <h2 id="txt-preco" style="color:var(--green); font-size:2.2rem; margin:10px 0;">R$ 0,00</h2>
                <button class="btn bg-green" onclick="enviarPedido()"><i class="fab fa-whatsapp"></i> ENVIAR PEDIDO</button>
            </div>
        </div>
    </div>

    <div id="v-profile" class="view">
        <div class="card">
            <h2><i class="fas fa-user"></i> Cadastro</h2>
            <input type="text" id="nome" placeholder="Seu Nome">
            <button class="btn bg-blue" onclick="savePerfil()">SALVAR NOME</button>
        </div>
        <div class="card">
            <h2><i class="fas fa-home"></i> Novo Endereço</h2>
            <input type="text" id="end-nome" placeholder="Ex: Minha Casa">
            <input type="text" id="end-rua" placeholder="Rua, Número, Bairro">
            <button class="btn bg-orange" onclick="addEnd()">ADICIONAR</button>
            <div id="lista-end" style="margin-top:15px;"></div>
        </div>
    </div>

    <div id="v-game" class="view">
        <div class="card">
            <div id="game-container">
                <div class="game-ui">
                    <span>PONTOS: <span id="score">0</span></span>
                    <span>RECORDE: <span id="recorde">0</span></span>
                </div>
                <div id="player">👨‍🔧</div>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:10px;">
                <button class="btn bg-blue" onclick="move(-25)"><i class="fas fa-arrow-left"></i></button>
                <button class="btn bg-blue" onclick="move(25)"><i class="fas fa-arrow-right"></i></button>
            </div>
            <button class="btn bg-green" onclick="playGame()">INICIAR JOGO</button>
        </div>
    </div>

</div>

<footer>
    <a href="#" class="nav-item active" onclick="nav('v-orc')"><i class="fas fa-home"></i>Início</a>
    <a href="https://www.facebook.com/share/169ZAyYuUy/" class="nav-item"><i class="fab fa-facebook"></i>Facebook</a>
    <a href="https://www.instagram.com/refricenter_arcondicionado" class="nav-item"><i class="fab fa-instagram"></i>Instagram</a>
    <a href="#" class="nav-item" onclick="nav('v-profile')"><i class="fas fa-user"></i>Perfil</a>
</footer>

<script>
    let db = JSON.parse(localStorage.getItem('refri_v15')) || { nome: "", enderecos: [], recorde: 0 };
    const TABELA = {
        instalacao: { conv: {"9k":200, "12k":200, "18k":300, "22k":350, "24k":400}, inv: {"9k":250, "12k":250, "18k":350, "22k":400, "24k":450}, mat_conv: {"9k":550, "12k":600, "18k":800, "22k":850, "24k":900}, mat_inv: {"9k":600, "12k":650, "18k":850, "22k":900, "24k":950} },
        limpeza: { conv: {"9k":150, "12k":150, "18k":200, "22k":250, "24k":300}, inv: {"9k":200, "12k":200, "18k":250, "22k":300, "24k":350} },
        gas: { R22: {"9k":450, "12k":450, "18k":600, "22k":700, "24k":750}, R410a: {"9k":500, "12k":500, "18k":600, "22k":800, "24k":850}, R32: {"9k":550, "12k":600, "18k":750, "22k":900, "24k":1000} },
        desinstalacao: { conv: {"9k":100, "12k":100, "18k":150, "22k":200, "24k":200}, inv: {"9k":150, "12k":150, "18k":200, "22k":250, "24k":250} }
    };

    function toggleMenu() { document.getElementById('drawer').classList.toggle('open'); }
    function nav(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(document.getElementById('drawer').classList.contains('open')) toggleMenu();
        if(id === 'v-profile') renderEnds();
    }

    function checkServico() {
        const s = document.getElementById('servico').value;
        const det = document.getElementById('opcoes-detalhes');
        if(!s) { det.style.display='none'; return; }
        det.style.display='block';
        document.getElementById('box-mat').style.display = (s === 'instalacao') ? 'block' : 'none';
        const tec = document.getElementById('tecnologia');
        if(s === 'gas') {
            document.getElementById('lbl-tec').innerText = "Tipo de Gás:";
            tec.innerHTML = '<option value="R22">R22</option><option value="R410a">R410a</option><option value="R32">R32</option>';
        } else {
            document.getElementById('lbl-tec').innerText = "Tecnologia:";
            tec.innerHTML = '<option value="conv">Convencional</option><option value="inv">Inverter</option>';
        }
        calcular();
    }

    function calcular() {
        const s = document.getElementById('servico').value;
        const t = document.getElementById('tecnologia').value;
        const b = document.getElementById('btus').value;
        const m = document.getElementById('material').value;
        let preco = 0;
        if(s === 'instalacao') preco = TABELA.instalacao[(m === 'sim' ? 'mat_' : '') + t][b];
        else if(s === 'gas') preco = TABELA.gas[t][b];
        else preco = TABELA[s][t][b];
        document.getElementById('txt-preco').innerText = `R$ ${preco},00`;
        document.getElementById('area-preco').style.display = 'block';
    }

    function savePerfil() { db.nome = document.getElementById('nome').value; save(); alert("Nome salvo!"); }
    function addEnd() {
        const r = document.getElementById('end-rua').value;
        const i = document.getElementById('end-nome').value;
        if(r && i) { db.enderecos.push({i, r}); save(); renderEnds(); }
    }
    function renderEnds() {
        const s = document.getElementById('sel-end');
        const l = document.getElementById('lista-end');
        s.innerHTML = ""; l.innerHTML = "";
        db.enderecos.forEach((e, idx) => {
            s.innerHTML += `<option value="${idx}">${e.i}</option>`;
            l.innerHTML += `<div class="card" style="margin-bottom:5px;">${e.i}: ${e.r}</div>`;
        });
    }
    function save() { localStorage.setItem('refri_v15', JSON.stringify(db)); }

    function enviarPedido() {
        const eIdx = document.getElementById('sel-end').value;
        const end = db.enderecos[eIdx] ? db.enderecos[eIdx].r : "Não informado";
        const msg = `*REFRICENTER*\nCliente: ${db.nome}\nServiço: ${document.getElementById('servico').value}\nPreço: ${document.getElementById('txt-preco').innerText}\nEndereço: ${end}`;
        window.open(`https://wa.me/5568992447004?text=${encodeURIComponent(msg)}`);
    }

    // GAME ENGINE V15
    let gameInt, pPos = 50, score = 0;
    function move(d) { pPos = Math.max(10, Math.min(90, pPos + d)); document.getElementById('player').style.left = pPos + "%"; }
    function playGame() {
        score = 0; document.getElementById('score').innerText = 0;
        clearInterval(gameInt);
        gameInt = setInterval(() => {
            const isFogo = Math.random() > 0.7;
            const item = document.createElement('div');
            item.className = 'falling'; item.innerHTML = isFogo ? '🔥' : '❄️';
            item.style.left = Math.random() * 90 + "%";
            item.style.top = "0px";
            document.getElementById('game-container').appendChild(item);
            let top = 0;
            const fall = setInterval(() => {
                top += isFogo ? 8 : 5; item.style.top = top + "px";
                const pB = document.getElementById('player').getBoundingClientRect(), iB = item.getBoundingClientRect();
                if(iB.bottom > pB.top && iB.left < pB.right && iB.right > pB.left) {
                    if(isFogo) { clearInterval(gameInt); alert("Fim! Total: "+score); if(score > db.recorde) { db.recorde = score; save(); document.getElementById('recorde').innerText = score; } }
                    else { score += 10; document.getElementById('score').innerText = score; }
                    clearInterval(fall); item.remove();
                }
                if(top > 350) { clearInterval(fall); item.remove(); }
            }, 30);
        }, 1000);
    }

    window.onload = () => {
        document.getElementById('recorde').innerText = db.recorde;
        document.getElementById('nome').value = db.nome;
        renderEnds();
    };
</script>
</body>
</html>
