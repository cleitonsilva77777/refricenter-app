<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Refricenter | Orçamento de Serviços</title>

  <style>
    :root{
      --azul:#0d6efd;
      --verde:#198754;
      --cinza:#f1f3f5;
      --vermelho:#dc3545;
    }

    body{
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--cinza);
      display:flex;
      justify-content:center;
    }

    .app{
      width:100%;
      max-width:420px;
      background:#fff;
      min-height:100vh;
      box-shadow:0 0 15px rgba(0,0,0,.1);
    }

    header{
      text-align:center;
      padding:15px;
    }

    header img.logo{
      width:140px;
    }

    header img.banner{
      width:100%;
      border-radius:12px;
      margin-top:10px;
    }

    .content{
      padding:15px;
    }

    label{
      font-weight:bold;
      font-size:14px;
      margin-top:12px;
      display:block;
    }

    select, button{
      width:100%;
      padding:12px;
      margin-top:6px;
      border-radius:10px;
      border:1px solid #ccc;
      font-size:16px;
    }

    button{
      background:var(--azul);
      color:#fff;
      border:none;
      cursor:pointer;
      font-weight:bold;
    }

    .preview{
      margin:15px 0;
      text-align:center;
    }

    .preview img{
      width:100%;
      height:180px;
      object-fit:cover;
      border-radius:12px;
      border:2px solid var(--azul);
    }

    .lista{
      margin-top:10px;
    }

    .item{
      background:#eef2ff;
      padding:10px;
      border-radius:8px;
      margin-bottom:8px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:14px;
    }

    .item span.remover{
      color:var(--vermelho);
      font-weight:bold;
      cursor:pointer;
      margin-left:10px;
    }

    .total{
      margin-top:20px;
      padding:15px;
      border:2px dashed var(--verde);
      border-radius:12px;
      text-align:center;
    }

    .total h2{
      margin:5px 0;
      color:var(--verde);
    }

    .aviso{
      font-size:13px;
      color:#555;
      margin-bottom:5px;
    }

    .btn-whats{
      margin-top:15px;
      background:var(--verde);
      font-size:18px;
    }
  </style>
</head>

<body>
<div class="app">

  <header>
    <img src="./logo.png" class="logo" alt="Refricenter">
    <img src="./banner.png" class="banner" alt="Banner Refricenter">
  </header>

  <div class="content">

    <label>Serviço</label>
    <select id="servico" onchange="atualizarImagem()">
      <option value="limpeza">Limpeza Completa</option>
      <option value="instalacao">Instalação</option>
      <option value="gas">Carga de Gás</option>
      <option value="desinstalacao">Desinstalação</option>
    </select>

    <label>Capacidade (BTUs)</label>
    <select id="btu">
      <option value="9000">9.000 / 12.000</option>
      <option value="18000">18.000</option>
      <option value="22000">22.000</option>
      <option value="24000">24.000</option>
      <option value="30000">30.000</option>
      <option value="36000">36.000</option>
    </select>

    <div class="preview">
      <img id="fotoServico" src="./images/limpeza.png">
    </div>

    <button onclick="adicionar()">Adicionar serviço</button>

    <div class="lista" id="lista"></div>

    <div class="total" id="boxTotal" style="display:none;">
      <div class="aviso" id="aviso"></div>
      <h2 id="total">R$ 0,00</h2>
      <button class="btn-whats" onclick="enviarWhats()">Solicitar no WhatsApp</button>
    </div>

  </div>
</div>

<script>
const fotos = {
  limpeza: "./images/limpeza.png",
  instalacao: "./images/instalacao.png",
  gas: "./images/gas.png",
  desinstalacao: "./images/desinstalacao.png"
};

const precos = {
  limpeza: {9000:200,18000:350,22000:400,24000:450,30000:650,36000:750},
  instalacao:{9000:600,18000:850,22000:900,24000:950,30000:1150,36000:1250},
  gas:{9000:250,18000:300,22000:350,24000:400,30000:450,36000:500},
  desinstalacao:{9000:150,18000:200,22000:250,24000:300,30000:350,36000:400}
};

let pedido=[];

function atualizarImagem(){
  const s=document.getElementById("servico").value;
  document.getElementById("fotoServico").src=fotos[s];
}

function adicionar(){
  const s=document.getElementById("servico").value;
  const b=document.getElementById("btu").value;
  pedido.push({
    servico:s,
    btu:b,
    valor:precos[s][b]
  });
  render();
}

function remover(i){
  pedido.splice(i,1);
  render();
}

function render(){
  const lista=document.getElementById("lista");
  lista.innerHTML="";
  let soma=0;

  pedido.forEach((p,i)=>{
    soma+=p.valor;
    lista.innerHTML+=`
      <div class="item">
        ${p.servico} - ${p.btu} BTUs
        <span>
          R$ ${p.valor.toFixed(2)}
          <span class="remover" onclick="remover(${i})">✕</span>
        </span>
      </div>
    `;
  });

  if(pedido.length===0){
    document.getElementById("boxTotal").style.display="none";
    return;
  }

  let desconto=0;
  if(soma>400) desconto=0.12;
  else if(soma>200) desconto=0.10;

  let total=soma*(1-desconto);

  document.getElementById("aviso").innerText =
    desconto>0 ? `Desconto aplicado: ${desconto*100}%` : "Sem desconto aplicado";

  document.getElementById("total").innerText =
    total.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});

  document.getElementById("boxTotal").style.display="block";
}

function enviarWhats(){
  let msg="Olá! Gostaria de orçamento:%0A";
  pedido.forEach((p,i)=>{
    msg+=`${i+1}. ${p.servico} ${p.btu} BTUs%0A`;
  });
  window.open(`https://wa.me/5568992447004?text=${msg}`);
}
</script>
</body>
</html>
