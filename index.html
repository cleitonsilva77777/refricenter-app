<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REFRICENTER TITANIUM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --bg: #0b1120; --card: #1e293b; --white: #f8fafc; --accent: #012d4a; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--white); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* Header & Sidebar */
        header { background: #000; padding: 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); z-index: 1000; }
        .logo { font-size: 1.5rem; font-weight: 900; color: var(--gold); letter-spacing: 2px; }
        #sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100%; background: #000; z-index: 2000; transition: 0.3s; border-right: 2px solid var(--gold); padding: 20px; }
        #sidebar.active { left: 0; }
        .menu-item { display: flex; align-items: center; gap: 15px; padding: 18px 0; border-bottom: 1px solid #222; color: var(--gold); cursor: pointer; text-decoration: none; font-weight: bold; }

        /* Content Area */
        .main-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 100px; }
        .view { display: none; animation: fadeIn 0.3s; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* UI Components */
        .card { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid rgba(212, 175, 55, 0.2); box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 20px; }
        h3 { color: var(--gold); margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        input, select { width: 100%; padding: 16px; border-radius: 12px; border: 2px solid #334155; background: #0f172a; color: white; margin-bottom: 15px; font-size: 1rem; outline: none; }
        input:focus { border-color: var(--gold); }
        .btn { width: 100%; padding: 18px; border-radius: 12px; border: none; font-weight: 900; cursor: pointer; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-outline { background: transparent; border: 1px solid var(--gold); color: var(--gold); margin-top: 10px; }

        /* Nav Inferior */
        nav { position: fixed; bottom: 0; width: 100%; background: #000; display: flex; justify-content: space-around; padding: 10px 0 30px; border-top: 2px solid var(--gold); }
        .nav-item { text-align: center; color: #64748b; font-size: 0.75rem; cursor: pointer; }
        .nav-item.active { color: var(--gold); }
        .nav-item i { display: block; font-size: 1.5rem; margin-bottom: 4px; }

        /* Estilo Jogos */
        .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        canvas { background: #000; border: 2px solid var(--gold); width: 100%; border-radius: 10px; }
        .dpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 180px; margin: 10px auto; }
        .d-btn { background: var(--card); border: 2px solid var(--gold); color: var(--gold); padding: 15px; border-radius: 10px; text-align: center; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="logo" style="margin-bottom: 30px;">REFRICENTER</div>
    <div class="menu-item" onclick="switchView('v-calc')"><i class="fas fa-calculator"></i> CALCULADORA PRO</div>
    <a href="https://instagram.com" target="_blank" class="menu-item"><i class="fab fa-instagram"></i> INSTAGRAM</a>
    <a href="https://facebook.com" target="_blank" class="menu-item"><i class="fab fa-facebook"></i> FACEBOOK</a>
    <div class="menu-item" onclick="accessAdmin()"><i class="fas fa-user-shield"></i> ADMINISTRADOR</div>
    <div class="menu-item" onclick="toggleMenu()" style="margin-top: 40px; color: #ff4444;"><i class="fas fa-times"></i> FECHAR</div>
</div>

<header>
    <i class="fas fa-bars" onclick="toggleMenu()" style="color:var(--gold); font-size: 1.5rem;"></i>
    <div class="logo">REFRICENTER</div>
    <div style="width: 24px;"></div>
</header>

<div class="main-content">
    
    <div id="v-perfil" class="view active">
        <div class="card">
            <h3><i class="fas fa-user-circle"></i> CADASTRO</h3>
            <input type="text" id="u-name" placeholder="Seu Nome">
            <input type="text" id="u-end" placeholder="Seu Endereço">
            <button class="btn btn-gold" onclick="saveProfile()">SALVAR E ACESSAR</button>
        </div>
    </div>

    <div id="v-calc" class="view">
        <div class="card">
            <h3><i class="fas fa-sun"></i> CÁLCULO DE CARGA TÉRMICA</h3>
            <label>Tamanho do Ambiente (m²):</label>
            <input type="number" id="c-m2" placeholder="Ex: 20">
            
            <label>Período de Sol:</label>
            <select id="c-sol">
                <option value="600">Manhã (Pouco Sol)</option>
                <option value="800">Tarde / Dia Todo (Muito Sol)</option>
            </select>

            <label>Nº de Pessoas no local:</label>
            <input type="number" id="c-pers" value="1">

            <label>Outros Aparelhos Eletrônicos:</label>
            <input type="number" id="c-ele" value="0">

            <button class="btn btn-gold" onclick="calculateBTU()">CALCULAR PRECISÃO</button>
            
            <div id="res-calc" style="display:none; margin-top:20px; text-align:center;">
                <p>Potência Necessária:</p>
                <h2 id="btu-val" style="color:var(--gold)">--</h2>
                <p id="btu-rec" style="font-size:0.9rem; margin-top:10px; color:#94a3b8;"></p>
            </div>
        </div>
    </div>

    <div id="v-orc" class="view">
        <div class="card">
            <h3><i class="fas fa-file-invoice-dollar"></i> ORÇAMENTO RÁPIDO</h3>
            <div id="step1">
                <label>1. Categoria:</label>
                <select id="sel-cat" onchange="loadServicos()">
                    <option value="">Selecione...</option>
                    <option value="inst">Instalação</option>
                    <option value="des">Desinstalação</option>
                    <option value="limp">Manutenção e Gás</option>
                </select>
            </div>
            <div id="step2" style="display:none">
                <label>2. Serviço:</label>
                <select id="sel-serv" onchange="document.getElementById('step3').style.display='block'"></select>
            </div>
            <div id="step3" style="display:none">
                <label>3. Potência:</label>
                <select id="sel-btu" onchange="showFinalPrice()">
                    <option value="">Selecione BTUs...</option>
                    <option value="9k">9.000 BTUs</option>
                    <option value="12k">12.000 BTUs</option>
                    <option value="18k">18.000 BTUs</option>
                    <option value="24k">24.000 BTUs</option>
                </select>
            </div>
            <div id="step-res" style="display:none; text-align:center; margin-top:20px;">
                <h1 id="f-price" style="color:var(--gold); font-size: 2.5rem;">R$ 0,00</h1>
                <button class="btn btn-gold" style="background:#25d366; color:white;" onclick="sendToWhatsApp()"><i class="fab fa-whatsapp"></i> AGENDAR AGORA</button>
                <button class="btn btn-outline" onclick="resetOrc()">REINICIAR</button>
            </div>
        </div>
    </div>

    <div id="v-game" class="view">
        <div class="card">
            <h3><i class="fas fa-gamepad"></i> REFRI-GAMES</h3>
            <div id="game-list" class="game-grid">
                <button class="btn btn-outline" onclick="initSnake()">SNAKE</button>
                <button class="btn btn-outline" onclick="alert('Quiz em breve!')">QUIZ</button>
            </div>
            <div id="snake-ui" style="display:none; margin-top:20px;">
                <canvas id="snakeCanvas" width="300" height="300"></canvas>
                <div class="dpad">
                    <div class="d-btn" style="grid-column:2" onclick="d='U'">▲</div>
                    <div class="d-btn" style="grid-column:1" onclick="d='L'">◀</div>
                    <div class="d-btn" style="grid-column:3" onclick="d='R'">▶</div>
                    <div class="d-btn" style="grid-column:2" onclick="d='D'">▼</div>
                </div>
            </div>
        </div>
    </div>

</div>

<nav>
    <div class="nav-item" id="n-perfil" onclick="switchView('v-perfil')"><i class="fas fa-user"></i>Perfil</div>
    <div class="nav-item" id="n-orc" onclick="switchView('v-orc')"><i class="fas fa-tools"></i>Preços</div>
    <div class="nav-item" id="n-game" onclick="switchView('v-game')"><i class="fas fa-gamepad"></i>Games</div>
</nav>

<script>
    const DATA = {
        inst: { "Convencional": { "9k":200, "12k":250, "18k":350, "24k":450 }, "Inverter": { "9k":250, "12k":300, "18k":400, "24k":500 } },
        des: { "Desinstalação": { "9k":100, "12k":120, "18k":150, "24k":200 } },
        limp: { "Limpeza Geral": { "9k":150, "12k":150, "18k":200, "24k":250 }, "Carga Gás R410": { "9k":400, "12k":450, "18k":550, "24k":700 } }
    };

    let user = JSON.parse(localStorage.getItem('refri_u'));
    function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); }
    
    window.onload = () => { if(user) switchView('v-orc'); };

    function saveProfile() {
        const n = document.getElementById('u-name').value;
        const e = document.getElementById('u-end').value;
        if(n && e) { user = {nome:n, end:e}; localStorage.setItem('refri_u', JSON.stringify(user)); switchView('v-orc'); }
    }

    function switchView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        if(document.getElementById('n-'+id.split('-')[1])) document.getElementById('n-'+id.split('-')[1]).classList.add('active');
        if(document.getElementById('sidebar').classList.contains('active')) toggleMenu();
    }

    // CALCULADORA PROFISSIONAL
    function calculateBTU() {
        const m2 = parseFloat(document.getElementById('c-m2').value);
        const sol = parseInt(document.getElementById('c-sol').value);
        const pers = parseInt(document.getElementById('c-pers').value) - 1; // 1ª pessoa não conta
        const ele = parseInt(document.getElementById('c-ele').value);

        if(!m2) return alert("Digite os m²");

        let total = (m2 * sol) + (pers * 600) + (ele * 600);
        document.getElementById('btu-val').innerText = total.toLocaleString() + " BTUs";
        
        let rec = "";
        if(total <= 9000) rec = "Recomendado: Aparelho de 9.000 BTUs";
        else if(total <= 12000) rec = "Recomendado: Aparelho de 12.000 BTUs";
        else if(total <= 18000) rec = "Recomendado: Aparelho de 18.000 BTUs";
        else rec = "Recomendado: Aparelho de 24.000 BTUs ou superior";
        
        document.getElementById('btu-rec').innerText = rec;
        document.getElementById('res-calc').style.display = 'block';
    }

    // FUNIL PREÇOS
    function loadServicos() {
        const cat = document.getElementById('sel-cat').value;
        const s = document.getElementById('sel-serv');
        s.innerHTML = '<option value="">Qual serviço?</option>';
        if(cat) {
            Object.keys(DATA[cat]).forEach(item => s.innerHTML += `<option value="${item}">${item}</option>`);
            document.getElementById('step2').style.display = 'block';
        }
    }

    function showFinalPrice() {
        const cat = document.getElementById('sel-cat').value;
        const serv = document.getElementById('sel-serv').value;
        const btu = document.getElementById('sel-btu').value;
        document.getElementById('f-price').innerText = `R$ ${DATA[cat][serv][btu]},00`;
        document.getElementById('step-res').style.display = 'block';
    }

    function resetOrc() {
        document.getElementById('step2').style.display = 'none';
        document.getElementById('step3').style.display = 'none';
        document.getElementById('step-res').style.display = 'none';
        document.getElementById('sel-cat').value = "";
    }

    function sendToWhatsApp() {
        const text = `Olá! Me chamo ${user.nome}.\nServiço: ${document.getElementById('sel-serv').value} (${document.getElementById('sel-btu').value})\nValor: ${document.getElementById('f-price').innerText}`;
        window.open(`https://wa.me/5568992447004?text=${encodeURIComponent(text)}`);
    }

    // SNAKE LOGIC
    let d, sCanvas, sCtx, snake, food, sInt;
    function initSnake() {
        document.getElementById('game-list').style.display='none';
        document.getElementById('snake-ui').style.display='block';
        sCanvas = document.getElementById('snakeCanvas'); sCtx = sCanvas.getContext('2d');
        snake = [{x:150, y:150}]; d = null; food = {x:60, y:60};
        clearInterval(sInt);
        sInt = setInterval(drawSnake, 120);
    }
    function drawSnake() {
        sCtx.fillStyle='black'; sCtx.fillRect(0,0,300,300);
        sCtx.fillStyle='gold'; snake.forEach(s=>sCtx.fillRect(s.x, s.y, 14, 14));
        sCtx.fillStyle='red'; sCtx.fillRect(food.x, food.y, 14, 14);
        let h = {...snake[0]};
        if(d=='U') h.y-=15; if(d=='D') h.y+=15; if(d=='L') h.x-=15; if(d=='R') h.x+=15;
        if(d) {
            if(h.x==food.x && h.y==food.y) food={x:Math.floor(Math.random()*19)*15, y:Math.floor(Math.random()*19)*15};
            else snake.pop();
            snake.unshift(h);
        }
    }

    function accessAdmin() { if(prompt("Senha:")==="1234") alert("Acesso Titanium OK"); }
</script>
</body>
</html>
