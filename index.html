<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refricenter Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root { --blue: #007bff; --green: #25d366; --dark: #333; --light: #f4f7f6; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--light); }
        .container { max-width: 500px; margin: auto; background: #fff; min-height: 100vh; padding: 15px; position: relative; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
        
        header { text-align: center; margin-bottom: 20px; }
        header img { width: 100%; max-width: 280px; border-radius: 12px; }
        .menu-dots { position: absolute; top: 15px; right: 15px; font-size: 24px; cursor: pointer; color: #555; z-index: 10; }

        .view { display: none; }
        .card { width: 100%; border-radius: 15px; border: 2px solid #eee; margin-bottom: 15px; overflow: hidden; cursor: pointer; background: #fff; }
        .card.active { border-color: var(--blue); }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card-txt { padding: 15px; text-align: center; font-weight: bold; text-transform: uppercase; }

        .btn { width: 100%; padding: 16px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-blue { background: var(--blue); color: #fff; }
        .btn-green { background: var(--green); color: #fff; }
        
        input, select { width: 100%; padding: 14px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
        .opt { padding: 12px; border: 1px solid #ddd; border-radius: 8px; text-align: center; cursor: pointer; font-weight: bold; font-size: 13px; }
        .opt.active { background: var(--blue); color: #fff; border-color: var(--blue); }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: #fff; padding: 20px; border-radius: 15px; width: 100%; max-width: 400px; }
        
        .resumo-box { background: #f0f7ff; padding: 15px; border-radius: 12px; border: 1px solid #cce5ff; margin-top: 20px; }
        .social-footer { text-align: center; margin-top: 30px; padding: 20px 0; border-top: 1px solid #eee; }
        .social-icons a { font-size: 30px; margin: 0 15px; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="menu-dots" onclick="openModal()"><i class="fas fa-ellipsis-v"></i></div>
    <header><img src="images/banner.png" alt="Refricenter" onerror="this.src='https://via.placeholder.com/300x100?text=Refricenter+Logo'"></header>

    <div id="view-cadastro" class="view">
        <h3 style="text-align:center">Dados do Cliente</h3>
        <input id="nome" type="text" placeholder="Seu Nome Completo">
        <input id="end" type="text" placeholder="Endereço (Rua, Bairro)">
        <label>Cidade do Atendimento:</label>
        <select id="cidade-select">
            <option value="sede">Plácido de Castro (Sede)</option>
            <option value="fora">Campinas</option>
            <option value="fora">Acrelândia</option>
            <option value="fora">Zona Rural</option>
        </select>
        <button class="btn btn-blue" onclick="salvarCadastro()">Iniciar Orçamento</button>
    </div>

    <div id="view-app" class="view">
        <h4 id="boas-vindas" style="text-align:center"></h4>
        <div id="lista-servicos">
            <div class="card" onclick="selS('Limpeza','limpeza.png',this)"><img src="images/limpeza.png"><div class="card-txt">Limpeza Completa</div></div>
            <div class="card" onclick="selS('Instalação','instalacao.png',this)"><img src="images/instalacao.png"><div class="card-txt">Instalação</div></div>
            <div class="card" onclick="selS('Desinstalação','desinstalacao.png',this)"><img src="images/desinstalacao.png"><div class="card-txt">Desinstalação</div></div>
            <div class="card" onclick="selS('Carga Gás','gas.png',this)"><img src="images/gas.png"><div class="card-txt">Carga de Gás</div></div>
            <div class="card" onclick="selS('Reparo','reparo.png',this)"><img src="images/reparo.png" onerror="this.src='images/reparo(avaliação no loc....png'"><div class="card-txt">Reparo (Avaliação Local)</div></div>
        </div>

        <div id="opcoes" style="display:none; background:#f9f9f9; padding:15px; border-radius:15px; border:1px solid #ddd">
            <label>Tecnologia:</label>
            <div class="grid">
                <div class="opt opt-tec" onclick="selTec('Convencional',this)">Convencional</div>
                <div class="opt opt-tec active" onclick="selTec('Inverter',this)">Inverter</div>
            </div>
            <label>Potência:</label>
            <div class="grid">
                <div class="opt opt-btu" onclick="selB('9.000',this)">9k</div><div class="opt opt-btu" onclick="selB('12.000',this)">12k</div>
                <div class="opt opt-btu" onclick="selB('18.000',this)">18k</div><div class="opt opt-btu" onclick="selB('22.000',this)">22k</div>
                <div class="opt opt-btu" onclick="selB('24.000',this)">24k</div><div class="opt opt-btu" onclick="selB('30.000',this)">30k</div>
                <div class="opt opt-btu" onclick="selB('36.000',this)">36k</div>
            </div>
            <div id="area-mat" style="display:none">
                <label>Serviço:</label>
                <div class="opt opt-mat active" onclick="selM('mo',this)">Só Mão de Obra</div>
                <div class="opt opt-mat" style="margin-top:5px" onclick="selM('cp',this)">Completa (+ Material)</div>
            </div>
            <button class="btn btn-blue" onclick="addCarrinho()">Adicionar este Serviço</button>
        </div>

        <div id="carrinho-render" class="resumo-box" style="display:none"></div>
        <button id="btn-whats" class="btn btn-green" style="display:none" onclick="enviarWhats()"><i class="fab fa-whatsapp"></i> Finalizar Pedido</button>

        <div class="social-footer">
            <p>Siga-nos nas redes:</p>
            <div class="social-icons">
                <a href="https://instagram.com/SEU_USER" target="_blank" style="color:#E1306C"><i class="fab fa-instagram"></i></a>
                <a href="https://facebook.com/SEU_USER" target="_blank" style="color:#4267B2"><i class="fab fa-facebook"></i></a>
            </div>
        </div>
    </div>

    <div id="view-admin" class="view">
        <div style="background:var(--dark); color:#fff; padding:20px; border-radius:15px">
            <span>Faturamento Mensal</span>
            <h2 id="fat-total">R$ 0,00</h2>
            <button onclick="fecharMes()" style="background:none; border:1px solid #fff; color:#fff; cursor:pointer">Zerar Tudo</button>
        </div>
        <div id="hist-admin"></div>
        <button class="btn btn-blue" onclick="location.reload()">Sair do Painel</button>
    </div>
</div>

<div id="menuModal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h4>Refricenter Menu</h4>
        <div onclick="alert('Refricenter: Qualidade em ar condicionado!')">Sobre a Empresa</div>
        <hr>
        <input type="password" id="p-admin" placeholder="Senha Admin">
        <button class="btn btn-blue" onclick="loginAdmin()">Acessar Admin</button>
    </div>
</div>

<script>
    const precos = {
        "9.000":{mo:200,cp:600}, "12.000":{mo:200,cp:600}, "18.000":{mo:350,cp:850},
        "22.000":{mo:400,cp:900}, "24.000":{mo:450,cp:950}, "30.000":{mo:650,cp:1150}, "36.000":{mo:750,cp:1250}
    };
    let s, b, m='mo', tec='Inverter', carrinho=[], user;

    window.onload = () => {
        const sessao = localStorage.getItem('ref_sessao');
        user = JSON.parse(localStorage.getItem('ref_user'));
        if(sessao==='admin') { show('view-admin'); resAdmin(); }
        else if(sessao==='user') { show('view-app'); setBoasVindas(); }
        else { show('view-cadastro'); }
    };

    function show(id) { document.querySelectorAll('.view').forEach(v=>v.style.display='none'); document.getElementById(id).style.display='block'; }
    function setBoasVindas() { document.getElementById('boas-vindas').innerText = `Olá, ${user.n}!`; }

    function salvarCadastro() {
        const n=document.getElementById('nome').value, e=document.getElementById('end').value, c=document.getElementById('cidade-select').value;
        if(!n || !e) return alert("Preencha Nome e Endereço!");
        user = { n, e, c };
        localStorage.setItem('ref_user', JSON.stringify(user));
        localStorage.setItem('ref_sessao', 'user');
        setBoasVindas(); show('view-app');
    }

    function selS(nome,img,el) {
        s=nome; document.querySelectorAll('.card').forEach(c=>c.classList.remove('active')); el.classList.add('active');
        if(nome==='Reparo') { carrinho.push({n:'Reparo', d:'Avaliação no Local', v:0}); renderCarrinho(); }
        else { document.getElementById('opcoes').style.display='block'; document.getElementById('area-mat').style.display = (nome==='Instalação')?'block':'none'; }
    }

    function selB(btu,el) { b=btu; document.querySelectorAll('.opt-btu').forEach(o=>o.classList.remove('active')); el.classList.add('active'); }
    function selTec(t,el) { tec=t; document.querySelectorAll('.opt-tec').forEach(o=>o.classList.remove('active')); el.classList.add('active'); }
    function selM(tipo,el) { m=tipo; document.querySelectorAll('.opt-mat').forEach(o=>o.classList.remove('active')); el.classList.add('active'); }

    function addCarrinho() {
        if(!s || !b) return alert("Selecione os BTUs!");
        const v = precos[b][m];
        carrinho.push({n:s, d:`${b}k | ${tec} | ${m==='cp'?'Completa':'Mão de Obra'}`, v:v});
        document.getElementById('opcoes').style.display='none'; renderCarrinho();
    }

    function renderCarrinho() {
        const d=document.getElementById('carrinho-render'); d.style.display='block';
        let sub=0; carrinho.forEach(i=>sub+=i.v);
        let dP=0; if(sub>=1000)dP=0.12; else if(sub>=600)dP=0.08; else if(sub>=300)dP=0.03;
        let vD=sub*dP, taxa=(user.c==='fora')?100:0, total=(sub-vD)+taxa;
        d.innerHTML = "<strong>Itens:</strong><br>";
        carrinho.forEach(i=>d.innerHTML+=`• ${i.n} (${i.d}) - R$ ${i.v}<br>`);
        d.innerHTML += `<hr>Subtotal: R$ ${sub.toFixed(2)}<br>Desconto: -R$ ${vD.toFixed(2)}<br>Taxa Cidade: +R$ ${taxa.toFixed(2)}<br><strong>Total: R$ ${total.toFixed(2)}</strong>`;
        document.getElementById('btn-whats').style.display='flex'; window.vTotal = total;
    }

    function enviarWhats() {
        let txt = `*ORÇAMENTO REFRI CENTER*%0A*Cli:* ${user.n}%0A*Local:* ${user.c==='sede'?'Plácido':'Fora'}%0A%0A`;
        carrinho.forEach(i=>txt+=`• ${i.n} ${i.d}%0A`);
        txt+=`%0A*TOTAL:* R$ ${window.vTotal.toFixed(2)}`;
        const db=JSON.parse(localStorage.getItem('ref_db')||'[]'); db.push({c:user.n, t:window.vTotal}); localStorage.setItem('ref_db', JSON.stringify(db));
        window.open(`https://wa.me/5599999999999?text=${txt}`);
    }

    function loginAdmin() { if(document.getElementById('p-admin').value==='9988'){localStorage.setItem('ref_sessao','admin'); location.reload();} }
    function resAdmin() {
        const db=JSON.parse(localStorage.getItem('ref_db')||'[]'); let t=0;
        db.forEach(p=>t+=p.t); document.getElementById('fat-total').innerText=`R$ ${t.toFixed(2)}`;
    }
    function fecharMes() { if(confirm("Limpar faturamento?")){localStorage.setItem('ref_db','[]'); resAdmin();} }
    function openModal() { document.getElementById('menuModal').style.display='flex'; }
    function closeModal() { document.getElementById('menuModal').style.display='none'; }
</script>
</body>
</html>
