<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Refricenter Pro - Titanium v5.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --blue-main: #01579B; --orange: #FF8F00; --bg: #E0F2F7;
            --white: #FFFFFF; --shadow: 0 4px 12px rgba(0,0,0,0.15);
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* HEADER (Baseado na imagem 1) */
        header { 
            background: var(--blue-main); color: white; padding: 10px 15px; 
            display: flex; align-items: center; justify-content: space-between; 
            border-bottom: 4px solid var(--orange); flex-shrink: 0;
        }
        .brand-box { display: flex; align-items: center; gap: 10px; background: white; padding: 5px 10px; border-radius: 5px; }
        .brand-box img { height: 30px; }

        /* NAVEGAÇÃO / MENU (Baseado na imagem 2) */
        .drawer { position: fixed; top: 0; left: -100%; width: 280px; height: 100%; background: white; z-index: 2000; transition: 0.3s; box-shadow: 10px 0 30px rgba(0,0,0,0.3); }
        .drawer.open { left: 0; }
        .drawer-header { background: var(--blue-main); padding: 25px; color: white; font-weight: 800; font-size: 18px; }
        .nav-item { display: flex; align-items: center; gap: 15px; padding: 18px 25px; border-bottom: 1px solid #f0f0f0; text-decoration: none; color: var(--blue-main); font-weight: 600; }
        .nav-item i { width: 25px; color: var(--blue-main); }
        .highlight-red { border: 2px solid red; border-radius: 10px; margin: 5px 15px; } /* Círculo vermelho da imagem 2 */

        /* CONTAINER PRINCIPAL */
        .main-container { flex-grow: 1; overflow-y: auto; padding: 15px; padding-bottom: 80px; }
        .view { display: none; animation: fadeIn 0.3s ease; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* CARDS (Baseado nas imagens 1, 4, 5 e 6) */
        .card { background: var(--white); border-radius: 20px; padding: 20px; margin-bottom: 15px; box-shadow: var(--shadow); }
        .card-title { font-weight: 800; color: var(--blue-main); border-left: 5px solid var(--orange); padding-left: 12px; margin-bottom: 15px; text-transform: uppercase; font-size: 14px; }
        
        input, select { width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px; border: 1px solid #CFD8DC; font-size: 16px; outline: none; background: #f9f9f9; }
        .btn-calc { background: var(--orange); color: white; border: none; padding: 16px; border-radius: 12px; font-weight: 800; width: 100%; cursor: pointer; text-transform: uppercase; margin-top: 10px; }

        /* LISTA DE SERVIÇOS (Baseado nas imagens 4 e 6) */
        .service-btn { display: flex; align-items: center; gap: 15px; width: 100%; padding: 16px; background: #f8f9fa; border: none; border-radius: 12px; margin-bottom: 10px; text-align: left; font-weight: 600; color: #333; font-size: 16px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .service-btn img { width: 25px; }

        /* GAME STAGE (Baseado na imagem 3) */
        #game-stage { background: #000; width: 100%; height: 350px; position: relative; overflow: hidden; border-radius: 20px; border: 3px solid #eee; }
        .game-score { color: white; padding: 15px; font-weight: 800; font-size: 18px; }
        .p-tech { position: absolute; bottom: 15px; font-size: 45px; transition: 0.1s; z-index: 10; }
        .drop { position: absolute; font-size: 30px; z-index: 5; }
        .game-controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px; }

        .btn-start { background: #ff0000; color: white; border: none; padding: 15px; border-radius: 12px; font-weight: 900; width: 100%; text-transform: uppercase; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="drawer" id="sideNav">
    <div class="drawer-header">REFRICENTER MENU</div>
    <a href="#" class="nav-item" onclick="navigate('v-serv')"><i class="fas fa-file-invoice-dollar"></i> Orçamentos</a>
    <a href="#" class="nav-item" onclick="navigate('v-calc')"><i class="fas fa-calculator"></i> Calc BTU</a>
    <a href="#" class="nav-item highlight-red" onclick="navigate('v-diag')"><i class="fas fa-microchip"></i> Guia de Erros</a>
    <a href="#" class="nav-item" onclick="navigate('v-game')"><i class="fas fa-gamepad"></i> Refri-Game</a>
    <a href="#" class="nav-item" onclick="checkAdmin()"><i class="fas fa-user-shield"></i> Painel Admin</a>
</div>

<header>
    <div class="brand-box">
        <img src="https://cdn-icons-png.flaticon.com/512/950/950244.png" alt="Logo">
        <b style="color: var(--blue-main)">REFRICENTER</b>
    </div>
    <i class="fas fa-bars" style="font-size: 26px; cursor: pointer;" onclick="toggleMenu()"></i>
</header>

<div class="main-container">
    <div id="v-calc" class="view active">
        <div class="card">
            <div class="card-title">Cálculo de Carga Térmica</div>
            <input type="number" id="area" placeholder="Área em m² (Ex: 12)">
            <select id="sol">
                <option value="600">Pouco Sol (600 BTU/m²)</option>
                <option value="800">Muito Sol (800 BTU/m²)</option>
            </select>
            <input type="number" id="pessoas" placeholder="Pessoas no local">
            <button class="btn-calc" onclick="execCalc()">Calcular</button>
            <div id="res-calc" style="margin-top:20px; text-align:center; font-weight:900; color: var(--blue-main);"></div>
        </div>
    </div>

    <div id="v-serv" class="view">
        <div class="card">
            <div class="card-title">Tipo de Serviço</div>
            <button class="service-btn" onclick="fecharPedido('Higienização', 150)">🧼 Higienização - R$ 150</button>
            <button class="service-btn" onclick="fecharPedido('Instalação', 250)">🛠️ Instalação - R$ 250</button>
            <button class="service-btn" onclick="fecharPedido('Carga de Gás', 400)">❄️ Carga de Gás - R$ 400</button>
            <button class="btn-calc" style="background: #999;" onclick="navigate('v-calc')">Voltar</button>
        </div>
    </div>

    <div id="v-diag" class="view">
        <div class="card">
            <div class="card-title">Guia de Erros Digital</div>
            <select id="marca-ar" onchange="showErros()">
                <option value="">Selecione a Marca</option>
                <option value="lg">LG</option>
                <option value="samsung">Samsung</option>
                <option value="gree">Gree</option>
                <option value="midea">Midea</option>
            </select>
            <div id="erro-list" style="margin-top: 15px; font-size: 14px; line-height: 1.6;"></div>
        </div>
    </div>

    <div id="v-game" class="view">
        <div class="card" style="padding: 10px;">
            <div id="game-stage">
                <div class="game-score" id="score">Pontos: 0</div>
                <div id="tech" class="p-tech">👨‍🔧</div>
            </div>
            <div class="game-controls">
                <button class="btn-calc" style="margin:0" onclick="m_left()"><i class="fas fa-arrow-left"></i></button>
                <button class="btn-calc" style="margin:0; background: #00B0FF" onclick="fire()"><i class="fas fa-tint"></i></button>
                <button class="btn-calc" style="margin:0" onclick="m_right()"><i class="fas fa-arrow-right"></i></button>
            </div>
            <button class="btn-start" id="start-btn" onclick="initGame()">Iniciar Jogo</button>
        </div>
    </div>
</div>

<script>
    let gameRun = false; let pts = 0; let posX = 45;
    let user = JSON.parse(localStorage.getItem('refri_u')) || {nome: "Cliente", taxa: 0};

    function toggleMenu() { document.getElementById('sideNav').classList.toggle('open'); }
    function navigate(v) {
        document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
        document.getElementById(v).classList.add('active');
        toggleMenu();
        gameRun = false;
    }

    // --- CORREÇÃO CÁLCULO (IMAGEM 1) ---
    function execCalc() {
        const m2 = parseFloat(document.getElementById('area').value);
        const s = parseInt(document.getElementById('sol').value);
        const p = parseInt(document.getElementById('pessoas').value || 1);
        if(!m2) return alert("Por favor, informe a área!");
        
        const btu = (m2 * s) + ((p-1) * 600);
        let reco = btu <= 9000 ? "9.000" : btu <= 12000 ? "12.000" : btu <= 18000 ? "18.000" : "24.000+";
        document.getElementById('res-calc').innerHTML = `RECOMENDADO: ${reco} BTUs<br><small>Total necessário: ${btu.toLocaleString()} BTUs</small>`;
    }

    // --- LÓGICA DE PEDIDOS (IMAGENS 4, 6) ---
    function fecharPedido(serv, preco) {
        const total = preco + (user.taxa || 0);
        const msg = `Olá Cleiton, gostaria de solicitar: ${serv}. Valor: R$ ${total}`;
        window.open(`https://wa.me/5568992447004?text=${encodeURIComponent(msg)}`);
    }

    // --- GUIA DE ERROS (IMAGEM 2) ---
    const DB_ERROS = {
        lg: "<b>CH05:</b> Erro de Comunicação<br><b>CH02:</b> Sensor de Entrada UI<br><b>CH67:</b> Motor BLDC Travado",
        samsung: "<b>E101:</b> Erro de Comunicação<br><b>E121:</b> Sensor Interno<br><b>E202:</b> Falha na Placa Principal",
        gree: "<b>E6:</b> Falha de Sinal<br><b>H6:</b> Motor Ventilador UI<br><b>F0:</b> Falha de Gás",
        midea: "<b>E1:</b> Erro de EEPROM<br><b>EL:</b> Falha de Comunicação<br><b>EC:</b> Vazamento de Gás"
    };
    function showErros() {
        const m = document.getElementById('marca-ar').value;
        document.getElementById('erro-list').innerHTML = DB_ERROS[m] || "Selecione uma marca.";
    }

    // --- CORREÇÃO DO JOGO (IMAGEM 3) ---
    function m_left() { posX = Math.max(5, posX - 10); document.getElementById('tech').style.left = posX + '%'; }
    function m_right() { posX = Math.min(85, posX + 10); document.getElementById('tech').style.left = posX + '%'; }

    function initGame() {
        if(gameRun) return;
        gameRun = true; pts = 0; posX = 45;
        document.getElementById('start-btn').style.display = 'none';
        document.getElementById('score').innerText = "Pontos: 0";
        const loop = setInterval(() => {
            if(!gameRun) return clearInterval(loop);
            spawnDrop();
        }, 1100);
    }

    function spawnDrop() {
        const d = document.createElement('div');
        const isFire = Math.random() > 0.5;
        d.className = 'drop';
        d.innerHTML = isFire ? '🔥' : '❄️';
        d.style.left = Math.random() * 85 + '%';
        d.style.top = '0px';
        document.getElementById('game-stage').appendChild(d);

        let top = 0;
        const fall = setInterval(() => {
            top += 5; d.style.top = top + 'px';
            const tRec = document.getElementById('tech').getBoundingClientRect();
            const dRec = d.getBoundingClientRect();

            if(dRec.bottom >= tRec.top && dRec.left < tRec.right && dRec.right > tRec.left) {
                if(isFire) { alert("Game Over! Compressor Superaquecido."); gameRun = false; document.getElementById('start-btn').style.display = 'block'; }
                else { pts += 10; document.getElementById('score').innerText = "Pontos: " + pts; }
                d.remove(); clearInterval(fall);
            }
            if(top > 350) { d.remove(); clearInterval(fall); }
        }, 30);
    }

    function fire() {
        if(!gameRun) return;
        const w = document.createElement('div');
        w.innerHTML = '💧'; w.className = 'drop';
        w.style.left = posX + '%'; w.style.bottom = '60px';
        document.getElementById('game-stage').appendChild(w);
        let b = 60;
        const up = setInterval(() => {
            b += 10; w.style.bottom = b + 'px';
            document.querySelectorAll('.drop').forEach(f => {
                if(f.innerHTML === '🔥') {
                    const fr = f.getBoundingClientRect(); const wr = w.getBoundingClientRect();
                    if(wr.top < fr.bottom && wr.left < fr.right && wr.right > fr.left) {
                        f.remove(); w.remove(); pts += 20; 
                        document.getElementById('score').innerText = "Pontos: " + pts;
                    }
                }
            });
            if(b > 350) { w.remove(); clearInterval(up); }
        }, 20);
    }
</script>
</body>
</html>
